name: 🤖 Autonomous_AI_Factory_v84

on:
  workflow_dispatch:

jobs:
  build_factory:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Structure Project (With AndroidX Fix)
        run: |
          mkdir -p app/src/main/java/com/atomic/factory
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # 🚨 الحل الجذري: تفعيل AndroidX و Jetifier يدوياً
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() } 
          }
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript { 
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace "com.atomic.factory"
              compileSdk 33
              defaultConfig { 
                  applicationId "com.atomic.factory"
                  minSdk 24
                  targetSdk 33
                  versionCode 84
                  versionName "84.0"
              }
          }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: 📝 4. Inject Autonomous Logic
        run: |
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?><paths><external-path name="external_files" path="."/></paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <application android:label="Atomic Factory" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.atomic.factory.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="com.atomic.factory.fileprovider" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/factory/MainActivity.kt
          package com.atomic.factory
          import android.content.Intent
          import android.os.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import java.io.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 50, 50, 50)
                      setBackgroundColor(0xFF000000.toInt())
                  }
                  val title = TextView(this).apply { text = "Atomic AI Factory v84\nOFFLINE MAKER"; setTextColor(0xFF00FF00.toInt()); textSize = 20f }
                  val input = EditText(this).apply { hint = "أمر البرومبت..."; setTextColor(0xFFFFFFFF.toInt()) }
                  val btn = Button(this).apply { text = "توليد التطبيق من الهيكس" }
                  layout.addView(title); layout.addView(input); layout.addView(btn)
                  setContentView(layout)

                  btn.setOnClickListener {
                      Toast.makeText(this, "جاري البدء في عملية النحت الذاتي...", Toast.LENGTH_LONG).show()
                      // العملية ستتم محلياً في هاتفك الآن
                  }
              }
          }
          EOF

      - name: 🛠️ 5. Final Build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 6. Export Factory
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Factory-v84
          path: app/build/outputs/apk/debug/*.apk