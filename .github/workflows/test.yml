name: 🧬 GENESIS COMMANDER (The Lobular Architect)

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية الحالية'
        required: false
        default: 'PHASE 0: Build the Arabic Language Lobe. Your first task is to build a Python module to parse a large Arabic vocabulary file and store it in knowledge_base/0_arabic_lobe/.'

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout Phoenix Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 2.1 - AI Generation (Resilient & Lobular)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json", "User-Agent": "Phoenix-Architect/2.0"}
              for i in range(5):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=60)
                      data = res.json()
                      if "candidates" in data:
                          return data['candidates'][0]['content']['parts'][0]['text'].replace("```python", "").replace("```", "").strip()
                      time.sleep(40 * (i+1))
                  except:
                      time.sleep(20)
              return None

          # جلب سياق الأخطاء للإصلاح الذاتي
          error_context = ""
          if os.path.exists("error_log.txt"):
              with open("error_log.txt", "r") as f:
                  error_context = f"\n⚠️ LAST FAILURE ERROR: {f.read()[-600:]}\nPlease fix this in the next iteration."

          # جلب سياق الذاكرة من الفصوص
          context = ""
          if os.path.exists("knowledge_base"):
              for lobe in sorted(os.listdir("knowledge_base")):
                  lobe_path = os.path.join("knowledge_base", lobe)
                  if os.path.isdir(lobe_path):
                      files = sorted([f for f in os.listdir(lobe_path) if f.startswith("task_")])
                      if files:
                          with open(os.path.join(lobe_path, files[-1]), "r") as c:
                              context += f"// Context from {lobe}: {c.read()[-400:]}\n"

          obj = os.getenv("OBJECTIVE")
          prompt = f"Grand Objective: {obj}. {error_context}\nBrain Context:\n{context}\nTask: Write the next self-contained Python script. Respond ONLY with raw code."
          
          code = ask_gemini(prompt)
          if code:
              with open("current_task.py", "w") as f: f.write(code)
              print("✅ Evolutionary Step Generated!")
          else:
              exit(1)
          EOF
          python3 requester.py
          echo "task_payload=$(cat current_task.py | base64 -w 0)" >> $GITHUB_ENV

      - name: 3.1 - Dispatch to Executor
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ env.task_payload }}", "run_id": "${{ github.run_id }}"}'

      - name: 4.1 - Archive & Update Lobular Genome
        if: always()
        run: |
          # إنشاء هيكل الدماغ السبعة
          mkdir -p knowledge_base/{0_arabic_lobe,1_machine_code_lobe,2_physics_math_lobe,3_chemistry_lobe,4_biology_lobe,5_psychology_lobe,6_synthesis_lobe}

          # تحديد الفص المناسب للحفظ
          LOBE="0_arabic_lobe"
          [[ "${{ github.event.inputs.custom_objective }}" == *"Machine Code"* ]] && LOBE="1_machine_code_lobe"
          [[ "${{ github.event.inputs.custom_objective }}" == *"Physics"* || "${{ github.event.inputs.custom_objective }}" == *"Math"* ]] && LOBE="2_physics_math_lobe"
          [[ "${{ github.event.inputs.custom_objective }}" == *"Chemistry"* ]] && LOBE="3_chemistry_lobe"
          [[ "${{ github.event.inputs.custom_objective }}" == *"Biology"* ]] && LOBE="4_biology_lobe"
          [[ "${{ github.event.inputs.custom_objective }}" == *"Psychology"* ]] && LOBE="5_psychology_lobe"

          if [ -f current_task.py ]; then
            COUNT=$(find knowledge_base/$LOBE -name 'task_*.py' | wc -l)
            cp current_task.py "knowledge_base/$LOBE/task_${COUNT}.py"
          fi
          
          # تحديث لوحة التحكم README
          echo "### 🧬 PHOENIX CORE - LOBULAR STATUS" > README.md
          echo "**Current Objective:** ${{ github.event.inputs.custom_objective }}" >> README.md
          echo "**Last Pulse:** $(date -u)" >> README.md
          echo "---" >> README.md
          echo "### Brain Lobes Content:" >> README.md
          for d in knowledge_base/*/ ; do
            echo "- **$(basename $d):** $(find $d -name 'task_*.py' | wc -l) atoms" >> README.md
          done
          
          git config --global user.name 'Phoenix Architect'
          git config --global user.email 'architect@phoenix.ai'
          git add . && git commit -m "Evolution: New knowledge in $LOBE" && git push || echo "No changes"

      - name: 5.1 - Recursive Heartbeat
        if: always()
        env: { GH_TOKEN: "${{ secrets.COMMANDER_PAT }}", OBJ: "${{ github.event.inputs.custom_objective }}" }
        run: |
          sleep 600
          gh workflow run genesis_commander.yml -f custom_objective="$OBJ"