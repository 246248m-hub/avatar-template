name: 🛡️ Absolute_Truth_Test_v105

on:
  workflow_dispatch:

jobs:
  manual_build:
    runs-on: macos-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 💎 2. Create 10GB Data
        run: |
          python3 -c "
          with open('brain.bin', 'wb') as f:
              f.write(b'GENE_START_001')
              f.seek(5 * 1024 * 1024 * 1024)
              f.write(b'GENE_MIDDLE_555')
          "
          echo "✅ 10GB Brain Ready."

      - name: 🏗️ 3. Prepare Source Code
        run: |
          mkdir -p build/obj build/apk/res/layout
          mkdir -p src/com/atomic/seeker
          
          cat << 'EOF' > build/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.seeker">
              <application android:label="Atomic Manual">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/atomic/seeker/MainActivity.kt
          package com.atomic.seeker
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          import java.io.File
          import java.io.RandomAccessFile

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.textSize = 30f
                  try {
                      val brain = File("/sdcard/brain.bin")
                      if (brain.exists()) {
                          val raf = RandomAccessFile(brain, "r")
                          raf.seek(5 * 1024 * 1024 * 1024L)
                          val buffer = ByteArray(15)
                          raf.read(buffer)
                          tv.text = "🔍 V105 SUCCESS:\n\nDATA: " + String(buffer)
                      } else { tv.text = "❌ Brain Not Found" }
                  } catch (e: Exception) { tv.text = "Error: " + e.message }
                  setContentView(tv)
              }
          }
          EOF

      - name: 🛠️ 4. Dynamic Build (Searching for Tools)
        run: |
          # العثور على المسارات الحقيقية للأدوات في macOS السحابي
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 | sort -r | head -n 1)
          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -r | head -n 1)
          PLATFORM=$(find $ANDROID_HOME/platforms -name android.jar | sort -r | head -n 1)
          
          echo "📍 Using AAPT2: $AAPT2"
          echo "📍 Using D8: $D8"
          echo "📍 Using Platform: $PLATFORM"

          echo "🔨 Packaging Resources..."
          $AAPT2 link --manifest build/AndroidManifest.xml -I $PLATFORM -o build/base.apk --java build/gen

          echo "🔨 Compiling Kotlin..."
          kotlinc src/com/atomic/seeker/MainActivity.kt -cp $PLATFORM -d build/obj

          echo "🔨 Dexing..."
          $D8 build/obj/com/atomic/seeker/MainActivity.class --lib $PLATFORM --output build/

          echo "🔨 Merging Final APK..."
          zip -uj build/base.apk build/classes.dex
          cp build/base.apk seeker_v105.apk

      - name: 📱 5. Emulator Truth Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb push brain.bin /sdcard/brain.bin
            adb install seeker_v105.apk
            adb shell am start -n com.atomic.seeker/.MainActivity
            sleep 45
            adb shell screencap -p /sdcard/truth_result.png
            adb pull /sdcard/truth_result.png .

      - name: 📤 6. Upload Proof
        uses: actions/upload-artifact@v4
        with:
          name: Truth-Result-v105
          path: |
            seeker_v105.apk
            truth_result.png