name: 🧬 GENESIS COMMANDER

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'Goal'
        required: false
        default: 'Build a modular AI core from scratch: Start with persistent memory and dynamic logic processing.'

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 1.2 - Bootstrap
        run: |
          mkdir -p knowledge_base
          if [ -z "$(ls -A knowledge_base)" ]; then
            echo "def run(*args, **kwargs): return 'Foundation layer'" > knowledge_base/task_0.py
          fi

      - name: 2.1 - Architect Generation (Gemini 2.0)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          # جمع المعرفة السابقة
          KNOWLEDGE=$(find knowledge_base -maxdepth 1 -name 'task_*.py' -print0 | xargs -0 cat 2>/dev/null | tail -c 6000)
          
          # البرومبت المركز
          PROMPT="You are the ARCHITECT AI. OBJECTIVE: $OBJECTIVE. CURRENT_CORE_FILES: $KNOWLEDGE. 
          INSTRUCTIONS: 1. Write a Python module with a 'run(*args, **kwargs)' function. 
          2. Include a self-test section under 'if __name__ == \"__main__\":'. 
          3. Respond ONLY with the Python code itself."

          # إرسال الطلب (استخدام نموذج 1.5 flash أو 2.0 flash)
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GOOGLE_API_KEY}"
          
          RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" \
            "$API_URL")

          # استخراج الكود وتمريره بشكل آمن
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed -e 's/^```python//' -e 's/^```//' -e 's/```$//' > current_task.py
          
          if [ ! -s current_task.py ]; then echo "Empty response from AI"; exit 1; fi
          
          # إعداد الـ Environment Variable بشكل يحمي الكود
          echo "task_payload<<EOF" >> $GITHUB_ENV
          cat current_task.py >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 3.1 - Dispatch to Executor
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: >
            {
              "task_payload": ${{ toJson(env.task_payload) }},
              "commander_repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}"
            }

      - name: 4.1 - Archive Knowledge
        run: |
          COUNT=$(find knowledge_base -maxdepth 1 -name 'task_*.py' | wc -l)
          cp current_task.py "knowledge_base/task_${COUNT}.py"
          git config --global user.name 'Phoenix Architect'
          git config --global user.email 'architect@phoenix.ai'
          git add .
          git commit -m "Evolution: task_${COUNT}"
          git push || echo "No changes"

      - name: 5.1 - Recursive Loop
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COMMANDER_PAT }}
          OBJ: ${{ github.event.inputs.custom_objective }}
        run: |
          sleep 300
          gh workflow run wakeup.yml --repo ${{ github.repository }} --ref main -f custom_objective="$OBJ"