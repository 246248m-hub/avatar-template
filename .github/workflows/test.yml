name: 🧠 GEMINI_ATOMIC_INJECTOR_v118

on:
  workflow_dispatch:

jobs:
  inject_and_build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 🚀 2. Digital DNA Injection (حشو الملفات بعقل جيمني)
        run: |
          mkdir -p brain_shards
          python3 -c "
          import os, json, time, urllib.request

          def get_gemini_hex(shard_idx):
              api_key = os.environ.get('GOOGLE_API_KEY')
              # الرابط الذي أكدت أنت أنه يعمل
              url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}'
              
              payload = {
                  'contents': [{
                      'parts': [{
                          'text': f'Generate 256 bytes of pure HEX machine code for neural shard {shard_idx}. This is for an advanced AI engine. Output ONLY raw HEX characters, no spaces, no talk.'
                      }]
                  }]
              }
              
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req) as res:
                      data = json.loads(res.read().decode())
                      # استخراج النص النقي
                      raw_text = data['candidates'][0]['content']['parts'][0]['text'].strip()
                      # تنظيف النص ليبقى HEX فقط
                      return ''.join(c for c in raw_text if c in '0123456789ABCDEFabcdef')
              except Exception as e:
                  print(f'Shard {shard_idx} failed: {e}')
                  return '00' * 256

          for i in range(1, 26):
              print(f'🔗 Linking Shard {i}/25 with Gemini Brain...')
              hex_logic = get_gemini_hex(i)
              
              # التأكد من طول الزوجي للـ HEX
              if len(hex_logic) % 2 != 0: hex_logic += '0'
              
              path = f'brain_shards/shard_{i}.bin'
              with open(path, 'wb') as f:
                  f.write(bytes.fromhex(hex_logic))
                  # حجز الـ 400 ميجا (المساحة الاحتمالية)
                  f.seek(400 * 1024 * 1024 - 1)
                  f.write(b'\0')
              time.sleep(1) # للحفاظ على استقرار الـ API
          "

      - name: 🏗️ 3. Export Shards
        uses: actions/upload-artifact@v4
        with:
          name: Neural-Brain-10GB
          path: brain_shards/