name: 🔋 Atomic_Data_Eater_v90

on:
  workflow_dispatch:

jobs:
  build_data_engine:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 🏗️ 2. Structure Data Engine
        run: |
          mkdir -p app/src/main/java/com/atomic/eater
          mkdir -p app/src/main/res/layout
          
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android { 
              namespace "com.atomic.eater"
              compileSdk 33 
              defaultConfig { applicationId "com.atomic.eater"; minSdk 24; targetSdk 33; versionCode 90; versionName "90.0" } 
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

      - name: 🧠 3. Inject Hex-Mining Logic (The 10GB Decoder)
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <application android:label="Atomic Eater" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.atomic.eater.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/eater/MainActivity.kt
          package com.atomic.eater
          import android.os.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.io.*
          import java.nio.channels.FileChannel

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }
                  val log = TextView(this).apply { text = "جاري البحث عن المعلومات المعبأة في الـ 10 جيجا..." }
                  layout.addView(log)
                  setContentView(layout)

                  // مسار الملف المعبأ (الدماغ الرقمي)
                  val brainFile = File(Environment.getExternalStorageDirectory(), "AI_Project/brain.bin")
                  
                  if (brainFile.exists()) {
                      decodeBrainData(brainFile, log)
                  } else {
                      log.text = "❌ لم يتم العثور على brain.bin\nيرجى التأكد من وجود الملف المعبأ بـ 10 جيجا في مجلد AI_Project"
                  }
              }

              private fun decodeBrainData(file: File, log: TextView) {
                  Thread {
                      try {
                          val stream = FileInputStream(file)
                          val channel = stream.channel
                          // قراءة ذكية: نذهب مباشرة للعنوان الذي تبدأ فيه "المعلومات الذكية"
                          val buffer = java.nio.ByteBuffer.allocate(1024)
                          channel.position(1024 * 1024 * 500) // مثال: القفز لكتلة البيانات رقم 500
                          channel.read(buffer)
                          
                          runOnUiThread {
                              log.text = "✅ تم الاتصال بالدماغ الرقمي!\nالمعلومات المعبأة جاهزة للنحت."
                          }
                          channel.close()
                      } catch (e: Exception) {
                          runOnUiThread { log.text = "⚠️ فشل في قراءة البيانات: ${e.message}" }
                      }
                  }.start()
              }
          }
          EOF

      - name: 🛠️ 4. Build Engine
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 5. Export
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Data-Eater
          path: app/build/outputs/apk/debug/*.apk