name: 💉 PHOENIX_IMPLANTATION_SURGERY_v2

on:
  workflow_dispatch:

jobs:
  implant_brain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📦 1. Checkout Current Repo
        uses: actions/checkout@v4

      - name: 🛠️ 2. Install Tools (APKTool, Java, Uber-Signer)
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool default-jre
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          echo "✅ Tools Installed."

      - name: 🧠 3. Download The "Brain" (135MB)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain # الاسم كما هو في سجلاتك
          path: ./final_brain

      - name: 📥 4. Download The "Body" (The Compiler APK)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146013013
          # تم تغيير الاسم هنا بناءً على اقتراح جيتهاب في الـ Logs
          name: Phoenix-Hex-Compiler-v146 
          path: ./temp_body

      - name: 📂 5. Prepare The Surgery Table
        run: |
          # البحث عن الـ APK ونقله
          find ./temp_body -name "*.apk" -exec mv {} ./body.apk \;
          echo "✅ Files located."

      - name: 🔪 6. Decompile & Inject
        run: |
          apktool d body.apk -o decompiled_apk
          mkdir -p ./decompiled_apk/assets/AI_ULTRA
          # نسخ ملفات العقل الـ 25 إلى مجلد الأصول الداخلي
          cp -r ./final_brain/* ./decompiled_apk/assets/AI_ULTRA/
          echo "✅ Surgery Done."

      - name: 🩹 7. Recompile & Sign
        run: |
          apktool b decompiled_apk -o Phoenix_Injected.apk
          java -jar signer.jar --apks Phoenix_Injected.apk
          # جلب الملف الموقع النهائي
          find . -name "*aligned-debugSigned.apk" -exec mv {} Phoenix_Final_Form.apk \;

      - name: 📤 8. Export Final Integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Final_Integrated
          path: Phoenix_Final_Form.apk