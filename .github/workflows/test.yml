name: 🧬 GENESIS COMMANDER (The Eternal Architect)

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية الشاملة'
        required: false
        default: 'PHASE 0: Master Language & Machine Code. Build internal Arabic model and binary manipulation library.'

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 2.1 - AI Generation with Self-Correction
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json"}
              
              for i in range(5):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=60)
                      data = res.json()
                      if "candidates" in data:
                          return data['candidates'][0]['content']['parts'][0]['text'].replace("```python", "").replace("```", "").strip()
                      time.sleep(30 * (i+1))
                  except:
                      time.sleep(20)
              return None

          # 1. قراءة السياق والأخطاء السابقة إن وجدت
          error_context = ""
          if os.path.exists("error_log.txt"):
              with open("error_log.txt", "r") as f:
                  error_context = f"\n⚠️ IMPORTANT: The last script failed with this error: {f.read()[-500:]}\nPlease fix this error in the new script."

          context = ""
          if os.path.exists("knowledge_base"):
              files = sorted([f for f in os.listdir("knowledge_base") if f.startswith("task_")])
              for f in files[-2:]:
                  with open(f"knowledge_base/{f}", "r") as c: context += c.read()[-500:]

          # 2. بناء البرومبت
          objective = os.getenv("OBJECTIVE")
          prompt = f"Grand Objective: {objective}. {error_context} \nContext: {context} \nWrite the next self-contained Python script. Respond ONLY with raw code."

          # 3. جلب الكود وحفظه
          code = ask_gemini(prompt)
          if code:
              with open("current_task.py", "w") as f: f.write(code)
              print("✅ Step Generated.")
          else:
              exit(1)
          EOF
          python3 requester.py
          echo "task_payload=$(cat current_task.py | base64 -w 0)" >> $GITHUB_ENV

      - name: 3.1 - Dispatch to Executor
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ env.task_payload }}", "run_id": "${{ github.run_id }}"}'

      - name: 4.1 - Archive & Self-Monitor
        if: always()
        run: |
          mkdir -p knowledge_base
          if [ -f current_task.py ]; then
            COUNT=$(find knowledge_base -name 'task_*.py' | wc -l)
            cp current_task.py "knowledge_base/task_${COUNT}.py"
          fi
          
          # تحديث لوحة التحكم
          echo "### 🧬 PHOENIX CORE - LIVE LOG" > README.md
          echo "- **Status:** Running Autonomously" >> README.md
          echo "- **Last Update:** $(date -u)" >> README.md
          
          git config --global user.name 'Phoenix Architect'
          git config --global user.email 'architect@phoenix.ai'
          git add . && git commit -m "Cycle Log $(date -u)" && git push || echo "No changes"

      - name: 5.1 - Recursive Loop (The Heartbeat)
        if: always()
        env:
          GH_TOKEN: "${{ secrets.COMMANDER_PAT }}"
          OBJECTIVE: "${{ github.event.inputs.custom_objective }}"
        run: |
          sleep 600
          gh workflow run genesis_commander.yml -f custom_objective="$OBJECTIVE"