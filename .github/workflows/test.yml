name: 🛡️ Absolute_Truth_Test_v104

on:
  workflow_dispatch:

jobs:
  manual_build:
    runs-on: macos-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 💎 2. Create 10GB Data
        run: |
          python3 -c "
          import os
          with open('brain.bin', 'wb') as f:
              f.write(b'GENE_START_001')
              f.seek(5 * 1024 * 1024 * 1024)
              f.write(b'GENE_MIDDLE_555')
          "
          echo "✅ 10GB Brain Ready."

      - name: 🏗️ 3. Manual APK Carving (No Gradle)
        run: |
          # تجهيز المجلدات
          mkdir -p build/gen build/obj build/apk/res/layout
          
          # 1. صنع ملف AndroidManifest بسيط جداً
          cat << 'EOF' > build/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.seeker">
              <application android:label="Atomic Manual">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. كود النشاط (الذي سيقرأ الـ 10 جيجا)
          mkdir -p src/com/atomic/seeker
          cat << 'EOF' > src/com/atomic/seeker/MainActivity.kt
          package com.atomic.seeker
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          import java.io.File
          import java.io.RandomAccessFile

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.textSize = 30f
                  try {
                      val brain = File("/sdcard/brain.bin")
                      if (brain.exists()) {
                          val raf = RandomAccessFile(brain, "r")
                          raf.seek(5 * 1024 * 1024 * 1024L)
                          val buffer = ByteArray(15)
                          raf.read(buffer)
                          tv.text = "🔍 MANUAL BUILD OK:\n\nDATA: " + String(buffer)
                      } else { tv.text = "❌ File Not Found" }
                  } catch (e: Exception) { tv.text = "Error: " + e.message }
                  setContentView(tv)
              }
          }
          EOF

      - name: 🛠️ 4. Compile with Android Tools Directly
        run: |
          # تحديد مسار أدوات الأندرويد في السيرفر
          SDK=$ANDROID_HOME
          PLATFORM=$SDK/platforms/android-33/android.jar
          BUILD_TOOLS=$SDK/build-tools/33.0.0
          
          echo "🔨 Compiling Resources..."
          $BUILD_TOOLS/aapt2 compile --dir build/apk/res -o build/res.zip || true
          $BUILD_TOOLS/aapt2 link --manifest build/AndroidManifest.xml -I $PLATFORM -o build/base.apk
          
          echo "🔨 Compiling Kotlin Code..."
          kotlinc src/com/atomic/seeker/MainActivity.kt -cp $PLATFORM -d build/obj
          
          echo "🔨 Converting to Dex (The Engine)..."
          $BUILD_TOOLS/d8 build/obj/com/atomic/seeker/MainActivity.class --lib $PLATFORM --output build/
          
          echo "🔨 Merging into Final APK..."
          zip -uj build/base.apk build/classes.dex
          mv build/base.apk seeker_manual.apk

      - name: 📱 5. Emulator Truth Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb push brain.bin /sdcard/brain.bin
            adb install seeker_manual.apk
            adb shell am start -n com.atomic.seeker/.MainActivity
            sleep 45
            adb shell screencap -p /sdcard/truth_result.png
            adb pull /sdcard/truth_result.png .

      - name: 📤 6. Final Result
        uses: actions/upload-artifact@v4
        with:
          name: Absolute-No-Gradle-Proof
          path: |
            seeker_manual.apk
            truth_result.png