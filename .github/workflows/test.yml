      - name: 2.1 - Gemini Defines Next Step via cURL
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          KNOWLEDGE=$(find knowledge_base -maxdepth 1 -name '*.py' -print0 | xargs -0 cat 2>/dev/null || echo "None. Initial state.")
          PROMPT="You are an AI teacher. Current knowledge: $KNOWLEDGE. Provide ONLY the next Python lesson code. No markdown, no explanations. Just raw code."
          JSON_DATA=$(jq -n --arg p "$PROMPT" '{contents: [{parts: [{text: $p}]}]}')
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${GOOGLE_API_KEY}"

          # محاولة استدعاء الـ API مع نظام إعادة المحاولة عند الخطأ 429
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST -H "Content-Type: application/json" -d "$JSON_DATA" "$API_URL")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_STATUS" -eq 200 ]; then
              TASK_CODE=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // empty' | sed -e 's/^```python//' -e 's/^```//' -e 's/```$//' | sed '/./,$!d')
              break
            elif [ "$HTTP_STATUS" -eq 429 ]; then
              echo "⚠️ Quota exceeded. Waiting 60 seconds before retry..."
              sleep 60
              RETRY_COUNT=$((RETRY_COUNT+1))
            else
              echo "❌ Error: API returned status $HTTP_STATUS"
              echo "$BODY"
              exit 1
            fi
          done

          if [ -z "$TASK_CODE" ]; then
            echo "❌ Failed to get task after retries."
            exit 1
          fi
          
          echo "task_payload<<EOF" >> $GITHUB_ENV
          echo "$TASK_CODE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV