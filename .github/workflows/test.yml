name: 🎮 🏗️ PHOENIX_MANUAL_FACTORY

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17 (Critical for Android 31+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ 3. Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-dev python3-pip \
          libtool autoconf automake pkg-config zlib1g-dev libssl-dev \
          libffi-dev libgmp-dev libltdl-dev unzip zip curl
          pip3 install --user --upgrade "Cython<3.0" "buildozer==1.5.0"
          echo "export PATH=\$PATH:~/.local/bin" >> $GITHUB_PATH

      - name: 🧠 4. Loading Injected Brain
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain
          path: ./game_project/brain_assets

      - name: 🏗️ 5. Create Game Project & Optimized Spec
        run: |
          mkdir -p game_project
          cat <<EOF > game_project/main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixGame(App):
              def build(self):
                  return Label(text='Phoenix Engine Active\nBit-Level Game Generated')
          if __name__ == '__main__':
              PhoenixGame().run()
          EOF

          cat <<EOF > game_project/buildozer.spec
          [app]
          title = PhoenixGame
          package.name = phoenix.game
          package.domain = org.phoenix
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.2.1
          orientation = portrait
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.api = 33
          android.minapi = 21
          # استخدام إصدار NDK متوافق تماماً مع Java 17
          android.ndk = 25b 
          p4a.branch = master
          EOF

      - name: 🚀 6. The Precision Build (APK)
        run: |
          cd game_project
          # فرض استخدام الجافا الصحيحة داخل البيئة
          export JAVA_HOME=$JAVA_HOME_17_X64
          ~/.local/bin/buildozer -v android debug
        continue-on-error: false

      - name: 📤 7. Export The Phoenix APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Ultimate_Game
          path: game_project/bin/*.apk