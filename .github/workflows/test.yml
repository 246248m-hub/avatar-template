name: 🧬 GENESIS COMMANDER (The Eternal Architect)

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية'
        default: 'PHASE 0: Master Language & Machine Code. Build Arabic NLP model and binary manipulation library.'

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 2.1 - AI Generation with Self-Healing
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json", "User-Agent": "Phoenix-Architect/1.0"}
              
              for i in range(5):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=60)
                      data = res.json()
                      if "candidates" in data:
                          return data['candidates'][0]['content']['parts'][0]['text'].replace("```python", "").replace("```", "").strip()
                      print(f"⚠️ Retry {i+1} due to: {data}")
                      time.sleep(40 * (i+1))
                  except:
                      time.sleep(20)
              return None

          # جلب سياق الأخطاء السابقة للإصلاح
          error_context = ""
          if os.path.exists("error_log.txt"):
              with open("error_log.txt", "r") as f:
                  error_context = f"\n⚠️ PREVIOUS FAILURE ERROR: {f.read()[-600:]}\nFix this error in the new code."

          # جلب سياق الذاكرة السابقة
          context = ""
          if os.path.exists("knowledge_base"):
              files = sorted([f for f in os.listdir("knowledge_base") if f.startswith("task_")])
              for f in files[-3:]:
                  with open(os.path.join("knowledge_base", f), "r") as c: context += c.read()[-800:]

          objective = os.getenv("OBJECTIVE")
          full_prompt = f"Objective: {objective}. {error_context}\nPast Context: {context}\nTask: Write the next self-contained Python script. Respond ONLY with raw code."

          code = ask_gemini(full_prompt)
          if code:
              with open("current_task.py", "w") as f: f.write(code)
              print("✅ Evolution Code Generated.")
          else:
              print("❌ Failed to reach AI Core."); exit(1)
          EOF
          python3 requester.py
          echo "task_payload=$(cat current_task.py | base64 -w 0)" >> $GITHUB_ENV

      - name: 3.1 - Dispatch Order
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ env.task_payload }}", "run_id": "${{ github.run_id }}"}'

      - name: 4.1 - Archive & Sync
        if: always()
        run: |
          mkdir -p knowledge_base
          [ -f current_task.py ] && cp current_task.py "knowledge_base/task_$(date +%s).py"
          echo "### 🧬 PHOENIX CORE STATUS" > README.md
          echo "- **Autonomy:** Active" >> README.md
          echo "- **Last Pulse:** $(date -u)" >> README.md
          git config --global user.name 'Phoenix Architect'
          git config --global user.email 'architect@phoenix.ai'
          git add . && git commit -m "Evolution Cycle $(date +%Y%m%d-%H%M)" && git push || echo "No changes"

      - name: 5.1 - Recursive Heartbeat
        if: always()
        env: { GH_TOKEN: "${{ secrets.COMMANDER_PAT }}", OBJ: "${{ github.event.inputs.custom_objective }}" }
        run: |
          sleep 600
          gh workflow run genesis_commander.yml -f custom_objective="$OBJ"