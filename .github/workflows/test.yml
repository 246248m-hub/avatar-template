name: ✔️ GENESIS COMMANDER

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'Goal'
        default: 'Build a Python module to download arwiki-latest-pages-articles.xml.bz2 and decompress it efficiently.'

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 2.1 - AI Generation (Resilient Stealth)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, base64, os, time

          api_key = os.getenv("GOOGLE_API_KEY")
          obj = os.getenv("OBJECTIVE")
          
          # جربنا 2.5 وكان يعطي 429، الآن نستخدم 1.5 فلاش لضمان الاستقرار في GitHub
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          
          payload = {"contents": [{"parts": [{"text": f"Write ONLY raw Python code to achieve this goal: {obj}. The code must include a run() function and be ready to execute."}]}]}
          headers = {"Content-Type": "application/json"}

          for i in range(1, 4):
              print(f"🤖 Attempt {i} to wake Gemini...")
              try:
                  response = requests.post(url, json=payload, headers=headers)
                  data = response.json()
                  if "candidates" in data:
                      code = data["candidates"][0]["content"]["parts"][0]["text"]
                      clean_code = code.replace("```python", "").replace("```", "").strip()
                      with open("current_task.py", "w") as f:
                          f.write(clean_code)
                      print("✅ Success!")
                      exit(0)
                  else:
                      print(f"⚠️ Quota or API Error: {data.get('error', {}).get('message', 'Unknown')}")
                      time.sleep(45) # انتظار أطول لتجاوز الحظر
              except Exception as e:
                  print(f"❌ Connection error: {e}")
                  time.sleep(20)
          exit(1)
          EOF
          python3 requester.py
          
          ENCODED=$(cat current_task.py | base64 -w 0)
          echo "task_payload=$ENCODED" >> $GITHUB_ENV

      - name: 3.1 - Dispatch to Executor
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ env.task_payload }}", "run_id": "${{ github.run_id }}"}'

      - name: 4.1 - Archive Knowledge
        run: |
          mkdir -p knowledge_base
          COUNT=$(find knowledge_base -name 'task_*.py' | wc -l)
          cp current_task.py "knowledge_base/task_${COUNT}.py"
          git config --global user.name 'Architect'
          git config --global user.email 'ai@genesis.ai'
          git add . && git commit -m "Evolution ${COUNT}" && git push || echo "No changes"

      - name: 5.1 - Recursive Loop (Linked to test.yml)
        if: always()
        env: { GH_TOKEN: "${{ secrets.COMMANDER_PAT }}", OBJ: "${{ github.event.inputs.custom_objective }}" }
        run: |
          echo "Resting for 10 minutes to clear rate limits..."
          sleep 600
          # تم تعديل الاسم هنا ليطابق ملفك test.yml
          gh workflow run test.yml --repo ${{ github.repository }} -f custom_objective="$OBJ"