name: 🧬 GENESIS COMMANDER

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية'
        required: false
        default: 'Build a Python module to download arwiki-latest-pages-articles.xml.bz2 and decompress it efficiently.'

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      # الخطوة 1: جلب الكود والذاكرة
      - name: 1.1 - Checkout Knowledge Base
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      # الخطوة 2: توليد المهمة القادمة باستخدام بايثون (لتجاوز حظر الـ 429)
      - name: 2.1 - AI Generation (Python Resilient Mode)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, base64, os, time, random

          api_key = os.getenv("GOOGLE_API_KEY")
          obj = os.getenv("OBJECTIVE")
          
          # قراءة آخر جزء من الذاكرة لتوفير السياق
          context = ""
          if os.path.exists("knowledge_base"):
              files = sorted([f for f in os.listdir("knowledge_base") if f.startswith("task_")])
              for f in files[-3:]:
                  with open(f"knowledge_base/{f}", "r") as c:
                      context += c.read()[-1000:]

          # الرابط الذهبي الخاص بك
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
          
          payload = {
              "contents": [{
                  "parts": [{"text": f"You are an AI Architect. Objective: {obj}. Context: {context}. Write ONLY raw Python code. No markdown."}]
              }]
          }
          
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Linux; Android 10; SM-G960F)"
          }

          for i in range(1, 6):
              print(f"🤖 Attempt {i}...")
              try:
                  response = requests.post(url, json=payload, headers=headers)
                  data = response.json()
                  if "candidates" in data:
                      code = data['candidates'][0]['content']['parts'][0]['text']
                      clean_code = code.replace("```python", "").replace("```", "").strip()
                      with open("current_task.py", "w") as f:
                          f.write(clean_code)
                      print("✅ Success!")
                      exit(0)
                  elif "error" in data and data["error"]["code"] == 429:
                      wait = i * 40 # انتظار تصاعدي
                      print(f"⚠️ Quota Hit. Sleeping {wait}s...")
                      time.sleep(wait)
                  else:
                      print(f"❌ Error: {data}")
                      time.sleep(10)
              except Exception as e:
                  print(f"⚠️ Connection error: {e}")
                  time.sleep(20)
          exit(1)
          EOF
          python3 requester.py
          
          ENCODED=$(cat current_task.py | base64 -w 0)
          echo "task_payload=$ENCODED" >> $GITHUB_ENV

      # الخطوة 3: إرسال المهمة للمنفذ (Executor)
      - name: 3.1 - Dispatch to Universal Executor
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: >
            {
              "task_payload": "${{ env.task_payload }}",
              "run_id": "${{ github.run_id }}"
            }

      # الخطوة 4: حفظ التطور وتحديث الـ README
      - name: 4.1 - Archive Knowledge
        run: |
          mkdir -p knowledge_base
          COUNT=$(find knowledge_base -name 'task_*.py' | wc -l)
          cp current_task.py "knowledge_base/task_${COUNT}.py"
          
          echo "### 🧬 PHOENIX CORE STATUS" > README.md
          echo "- **Current Objective:** ${{ github.event.inputs.custom_objective }}" >> README.md
          echo "- **Evolution Step:** ${COUNT}" >> README.md
          echo "- **Last Pulse:** $(date)" >> README.md
          
          git config --global user.name 'Architect'
          git config --global user.email 'ai@genesis.ai'
          git add . && git commit -m "Evolution ${COUNT}" && git push || echo "No changes"

      # الخطوة 5: الإحياء الذاتي (مربوط بملف test.yml)
      - name: 5.1 - Recursive Loop
        if: always()
        env:
          GH_TOKEN: "${{ secrets.COMMANDER_PAT }}"
          OBJ: "${{ github.event.inputs.custom_objective }}"
        run: |
          echo "Resting for 600s..."
          sleep 600
          gh workflow run test.yml --repo ${{ github.repository }} -f custom_objective="$OBJ"