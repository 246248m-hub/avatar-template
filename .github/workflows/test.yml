name: 🚀 PHOENIX_FULL_CORE_BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ 3. Install Build Tools
        run: |
          pip3 install --user --upgrade "Cython<3.0" "buildozer==1.5.0"
          echo "export PATH=\$PATH:~/.local/bin" >> $GITHUB_PATH

      - name: 🏗️ 4. Force Injection of 135MB Brain
        run: |
          mkdir -p game_project
          # توليد ملفات وهمية ضخمة لضمان أن العقل محقون (بمثابة العقل الذي ستستبدله أو تدمجه)
          dd if=/dev/urandom of=game_project/brain_core.bin bs=1M count=135
          
          cat <<EOF > game_project/main.py
          import wikipedia
          import binascii
          from kivy.app import App
          from kivy.uix.label import Label
          
          class PhoenixEngine(App):
              def build(self):
                  # كود التحقق من وجود العقل
                  if os.path.exists("brain_core.bin"):
                      size = os.path.getsize("brain_core.bin") / (1024*1024)
                      status = f"Core Active: {size:.1f} MB"
                  else:
                      status = "Core Missing!"
                  return Label(text=f"Phoenix Engine\n{status}")

          if __name__ == '__main__':
              PhoenixEngine().run()
          EOF

      - name: ⚙️ 5. Final Spec Fix (The Inclusion Key)
        run: |
          cat <<EOF > game_project/buildozer.spec
          [app]
          title = PhoenixFullCore
          package.name = phoenix.ultra.full
          package.domain = org.phoenix
          source.dir = .
          # التعديل الذهبي: تضمين كل الصيغ وإلغاء الفلترة
          source.include_exts = py,png,jpg,kv,atlas,bin,hex,dat,so,asset
          source.include_patterns = assets/*, *.bin, *.dat
          version = 1.0
          requirements = python3,kivy==2.2.1,wikipedia,requests,urllib3,chardet,idna
          android.archs = arm64-v8a
          android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, MANAGE_EXTERNAL_STORAGE
          # إجبار النظام على عدم ضغط الملفات التي تحتاج سرعة
          android.no_compress_extensions = bin, hex, dat
          android.api = 33
          android.ndk = 25b
          EOF

      - name: 🚀 6. Build High-Capacity APK
        run: |
          cd game_project
          export JAVA_HOME=$JAVA_HOME_17_X64
          buildozer -v android debug