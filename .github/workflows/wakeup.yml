name: 🧬 GENESIS COMMANDER

on:
  workflow_dispatch:

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 1.2 - Setup
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          mkdir -p knowledge_base

      - name: 2.1 - Gemini Generation (Exact cURL Method)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          KNOWLEDGE=$(find knowledge_base -maxdepth 1 -name '*.py' -print0 | xargs -0 cat 2>/dev/null || echo "First lesson: Setup basics.")
          PROMPT="You are an AI teacher. Current knowledge: $KNOWLEDGE. Provide ONLY the next Python lesson code. No markdown, no explanations. Just raw code."
          
          # إنشاء الـ Payload كما في تجربتك الناجحة
          JSON_DATA=$(jq -n --arg p "$PROMPT" '{contents: [{parts: [{text: $p}]}]}')

          # الرابط الذي أكدت نجاحه
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          
          echo "Sending request to Gemini 2.5-flash-lite..."
          
          # محاولة الطلب مع نظام معالجة خطأ 429
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${GOOGLE_API_KEY}" \
            -d "$JSON_DATA" \
            "$API_URL")

          # فحص إذا كان هناك خطأ في الحصة
          if echo "$RESPONSE" | grep -q "RESOURCE_EXHAUSTED"; then
            echo "⚠️ Quota Exceeded on GitHub side. Waiting 30s before emergency exit..."
            sleep 30
            echo "Please try again later or increase sleep time between cycles."
            exit 1
          fi

          # استخراج الكود وتنظيفه
          TASK_CODE=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | sed -e 's/^```python//' -e 's/^```//' -e 's/```$//' | sed '/./,$!d')

          if [ -z "$TASK_CODE" ] || [ "$TASK_CODE" == "null" ]; then
            echo "❌ Error: API response was not as expected."
            echo "$RESPONSE"
            exit 1
          fi
          
          echo "task_payload<<EOF" >> $GITHUB_ENV
          echo "$TASK_CODE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 3.1 - Dispatch Task
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: 246248m-hub/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: >
            {
              "task_payload": ${{ toJson(env.task_payload) }},
              "commander_repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}"
            }

      - name: 4.1 - Archive Lesson
        if: success()
        run: |
          LESSON_NUM=$(($(find knowledge_base -maxdepth 1 -name '*.py' | wc -l) + 1))
          echo "${{ env.task_payload }}" > "knowledge_base/lesson_${LESSON_NUM}.py"
          git config --global user.name 'Genesis Teacher'
          git config --global user.email 'bot@github.com'
          git add knowledge_base/
          git commit -m "Lesson ${LESSON_NUM} learned"
          git push || echo "Nothing to push"

      - name: 5.1 - Resurrect (Safe Mode)
        if: always()
        run: |
          # زيادة وقت الانتظار لـ 5 دقائق لتجنب حظر الـ IP الخاص بـ GitHub
          echo "Waiting 300 seconds (5 mins) before next cycle to protect quota..."
          sleep 300
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.COMMANDER_PAT }}" \
            [https://api.github.com/repos/$](https://api.github.com/repos/$){{ github.repository }}/actions/workflows/genesis_commander.yml/dispatches \
            -d '{"ref":"main"}'