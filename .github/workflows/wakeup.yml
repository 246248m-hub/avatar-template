# -----------------------------------------------------------------
# 🧠 PHOENIX COMMANDER: The Aware Brain (v4)
#
# يفهم تقارير الفشل، يستشير Gemini، ويصدر أوامر مصححة.
# -----------------------------------------------------------------
name: 🧠 PHOENIX_COMMANDER_BRAIN (Aware)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [task_report]

jobs:
  decision_and_dispatch:
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ 1. Checkout Mind State
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 🐍 2. تهيئة بيئة القرار
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests google-generativeai

      - name: 🤔 3. Analyze, Decide, and Generate Task
        id: main_logic
        env:
          COMMANDER_PAT: ${{ secrets.COMMANDER_PAT }}
          EXECUTOR_PAT_FOR_REPORTING: ${{ secrets.EXECUTOR_PAT_FOR_REPORTING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_CONTEXT: ${{ toJSON(github.event) }}
        run: |
          # --- هذا هو العقل الواعي ---
          import os, json, requests
          import google.generativeai as genai

          # --- 1. إعدادات ---
          genai.configure(api_key=os.environ.get("GEMINI_API_KEY"))
          model = genai.GenerativeModel('gemini-pro')
          event_context = json.loads(os.environ.get("EVENT_CONTEXT"))
          event_name = os.environ.get("GITHUB_EVENT_NAME")
          
          task_script_to_send = ""

          # --- 2. تحليل الحالة أو التقرير ---
          if event_name == "repository_dispatch" and event_context.get("action") == "task_report":
              print("COMMANDER: Processing task report...")
              payload = event_context.get("client_payload", {})
              status = payload.get("status")
              details = payload.get("details", {})

              if status == "success":
                  print("COMMANDER: Task was successful. Generating next task.")
                  # (هنا يمكنك إضافة منطق للمهمة التالية بناءً على النجاح)
                  # حالياً، سنقوم بإنشاء مهمة فاشلة عمداً للتجربة
                  task_script_to_send = "print('Success! Now causing an error on purpose.')\nimport sys; sys.exit(1)"

              elif status == "failure":
                  print("COMMANDER: Task failed. Consulting Gemini for a fix...")
                  original_script = details.get("original_script", "# No original script provided")
                  error_log = json.dumps(details, indent=2)
                  
                  prompt = f"""
                  The following Python script failed to execute:
                  --- SCRIPT START ---
                  {original_script}
                  --- SCRIPT END ---

                  It produced this error log:
                  --- ERROR LOG START ---
                  {error_log}
                  --- ERROR LOG END ---

                  Your task is to fix the Python script.
                  Provide only the complete, corrected Python code, without any explanations or markdown.
                  """
                  
                  try:
                      response = model.generate_content(prompt)
                      fixed_script = response.text.strip().replace("```python", "").replace("```", "")
                      print("COMMANDER: Gemini provided a fix. Preparing to dispatch corrected script.")
                      task_script_to_send = fixed_script
                  except Exception as e:
                      print(f"COMMANDER: FATAL - Could not consult Gemini: {str(e)}")
                      # إذا فشل الاتصال بـ Gemini، نتوقف
                      task_script_to_send = "print('FATAL: Gemini consultation failed.')"

          else: # التشغيل اليدوي
              print("COMMANDER: Manual start. Generating a deliberately failing task for testing.")
              # سنرسل مهمة تحتوي على خطأ بسيط (قسمة على صفر)
              task_script_to_send = "print('This task will fail.'); result = 1 / 0"

          # --- 3. حفظ السكربت وتمريره ---
          with open("current_task.py", "w") as f:
              f.write(task_script_to_send)
          
          import base64
          encoded_script = base64.b64encode(task_script_to_send.encode()).decode()
          print(f"::set-output name=encoded_script::{encoded_script}")
          
          # (يمكن إضافة منطق تحديث MIND_STATE.json هنا)

      # --- الخطوة 4: إرسال الأمر ---
      - name: 🚀 4. Dispatch Order to Executor
        run: |
          echo "COMMANDER: Dispatching order to phoenix-executor..."
          # قراءة السكربت الأصلي لتضمينه في حالة الفشل
          ORIGINAL_SCRIPT=$(cat current_task.py | base64 -w 0)
          
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.COMMANDER_PAT }}" \
            https://api.github.com/repos/246248m-hub/phoenix-executor/dispatches \
            -d '{
              "event_type":"execute_task",
              "client_payload": {
                "script": "${{ steps.main_logic.outputs.encoded_script }}",
                "original_script_for_debugging": "'"$ORIGINAL_SCRIPT"'",
                "resources": {
                  "gemini_api_key": "${{ secrets.GEMINI_API_KEY }}",
                  "reporting_token": "${{ secrets.EXECUTOR_PAT_FOR_REPORTING }}"
                }
              }
            }'