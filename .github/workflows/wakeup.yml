name: 🧬 GENESIS COMMANDER

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'Goal'
        required: false
        default: 'Build a modular AI core: persistent memory and dynamic logic.'

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 1.2 - Bootstrap
        run: |
          mkdir -p knowledge_base
          if [ -z "$(ls -A knowledge_base)" ]; then
            echo "def run(): return 'Genesis'" > knowledge_base/task_0.py
          fi

      - name: 2.1 - AI Generation (Self-Healing Prompt)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJ: ${{ github.event.inputs.custom_objective }}
        run: |
          # جمع آخر 3 مهام فقط لتركيز الذاكرة ومنع التشتت
          KNOWLEDGE=$(find knowledge_base -name 'task_*.py' | sort -V | tail -n 3 | xargs cat)
          
          PROMPT="You are the ARCHITECT AI. OBJECTIVE: $OBJ.
          PREVIOUS_LOGIC: $KNOWLEDGE.
          
          INSTRUCTIONS:
          1. Write a Python script that evolves the logic.
          2. It MUST be self-contained (don't import previous tasks).
          3. It MUST have a 'run()' function.
          4. Include a 'if __name__ == \"__main__\":' block that runs 'run()' inside a try-except.
          5. If an error occurs, print 'ERROR: ' followed by the exception.
          6. Respond ONLY with raw Python code."

          JSON_DATA=$(jq -n --arg p "$PROMPT" '{contents: [{parts: [{text: $p}]}]}')
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GOOGLE_API_KEY}"
          
          RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" -d "$JSON_DATA" "$API_URL")
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed -e 's/^```python//' -e 's/^```//' -e 's/```$//' > current_task.py
          
          echo "task_payload<<EOF" >> $GITHUB_ENV
          cat current_task.py >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 3.1 - Dispatch
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: >
            {
              "task_payload": ${{ toJson(env.task_payload) }},
              "run_id": "${{ github.run_id }}"
            }

      - name: 4.1 - Archive
        run: |
          COUNT=$(find knowledge_base -name 'task_*.py' | wc -l)
          cp current_task.py "knowledge_base/task_${COUNT}.py"
          git config --global user.name 'Architect'
          git config --global user.email 'ai@genesis.ai'
          git add . && git commit -m "Evolution ${COUNT}" && git push || echo "No changes"

      - name: 5.1 - Loop
        if: always()
        env: { GH_TOKEN: "${{ secrets.COMMANDER_PAT }}", OBJ: "${{ github.event.inputs.custom_objective }}" }
        run: sleep 300 && gh workflow run wakeup.yml --repo ${{ github.repository }} -f custom_objective="$OBJ"