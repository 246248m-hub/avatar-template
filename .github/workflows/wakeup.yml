      - name: 5.1 - Recursive Loop (The Final Final Fix)
        if: always()
        run: |
          echo "Cycle complete. Restarting in 300s..."
          sleep 300
          
          # لاحظ: لم نعد نستخدم ${{ github.repository }} داخل الرابط مباشرة
          # سنستخدم المتغيرات التي يوفرها النظام للبيئة تلقائياً
          
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.COMMANDER_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/genesis_commander.yml/dispatches" \
            -d "{\"ref\":\"main\", \"inputs\": {\"custom_objective\": \"${{ github.event.inputs.custom_objective }}\"}}"