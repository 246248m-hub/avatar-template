name: 🧬 GENESIS COMMANDER (Self-Contained Teacher)

on:
  workflow_dispatch:

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------
      #  الخطوة 1: إعداد الذاكرة والمعرفة
      # -----------------------------------------------------
      - name: 1.1 - Checkout Commander's Own Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }} # مطلوب لعمل git push

      - name: 1.2 - Setup Python & Gemini
        run: |
          pip install google-generativeai
          # إنشاء مجلد المعرفة إذا لم يكن موجوداً
          mkdir -p knowledge_base

      # -----------------------------------------------------
      #  الخطوة 2: Gemini يحدد الهدف التالي
      # -----------------------------------------------------
      - name: 2.1 - Gemini Defines Next Learning Step
        id: gemini_task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # قراءة المعرفة الحالية من المجلد المخصص
          KNOWLEDGE=$(find knowledge_base -maxdepth 1 -name '*.py' -print0 | xargs -0 cat)
          if [ -z "$KNOWLEDGE" ]; then
            KNOWLEDGE="None. This is the first lesson."
          fi

          # صياغة البرومبت (لا تغيير هنا)
          PROMPT="""
          You are an AI teaching another AI how to build itself from first principles.
          The ultimate goal is to create a multi-modal AI in pure Python.
          This is the current knowledge library:
          ---
          ${KNOWLEDGE}
          ---
          Define the very next logical learning step. Provide ONLY the raw Python code for this single, self-contained task.
          If the code needs libraries, add a '# REQUIREMENTS: <library_name>' line.
          """

          # إنشاء سكربت بايثون للتواصل مع Gemini (لا تغيير هنا)
          cat << EOF > get_task.py
          import os, sys
          import google.generativeai as genai
          
          try:
              genai.configure(api_key=os.environ["GEMINI_API_KEY"])
              model = genai.GenerativeModel('gemini-1.5-flash')
              prompt = """${PROMPT}"""
              response = model.generate_content(prompt, generation_config={'temperature': 0.7})
              
              code = response.text.strip()
              if code.startswith('```python'):
                  code = code[9:]
              if code.endswith('```'):
                  code = code[:-3]
              
              print(code.strip())
          except Exception as e:
              print(f"Error calling Gemini API: {e}", file=sys.stderr)
              sys.exit(1)
          EOF

          # تنفيذ السكربت والحصول على المهمة
          TASK_CODE=$(python get_task.py)
          if [ $? -ne 0 ]; then
            echo "Failed to get task from Gemini. Aborting cycle."
            exit 1
          fi
          
          echo "Generated Task Code:"
          echo "${TASK_CODE}"
          
          # حفظ المهمة للإرسال
          echo "task_payload<<EOF" >> $GITHUB_ENV
          echo "${TASK_CODE}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # -----------------------------------------------------
      #  الخطوة 3: إرسال المهمة إلى "التلميذ"
      # -----------------------------------------------------
      - name: 3.1 - Dispatch Task and Assume Success (for now)
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: 246248m-hub/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{ "task_payload": "${{ env.task_payload }}", "commander_repo": "${{ github.repository }}", "run_id": "${{ github.run_id }}" }'

      # -----------------------------------------------------
      #  الخطوة 4: أرشفة الدرس الجديد
      # -----------------------------------------------------
      - name: 4.1 - Archive New Knowledge
        run: |
          echo "Assuming success, archiving the lesson."
          # حفظ الكود الناجح في مجلد المعرفة
          LESSON_NUM=$(($(find knowledge_base -maxdepth 1 -name '*.py' | wc -l) + 1))
          echo "${{ env.task_payload }}" > "knowledge_base/lesson_${LESSON_NUM}.py"
          
          git config --global user.name 'Genesis Teacher'
          git config --global user.email 'bot@github.com'
          git add knowledge_base/lesson_${LESSON_NUM}.py
          git commit -m "Learned: Lesson ${LESSON_NUM}"
          git push

      # -----------------------------------------------------
      #  الخطوة 5: الإحياء الذاتي للدورة التالية
      # -----------------------------------------------------
      - name: 5.1 - Resurrect for Next Cycle
        if: always()
        run: |
          echo "Triggering next learning cycle..."
          sleep 10 # إعطاء وقت لـ git push
          curl -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.COMMANDER_PAT }}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/actions/workflows/genesis_commander.yml/dispatches -d '{"ref":"main"}'