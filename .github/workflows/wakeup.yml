# -----------------------------------------------------------------
# 🧠 PHOENIX COMMANDER: The Patient Brain (v2)
#
# يستمع للتقارير، ويصدر أمراً واحداً فقط لكل تقرير.
# -----------------------------------------------------------------
name: 🧠 PHOENIX_COMMANDER_BRAIN (Patient)

on:
  # 1. للبدء اليدوي (يطلق أول مهمة فقط)
  workflow_dispatch:
  # 2. للاستجابة لتقارير العمال
  repository_dispatch:
    types: [task_report]

jobs:
  # هذه الوظيفة تعمل فقط عند التشغيل اليدوي أو عند وصول تقرير
  decision_and_dispatch:
    runs-on: ubuntu-latest
    
    steps:
      # --- الخطوة 1: استنساخ الوعي ---
      - name: ⬇️ 1. Checkout Mind State
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      # --- الخطوة 2: التحليل واتخاذ القرار ---
      - name: 🤔 2. Analyze State and Generate Task
        id: main_logic
        env:
          # تمرير الأسرار اللازمة
          COMMANDER_PAT: ${{ secrets.COMMANDER_PAT }}
          EXECUTOR_PAT_FOR_REPORTING: ${{ secrets.EXECUTOR_PAT_FOR_REPORTING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # تمرير بيانات الحدث لتحليل التقرير
          EVENT_CONTEXT: ${{ toJSON(github.event) }}
        run: |
          # --- هذا هو العقل الحقيقي ---
          echo "COMMANDER: Awakening."
          
          # تحليل التقرير (إذا كان موجوداً)
          EVENT_TYPE="${{ github.event_name }}"
          if [[ "$EVENT_TYPE" == "repository_dispatch" ]]; then
            echo "COMMANDER: Processing report..."
            TASK_ID=$(echo $EVENT_CONTEXT | jq -r '.client_payload.task_id')
            TASK_STATUS=$(echo $EVENT_CONTEXT | jq -r '.client_payload.status')
            echo "Report for $TASK_ID shows status: $TASK_STATUS"
            # هنا يجب تحديث MIND_STATE.json بناءً على التقرير
          else
            echo "COMMANDER: Manual start detected. Issuing first task."
          fi

          # قراءة الحالة الحالية
          if [ ! -f MIND_STATE.json ]; then
            echo '{"last_task_index": 0}' > MIND_STATE.json
          fi
          LAST_INDEX=$(jq -r '.last_task_index' MIND_STATE.json)
          NEXT_INDEX=$((LAST_INDEX + 1))
          echo "COMMANDER: Next task index will be $NEXT_INDEX."

          # توليد الأمر التالي (نفس كود المهمة من قبل)
          TASK_SCRIPT=$(cat <<'EOF'
          # ... (نفس كود البايثون الخاص بالمنفذ من قبل) ...
          # لا حاجة لتغييره
          EOF
          )
          ENCODED_SCRIPT=$(echo "$TASK_SCRIPT" | base64 -w 0)
          
          # تمرير السكربت المشفر إلى الخطوة التالية
          echo "::set-output name=encoded_script::$ENCODED_SCRIPT"
          
          # تحديث وحفظ الحالة
          jq ".last_task_index = $NEXT_INDEX" MIND_STATE.json > tmp.json && mv tmp.json MIND_STATE.json
          echo "COMMANDER: State updated. Ready to dispatch."
          git config --global user.name 'Phoenix Commander'
          git config --global user.email 'commander@phoenix.project'
          git add MIND_STATE.json
          git commit -m "State Update: Preparing task #$NEXT_INDEX" || echo "No state changes."
          git push

      # --- الخطوة 3: إرسال الأمر ---
      - name: 🚀 3. Dispatch Order to Executor
        run: |
          echo "COMMANDER: Dispatching order to phoenix-executor..."
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.COMMANDER_PAT }}" \
            https://api.github.com/repos/246248m-hub/phoenix-executor/dispatches \
            -d '{
              "event_type":"execute_task",
              "client_payload": {
                "script": "${{ steps.main_logic.outputs.encoded_script }}",
                "resources": {
                  "gemini_api_key": "${{ secrets.GEMINI_API_KEY }}",
                  "reporting_token": "${{ secrets.EXECUTOR_PAT_FOR_REPORTING }}"
                }
              }
            }'