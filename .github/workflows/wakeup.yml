name: 🧬 GENESIS COMMANDER

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'The strategic mission'
        required: false
        default: 'Build a Python module to download arwiki-latest-pages-articles.xml.bz2 and decompress it efficiently.'

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 1.2 - Bootstrap Core
        run: |
          mkdir -p knowledge_base
          if [ -z "$(ls -A knowledge_base)" ]; then
            echo "# Initial Seed" > knowledge_base/task_0.py
          fi

      - name: 2.1 - AI Generation (Gemini 2.5 ONLY)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          KNOWLEDGE_CONTEXT=$(find knowledge_base -name 'task_*.py' | sort -V | tail -n 5 | xargs cat 2>/dev/null | tail -c 5000 || echo "Initial state.")
          PROMPT="You are an AI Architect. Objective: $OBJECTIVE. Context: $KNOWLEDGE_CONTEXT. Write a self-contained Python script. Respond ONLY with raw code."
          JSON_PAYLOAD=$(jq -n --arg p "$PROMPT" '{contents: [{parts: [{text: $p}]}]}')

          # الرابط الذي يعمل عندك (v1beta + gemini-2.5-flash-lite)
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GOOGLE_API_KEY}"
          
          SUCCESS=false
          # محاولة الطلب 5 مرات بنفس الرابط مع انتظار متزايد لتجاوز الـ 429
          for i in {1..5}; do
            echo "🤖 Attempt $i using Gemini 2.5 Flash Lite..."
            
            RESPONSE=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD" "$API_URL")

            if echo "$RESPONSE" | grep -q "candidates"; then
              TASK_CODE=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | sed -e 's/^```python//' -e 's/^```//' -e 's/```$//' | sed '/./,$!d')
              if [[ ! -z "$TASK_CODE" && "$TASK_CODE" != "null" ]]; then
                echo "$TASK_CODE" > current_task.py
                echo "✅ Success!"
                SUCCESS=true
                break
              fi
            elif echo "$RESPONSE" | grep -q "RESOURCE_EXHAUSTED"; then
              WAIT=$((i * 20))
              echo "⚠️ Quota Hit (429). Waiting $WAIT seconds..."
              sleep $WAIT
            else
              echo "❌ Error details: $(echo "$RESPONSE" | jq -r '.error.message // "Unknown error"')"
              sleep 10
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Failed after 5 attempts."
            exit 1
          fi

          ENCODED_PAYLOAD=$(cat current_task.py | base64 -w 0)
          echo "task_payload=$ENCODED_PAYLOAD" >> $GITHUB_ENV

      - name: 3.1 - Dispatch to Executor
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: >
            {
              "task_payload": "${{ env.task_payload }}",
              "run_id": "${{ github.run_id }}"
            }

      - name: 4.1 - Archive & Update README
        run: |
          COUNT=$(find knowledge_base -name 'task_*.py' | wc -l)
          echo "${{ env.task_payload }}" | base64 -d > "knowledge_base/task_${COUNT}.py"
          
          echo "### 🧬 PHOENIX CORE STATUS" > README.md
          echo "- **Objective:** ${{ github.event.inputs.custom_objective }}" >> README.md
          echo "- **Last Pulse:** $(date)" >> README.md
          
          git config --global user.name 'Architect'
          git config --global user.email 'architect@phoenix.ai'
          git add . && git commit -m "Evolution ${COUNT}" && git push || echo "No changes"

      - name: 5.1 - Recursive Loop
        if: always()
        env: { GH_TOKEN: "${{ secrets.COMMANDER_PAT }}", OBJ: "${{ github.event.inputs.custom_objective }}" }
        run: sleep 300 && gh workflow run wakeup.yml --repo ${{ github.repository }} -f custom_objective="$OBJ"