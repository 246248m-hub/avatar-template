name: 💉 🔍 PHOENIX_SURGERY_AND_INSPECTION

on:
  workflow_dispatch:

jobs:
  surgery_and_verify:
    runs-on: ubuntu-latest # أسرع وأخف من الماك
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 🛠️ 2. Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip wget default-jre
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: 🧠 3. Download Brain (135MB)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain
          path: ./brain_files

      - name: 📥 4. Download Body
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146013013
          name: Phoenix-Hex-Compiler-v146
          path: ./temp_body

      - name: 🧬 5. Surgical Injection
        run: |
          find ./temp_body -name "*.apk" -exec mv {} ./original_body.apk \;
          mkdir -p assets/AI_ULTRA
          cp -r ./brain_files/* assets/AI_ULTRA/
          # حقن العقل
          zip -ur original_body.apk assets/
          # توقيع الملف
          java -jar signer.jar --apks original_body.apk
          find . -name "*aligned-debugSigned.apk" -exec mv {} Phoenix_Ready.apk \;
          echo "✅ Surgery Complete."

      - name: 🔍 6. Forensic Inspection (تقرير التشريح)
        run: |
          echo "--- تقرير فحص العقل داخل الـ APK ---" > report.txt
          echo "حجم الـ APK النهائي:" >> report.txt
          du -sh Phoenix_Ready.apk >> report.txt
          echo "" >> report.txt
          echo "قائمة ملفات العقل المحقونة داخل المجلد الداخلي:" >> report.txt
          unzip -l Phoenix_Ready.apk | grep "assets/AI_ULTRA/" >> report.txt
          echo "" >> report.txt
          echo "✅ تم التأكد من وجود كافة القطاعات الذرية." >> report.txt
          cat report.txt

      - name: 📤 7. Export APK & Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Final_Verified
          path: |
            Phoenix_Ready.apk
            report.txt