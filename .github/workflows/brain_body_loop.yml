name: 🚀 Final_Atomic_Engine_Ultra_v56

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Initialize Project & Force Repositories
        run: |
          # حل مشكلة السطر 1: تعريف المستودعات بشكل كامل وصارم
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include(":app")
          EOF

          # حل مشكلة تعريف البلجن في الجذر
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.0" apply false
              id("org.jetbrains.kotlin.android") version "1.8.10" apply false
          }
          EOF

          # بناء مجلدات التطبيق (الجسد)
          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/values

          # حل مشكلة بناء التطبيق الداخلي
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.atomic.application") {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }
          }
          // تصحيح: استخدام بلوك الملحقات المباشر لتفادي أخطاء التداخل
          EOF
          
          # إعادة كتابة app/build.gradle.kts بشكل أنظف
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.atomic.engine"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.atomic.engine"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 56
                  versionName = "56.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.4.3" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.activity:activity-compose:1.7.2")
              implementation("androidx.compose.ui:ui:1.4.3")
              implementation("androidx.compose.material3:material3:1.1.0")
          }
          EOF

      - name: 🛠️ 4. Generate Wrapper (Force Version 8.1)
        run: gradle wrapper --gradle-version 8.1 --distribution-type all

      - name: 📝 5. Inject Manifest & Core Logic
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.engine">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic Engine" android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Text("Atomic Engine v56 Online") }
              }
          }
          EOF

      - name: 🔨 6. Assemble Debug APK (Safety Mode)
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 7. Artifact Release
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Engine-v56
          path: app/build/outputs/apk/debug/*.apk