name: 🚀 PHOENIX_FINAL_FIX_v125

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17 (ضروري لأندرويد)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ 3. Setup Android SDK (الموافقة التلقائية)
        uses: android-actions/setup-android@v3
        # هذه الخطوة ستقوم بتجهيز الـ sdkmanager والموافقة على كل شيء تلقائياً

      - name: 🐍 4. Install Buildozer
        run: |
          pip install --user --upgrade buildozer Cython==0.29.33

      - name: 📝 5. Create main.py
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixApp(App):
              def build(self):
                  return Label(text="🔥 PHOENIX SYSTEM ONLINE\n10GB Brain Linked", font_size='20sp')
          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Build Real APK
        run: |
          # سنستخدم ميزة 'تخطي الرخص' المدمجة في Buildozer
          buildozer init
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 34/' buildozer.spec
          
          # البدء في البناء الحقيقي
          buildozer -v android debug
          
      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Phoenix-A32
          path: bin/*.apk