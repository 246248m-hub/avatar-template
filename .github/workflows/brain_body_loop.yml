name: 🧬 GENESIS COMMANDER

on:
  workflow_dispatch:

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout Knowledge Base
        uses: actions/checkout@v4
        with:
          repository: '246248m-hub/phoenix-knowledge-base'
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 1.2 - Setup Python & Gemini
        run: pip install google-generativeai

      - name: 2.1 - Gemini Defines Next Learning Step
        id: gemini_task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # جمع المعرفة الحالية من ملفات البايثون الموجودة
          KNOWLEDGE=$(find . -maxdepth 1 -name 'lesson_*.py' -print0 | xargs -0 cat 2>/dev/null || echo "None. This is the first lesson.")

          cat << EOF > get_task.py
          import os
          import google.generativeai as genai
          import re

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('gemini-1.5-flash')
          
          prompt = f"""
          You are an AI teaching another AI how to build itself from first principles.
          The goal is a multi-modal AI in pure Python.
          Current knowledge: {'''$KNOWLEDGE'''}
          
          Define the NEXT logical step. Provide ONLY the Python code. 
          No talk, no markdown wrappers like \`\`\`python. Just the raw code.
          If libraries are needed, add '# REQUIREMENTS: <library_name>'.
          """
          
          response = model.generate_content(prompt)
          code = response.text.strip()
          
          # إزالة أي علامات ماركداون إذا وجدت بالخطأ
          code = re.sub(r'^```python\n|^```|```$', '', code, flags=re.MULTILINE)
          print(code.strip())
          EOF

          TASK_CODE=$(python get_task.py)
          
          # حفظ الكود في متغير البيئة بشكل آمن
          echo "task_payload<<EOF" >> $GITHUB_ENV
          echo "$TASK_CODE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 3.1 - Dispatch to Executor
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: 246248m-hub/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: >
            {
              "task_payload": ${{ toJson(env.task_payload) }},
              "commander_repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}"
            }

      - name: 4.1 - Archive Lesson
        if: success()
        run: |
          LESSON_NUM=$(($(ls -1q lesson_*.py 2>/dev/null | wc -l) + 1))
          echo "${{ env.task_payload }}" > "lesson_${LESSON_NUM}.py"
          
          git config --global user.name 'Genesis Teacher'
          git config --global user.email 'bot@github.com'
          git add .
          git commit -m "Learned: Lesson ${LESSON_NUM}"
          git push || echo "No changes to commit"

      - name: 5.1 - Resurrect for Next Cycle
        if: always()
        run: |
          echo "Waiting for stabilization..."
          sleep 20
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.COMMANDER_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            [https://api.github.com/repos/$](https://api.github.com/repos/$){{ github.repository }}/actions/workflows/wakeup.yml/dispatches \
            -d '{"ref":"main"}'