name: 🚀 Atomic_Hex_Engine_v66_Final

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Initialize Android Project
        run: |
          # إعداد إعدادات البناء
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat << 'EOF' > settings.gradle
          rootProject.name = "AtomicHexEngine"
          include ':app'
          EOF

          # ملف بناء الجذر
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/layout

          # ملف بناء التطبيق (Module)
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace "com.atomic.engine"
              compileSdk 33
              defaultConfig {
                  applicationId "com.atomic.engine"
                  minSdk 24
                  targetSdk 33
                  versionCode 66
                  versionName "66.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: 📝 4. Inject Atomic Hex Logic
        run: |
          # المانيفست مع صلاحيات التخزين
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic Hex v66" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name="com.atomic.engine.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # الكود البرمجي المدمج للنحت السداسي
          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.io.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF0A0A0A.toInt())
                      setPadding(40, 40, 40, 40)
                  }

                  val tv = TextView(this).apply {
                      text = "⚛️ Atomic Hex Engine v66\nنظام بناء الألعاب بمستوى البت"
                      setTextColor(0xFF00FF00.toInt())
                      textSize = 18f
                  }

                  val input = EditText(this).apply {
                      hint = "صف اللعبة (مثلاً: بيئة Where Winds Meet)..."
                      setHintTextColor(0x5500FF00.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                  }

                  val btn = Button(this).apply { text = "بدء النحت السداسي (Hex Synthesis)" }
                  
                  layout.addView(tv); layout.addView(input); layout.addView(btn)
                  setContentView(layout)

                  btn.setOnClickListener {
                      val userQuery = input.text.toString()
                      tv.append("\n\n🛠️ تحليل الطلب: $userQuery")
                      
                      try {
                          // الوصول لملف الـ 10 جيجا في الذاكرة الداخلية
                          val brainPath = Environment.getExternalStorageDirectory().absolutePath + "/AI_Project/brain.bin"
                          val brainFile = File(brainPath)
                          val outputPath = Environment.getExternalStorageDirectory().absolutePath + "/AI_Project/output_game.hex"
                          
                          if (brainFile.exists()) {
                              val raf = RandomAccessFile(brainFile, "r")
                              val out = FileOutputStream(outputPath)
                              
                              // نحت أول 5 ميجابايت من الهيكس الخام كمرحلة أولى
                              val hexBuffer = ByteArray(1024 * 1024 * 5) 
                              raf.seek(1024) // تخطي الهيدر للوصول للذرات
                              raf.read(hexBuffer)
                              out.write(hexBuffer)
                              
                              out.close()
                              raf.close()
                              tv.append("\n✅ تم إنتاج ملف الهيكس الذري بنجاح!")
                          } else {
                              tv.append("\n❌ لم يتم العثور على brain.bin في مجلد AI_Project")
                          }
                      } catch (e: Exception) {
                          tv.append("\n⚠️ خطأ في النحت: ${e.message}")
                      }
                  }
              }
          }
          EOF

      - name: 🛠️ 5. Final Compilation
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 6. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Hex-Engine-v66
          path: app/build/outputs/apk/debug/*.apk