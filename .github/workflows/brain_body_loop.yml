name: 🚀 Ultimate_Atomic_Engine_Final_v54

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17 (Fix: Version Match)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Fix Plugin Repositories (The Missing Link)
        run: |
          # حل مشكلة Plugin Not Found بوضع المستودعات في ملف الإعدادات
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include(":app")
          EOF

          # حل مشكلة Root Build Script
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.0" apply false
              id("org.jetbrains.kotlin.android") version "1.8.10" apply false
          }
          EOF

          # 4. بناء مجلدات التطبيق
          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/values

          # 5. ملف بناء التطبيق (App Build) مع معالجة الرام
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.atomic.engine"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.atomic.engine"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 54
                  versionName = "54.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.4.3" }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.activity:activity-compose:1.7.2")
              implementation("androidx.compose.ui:ui:1.4.3")
              implementation("androidx.compose.material3:material3:1.1.0")
          }
          EOF

          # 6. المانيفست (حل مشكلة صلاحيات Android 11+)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.engine">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application 
                  android:label="Atomic Engine" 
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. كود الواجهة (حل مشكلة استهلاك الذاكرة في الهاتف A32)
          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.*
          import androidx.compose.runtime.*

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      Surface { Text("Atomic Engine v54 Ready") }
                  }
              }
          }
          EOF

      - name: 🔨 4. Pre-Build: Generate Wrapper (Fix: Version Mismatch)
        run: gradle wrapper --gradle-version 8.1 --distribution-type all

      - name: 🚀 5. Final Compilation (Fix: Memory & Encoding)
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" > gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 6. Secure Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Engine-v54
          path: app/build/outputs/apk/debug/*.apk