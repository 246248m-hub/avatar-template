name: 🏗️ PHOENIX_REAL_BUILD_v129

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ 3. Setup Android SDK (الخطوة الحاسمة)
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false # يوافق تلقائياً بصمت

      - name: 🐍 4. Install Buildozer & Dependencies
        run: |
          pip install --user buildozer Cython==0.29.33
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev

      - name: 📝 5. Create main.py
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixApp(App):
              def build(self):
                  return Label(text="🔥 PHOENIX SYSTEM ONLINE\n10GB Brain Connected", font_size='20sp')
          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Build APK (تجاوز الرخص داخلياً)
        run: |
          buildozer init
          # تهيئة الإعدادات لاستخدام الـ SDK الذي جهزه GitHub
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 34/' buildozer.spec
          
          # إجبار Buildozer على رؤية المسارات الصحيحة
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | buildozer -v android debug

      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Phoenix-A32
          path: bin/*.apk