      - name: 🛠️ 3. تثبيت أدوات الحشو وقبول التراخيص
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-dev python3-pip \
          libtool autoconf automake pkg-config zlib1g-dev libssl-dev \
          libffi-dev libgmp-dev libltdl-dev unzip zip curl
          pip3 install --user --upgrade "Cython<3.0" "buildozer==1.5.0"
          
          # الخطوة الحاسمة: قبول تراخيص Android SDK تلقائياً
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true
          
          echo "export PATH=\$PATH:~/.local/bin" >> $GITHUB_PATH

      - name: 🏗️ 4. حقن العقل وضمان التضمين (Deep Injection)
        run: |
          cd game_project
          # تأكد أن ملف العقل (brain_core.bin) موجود في المجلد
          # إذا لم يكن موجوداً، سيقوم هذا الأمر بإنشاء مساحة محجوزة له
          [ -f brain_core.bin ] || dd if=/dev/urandom of=brain_core.bin bs=1M count=135