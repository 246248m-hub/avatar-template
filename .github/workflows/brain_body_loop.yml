name: 🚀 PHOENIX_OPTIMIZED_v140

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # بيئة مستقرة جداً ومجربة
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛡️ 3. Pre-Accept Optimized Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # حقن التراخيص للنسخ المستقرة (API 33/34)
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451e0f0f766e07503a702039db007" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: 🐍 4. Install Stable Buildozer
        run: |
          # نستخدم إصدارات مثبتة الكفاءة
          pip install --user Cython==0.29.33 buildozer==1.5.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 📝 5. Application Code
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixApp(App):
              def build(self):
                  return Label(text="🔥 PHOENIX SYSTEM\nOptimized for Samsung A32", font_size='20sp')
          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Building with API 33 (The Sweet Spot)
        run: |
          buildozer init
          # ضبط الإعدادات للنسخة الأكثر توافقاً مع هواتف الفئة المتوسطة
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 33/' buildozer.spec
          sed -i 's/#android.build_tools_version = 31.0.0/android.build_tools_version = 33.0.1/' buildozer.spec
          sed -i 's/#android.ndk = 25b/android.ndk = 25b/' buildozer.spec
          
          # البدء بالبناء مع الموافقة التلقائية
          yes | buildozer -v android debug

      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Optimized-A32
          path: bin/*.apk