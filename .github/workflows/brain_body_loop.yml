name: 🚀 PHOENIX_ULTRA_FIX_v136

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛡️ 3. Forced SDK Setup (تثبيت المسارات والرخص قسرياً)
        run: |
          # إنشاء المجلدات التي يطلبها Buildozer بالضبط
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # تحميل أدوات سطر الأوامر الرسمية
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          
          # ربط المسارات لخدعة النظام (Symlink)
          ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          # الموافقة على رخصة أندرويد (النص الذي أرسلته) آلياً
          export PATH=$PATH:~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          yes | sdkmanager --licenses --sdk_root=~/.buildozer/android/platform/android-sdk

      - name: 🐍 4. Install Dependencies
        run: |
          pip install --user --upgrade Cython==0.29.33 buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt-get install -y build-essential libffi-dev libssl-dev pkg-config autoconf automake libtool

      - name: 📝 5. Create main.py
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixApp(App):
              def build(self):
                  return Label(text="🔥 PHOENIX SYSTEM\nStatus: 100% Licensed", font_size='20sp')
          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Final APK Build
        run: |
          buildozer init
          # إجبار النظام على استخدام إصدار مستقر (34) بدلاً من 36.1 المزعج
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 34/' buildozer.spec
          sed -i 's/#android.build_tools_version = 31.0.0/android.build_tools_version = 34.0.0/' buildozer.spec
          
          # البدء بالبناء
          buildozer -v android debug

      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Phoenix-A32
          path: bin/*.apk