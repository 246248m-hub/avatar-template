name: 🏗️ FINAL_PHOENIX_SUCCESS_v123

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 2. Install Python Dependencies
        run: |
          pip install Cython==0.29.33
          pip install buildozer

      - name: 📝 3. Create Phoenix App (Python/Kivy)
        run: |
          # إنشاء ملف التطبيق الأساسي مع ميزة العنقاء
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          from kivy.core.window import Window
          import os

          class PhoenixApp(App):
              def build(self):
                  Window.clearcolor = (0, 0, 0, 1) # خلفية سوداء
                  path = "/sdcard/Documents/Brain_AI/"
                  status = "🔥 PHOENIX SYSTEM ACTIVE\n\n"
                  
                  if os.path.exists(path):
                      files = os.listdir(path)
                      status += f"✅ Brain Linked: {len(files)} Shards Found\n"
                      status += "System Status: CORE READY"
                  else:
                      status += "⚠️ FOLDER NOT FOUND\n"
                      status += "Path: " + path + "\n"
                      status += "Please Move Shards to Documents/Brain_AI"
                  
                  return Label(text=status, color=(1, 0.2, 0, 1), font_size='18sp', halign='center')

          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 4. Build Real APK (Using Buildozer)
        run: |
          # إنشاء إعدادات البناء بسرعة
          buildozer init
          # تعديل الإعدادات لتناسب المشروع
          sed -i 's/package.name = myapp/package.name = geminiphoenix/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.gemini/' buildozer.spec
          
          # تشغيل البناء (هذا سيستغرق بضع دقائق لإنشاء ملف APK حقيقي)
          # ملاحظة: سنستخدم نسخة أندرويد بسيطة لضمان النجاح من أول مرة
          buildozer android debug
          
      - name: 📤 5. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Phoenix-Final
          path: bin/*.apk