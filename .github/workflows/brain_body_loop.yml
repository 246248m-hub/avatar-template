name: Build and Install Android App 🤖

on:
  workflow_dispatch:

jobs:
  build_and_install:
    runs-on: ubuntu-latest # الجسد
    steps:
      # الخطوة 1: تجهيز الجسد (تنزيل كود المشروع)
      - name: Check out repository
        uses: actions/checkout@v3

      # الخطوة 2: إعداد بيئة جافا (لأن أندرويد يستخدمها)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # الخطوة 3: بناء الـ APK الحقيقي باستخدام Gradle
      # هذه هي الخطوة التي كانت مفقودة.
      # سيقوم Gradle بأخذ كود مشروع الأندرويد الخاص بك وبناء ملف APK صالح.
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug
        # بعد هذه الخطوة، سيكون ملف الـ APK موجوداً في app/build/outputs/apk/debug/app-debug.apk

      # الخطوة 4: تشغيل محاكي الأندرويد
      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29 # يمكنك اختيار أي مستوى API
          script: |
            echo "Emulator is ready. Installing the REAL APK..."
            
            # الخطوة 5: تثبيت الـ APK الذي تم بناؤه للتو
            # لاحظ أننا نستخدم المسار الصحيح للملف الناتج
            adb install app/build/outputs/apk/debug/app-debug.apk
            
            echo "APK Installed successfully!"
            # يمكنك إضافة أوامر أخرى هنا لتشغيل التطبيق أو الاختبار
