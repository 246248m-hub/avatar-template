name: 🎮 🏗️ PHOENIX_GAME_APK_FACTORY_V2

on:
  workflow_dispatch:

jobs:
  build_game_apk:
    runs-on: ubuntu-22.04 # تحديد إصدار مستقر
    steps:
      - name: 📦 1. Checkout Environment
        uses: actions/checkout@v4

      - name: 🧠 2. Loading Injected Brain (135MB)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain
          path: ./brain_assets

      - name: 🏗️ 3. Phoenix Engine (Generate Game & Spec)
        run: |
          mkdir -p game_project
          # إنشاء كود اللعبة المولد من العقل
          cat <<EOF > game_project/main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixGame(App):
              def build(self):
                  return Label(text='[ Phoenix Bit-Level Game ]\nGenerated Successfully')
          if __name__ == '__main__':
              PhoenixGame().run()
          EOF

          # إنشاء ملف التعليمات (Spec File) الضروري جداً للبناء
          cat <<EOF > game_project/buildozer.spec
          [app]
          title = Phoenix Bit Game
          package.name = phoenix_bit_game
          package.domain = org.phoenix
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 1.9.1
          fullscreen = 0
          android.archs = armeabi-v7a, arm64-v8a
          android.allow_backup = True
          EOF
          echo "✅ Game and Spec files are ready."

      - name: 🛠️ 4. Build APK (The Reliable Way)
        uses: kivy/buildozer-action@master
        with:
          workdir: game_project
          buildozer_version: stable

      - name: 📤 5. Export The Created Game (APK)
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Generated_Game_APK
          path: game_project/bin/*.apk