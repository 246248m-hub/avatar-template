name: 🏭 Build The Factory (v10.0)

on:
  workflow_dispatch: # يسمح لك بتشغيل هذا البناء يدوياً متى أردت تحديث المصنع

jobs:
  build_the_apk_factory:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------
      #  الخطوة 1: تهيئة بيئة البناء
      # -----------------------------------------------------
      - name: 1.1 - سحب الكود المصدر (Checkout)
        uses: actions/checkout@v4

      - name: 1.2 - تهيئة بيئة جافا 17 (أساسي للأندرويد الحديث)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 1.3 - تثبيت أدوات بناء الأندرويد (Buildozer)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git
          pip3 install --user --upgrade "buildozer==1.5.0" "Cython<3.0"
          echo "export PATH=\$PATH:~/.local/bin" >> $GITHUB_PATH

      # -----------------------------------------------------
      #  الخطوة 2: برمجة "عقل" المصنع
      # -----------------------------------------------------
      - name: 2.1 - إنشاء مجلد المشروع وكتابة كود العقل (main.py)
        run: |
          mkdir -p factory_project
          cat <<EOF > factory_project/main.py
          # The Core Brain of The Factory
          # This code will live inside the APK
          
          import os
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.button import Button
          from kivy.uix.textinput import TextInput
          
          # سنقوم بمحاكاة الاتصال بـ Gemini هنا
          # في النسخة الحقيقية، سنستخدم مكتبة google.generativeai
          def gemini_analyze(prompt):
              if "autopsy" in prompt:
                  return "Analysis complete: Found binary files: lib/arm64-v8a/libmain.so"
              elif "comprehend" in prompt:
                  return "Comprehension complete: Hex Dictionary created."
              elif "create" in prompt:
                  return "Creation complete: new_game.apk is ready."
              else:
                  return "Error: Unknown command."

          class FactoryApp(App):
              def build(self):
                  self.layout = BoxLayout(orientation='vertical', padding=10, spacing=10)
                  
                  self.title_label = Label(text="Phoenix Factory v1.0", font_size='24sp')
                  self.status_label = Label(text="Status: Ready for commands.")
                  self.prompt_input = TextInput(hint_text="Enter task (e.g., 'autopsy https://...')")
                  self.run_button = Button(text="Execute Task")
                  self.run_button.bind(on_press=self.execute_task)
                  
                  self.layout.add_widget(self.title_label)
                  self.layout.add_widget(self.prompt_input)
                  self.layout.add_widget(self.run_button)
                  self.layout.add_widget(self.status_label)
                  
                  return self.layout

              def execute_task(self, instance):
                  task_prompt = self.prompt_input.text
                  self.status_label.text = f"Executing: {task_prompt}..."
                  
                  # إرسال المهمة إلى "عقل" Gemini (المحاكى)
                  result = gemini_analyze(task_prompt)
                  
                  self.status_label.text = f"Result: {result}"

          if __name__ == '__main__':
              FactoryApp().run()
          EOF

      # -----------------------------------------------------
      #  الخطوة 3: كتابة مواصفات المصنع
      # -----------------------------------------------------
      - name: 3.1 - إنشاء ملف مواصفات البناء (buildozer.spec)
        run: |
          cat <<EOF > factory_project/buildozer.spec
          [app]
          title = Phoenix Factory
          package.name = phoenix_factory
          package.domain = org.phoenix
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy,requests # سنحتاج requests للاتصال بالإنترنت
          orientation = portrait
          android.archs = arm64-v8a
          android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          EOF

      # -----------------------------------------------------
      #  الخطوة 4: بناء وحفظ المصنع
      # -----------------------------------------------------
      - name: 4.1 - تشغيل خط التجميع لبناء الـ APK
        run: |
          cd factory_project
          buildozer -v android debug

      - name: 4.2 - حفظ المصنع (APK) كقطعة أثرية
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Factory_APK
          path: factory_project/bin/phoenix_factory-1.0-arm64-v8a-debug.apk
          retention-days: 90 # نحتفظ به لمدة 90 يوماً
