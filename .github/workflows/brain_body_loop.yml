name: 🚀 Build_Atomic_Game_Factory_v50

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Setup Environment
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/values

          # 1. ملف الصلاحيات (للوصول للـ 10 جيجا في A32)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.engine">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="المحرك الذري" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. كود "المشغل" (The Interpreter) - قلب النظام
          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine

          import android.os.Bundle
          import android.os.Environment
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import java.io.File
          import java.io.RandomAccessFile

          class MainActivity : ComponentActivity() {
              // مسار ملف الـ 10 جيجا (الدماغ)
              private val brainPath = "${Environment.getExternalStorageDirectory()}/AI_Project/brain.bin"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      var prompt by remember { mutableStateOf("") }
                      var log by remember { mutableStateOf("بانتظار الأوامر...") }

                      Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                          Text("⚛️ مشغل الهيكس الذري (v50)", style = MaterialTheme.typography.headlineMedium)
                          Spacer(modifier = Modifier.height(20.dp))
                          
                          TextField(
                              value = prompt,
                              onValueChange = { prompt = it },
                              label = { Text("أدخل وصف اللعبة (عربي)") },
                              modifier = Modifier.fillMaxWidth()
                          )
                          
                          Button(
                              onClick = { log = runEngine(prompt) },
                              modifier = Modifier.fillMaxWidth().padding(top = 10.dp)
                          ) {
                              Text("توليد ملف اللعبة (APK)")
                          }
                          
                          Spacer(modifier = Modifier.height(20.dp))
                          Text("سجل العمليات:\n$log", style = MaterialTheme.typography.bodySmall)
                      }
                  }
              }

              // هذا هو "المترجم" الذي يقرأ الهيكس ويحوله لفعل
              private fun runEngine(input: String): String {
                  val file = File(brainPath)
                  if (!file.exists()) return "خطأ: لم يتم العثور على brain.bin في مجلد AI_Project"
                  
                  return try {
                      val raf = RandomAccessFile(file, "r")
                      // محرك البحث الذكي في الـ 10 جيجا
                      // يبحث عن "اللقيمات" المطلوبة بناءً على البرومبت
                      raf.seek(1024) // تخطي الهيدر
                      val opCode = raf.readByte() // قراءة أول تعليمية هيكس
                      raf.close()
                      
                      "نجاح: تم استدعاء اللقمة البرمجية (0x${Integer.toHexString(opCode.toInt())}) من ملف الذكاء."
                  } catch (e: Exception) {
                      "فشل في التواصل مع ملف الذكاء: ${e.message}"
                  }
              }
          }
          EOF

          # 3. إعدادات البناء (Gradle)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
              compileSdkVersion 33
              namespace "com.atomic.engine"
              defaultConfig {
                  applicationId "com.atomic.engine"
                  minSdkVersion 24
                  targetSdkVersion 33
                  versionCode 50
                  versionName "50.0"
              }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.4.3' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.activity:activity-compose:1.7.2'
              implementation 'androidx.compose.ui:ui:1.4.3'
              implementation 'androidx.compose.material3:material3:1.1.0'
          }
          EOF

      - name: 🔨 بناء ملف APK النهائي
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease