name: 🤖 AI Creates Flashlight App v5 (Final Polish)

on:
  workflow_dispatch:

jobs:
  create_flashlight_app:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ 1. Prepare Environment & Structure
        run: |
          sudo apt-get update && sudo apt-get install -y jq tree
          mkdir -p app/src/main/java/com/example/creator
          mkdir -p gradle
          tree

      # --- توحيد وتنظيف كل استدعاءات الـ API ---
      - name: 🧠 2. Brain writes all project files
        run: |
          # دالة مساعدة لتنظيف المخرجات
          extract_code() {
            jq -r '.candidates.content.parts.text' | sed 's/```.*//g'
          }

          # settings.gradle.kts
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a minimal `settings.gradle.kts` file for an Android project. Include the `:app` module. Provide only the raw code."}]}]}' | extract_code > settings.gradle.kts
          
          # libs.versions.toml (مع الطلب المصحح)
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a complete `libs.versions.toml` file for an Android app. IMPORTANT: Define `android-application` and `kotlin-android` in the `[plugins]` section with `id` and `version.ref`. Define `core-ktx`, `activity-compose`, etc. in the `[libraries]` section with `module` and `version.ref`. Provide only the raw TOML code."}]}]}' | extract_code > gradle/libs.versions.toml

          # app/build.gradle.kts
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a `build.gradle.kts` for an Android app module using version catalog aliases (libs.plugins...). Use `com.example.creator` as namespace. Target SDK 34. Use Jetpack Compose. Provide only the raw kotlin code."}]}]}' | extract_code > app/build.gradle.kts

          # AndroidManifest.xml
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a complete `AndroidManifest.xml` for a simple app. Use `com.example.creator` as package name. Add CAMERA permission and camera.flash feature. Provide only the raw XML code."}]}]}' | extract_code > app/src/main/AndroidManifest.xml

          # MainActivity.kt
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a complete `MainActivity.kt` file for a Jetpack Compose app in package `com.example.creator` that toggles the camera flashlight with a button. Use CameraManager. Provide only the raw kotlin code."}]}]}' | extract_code > app/src/main/java/com/example/creator/MainActivity.kt
          
          echo "✅ All project files created by the Brain."

      - name: 🏗️ 3. Body Builds - Setup & Assemble
        run: |
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -q
          unzip -q gradle-8.4-bin.zip
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          echo "Attempting to build the Flashlight APK (v5)..."
          ./gradle-8.4/bin/gradle -p . assembleDebug

      - name: 📱 4. Body Installs - Run Emulator and Install APK
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          emulator-options: "-camera-back virtualscene"
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            echo "✅ The Digital Mind has successfully created and installed its own Flashlight App."
