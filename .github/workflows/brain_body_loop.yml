name: 🚀 PHOENIX_FULL_CORE_FINAL_FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 1. سحب الكود (Checkout)
        uses: actions/checkout@v4

      - name: ☕ 2. تهيئة جافا 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ 3. تثبيت الأدوات وقبول تراخيص أندرويد (حل المشكلة)
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-dev python3-pip \
          libtool autoconf automake pkg-config zlib1g-dev libssl-dev \
          libffi-dev libgmp-dev libltdl-dev unzip zip curl
          pip3 install --user --upgrade "Cython<3.0" "buildozer==1.5.0"
          
          # قبول التراخيص لضمان تحميل build-tools و aidl
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # استخدام yes للموافقة التلقائية على كل شروط جوجل
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          echo "export PATH=\$PATH:~/.local/bin" >> $GITHUB_PATH

      - name: 🧠 4. إعداد المحرك وضمان حشو العقل (135MB)
        run: |
          mkdir -p game_project
          # توليد ملف العقل الضخم للتأكد من حجم الـ APK
          dd if=/dev/urandom of=game_project/brain_core.bin bs=1M count=135
          
          cat <<EOF > game_project/main.py
          import os
          import wikipedia
          from kivy.app import App
          from kivy.uix.label import Label
          
          class PhoenixEngine(App):
              def build(self):
                  wikipedia.set_lang("ar")
                  # التحقق من أن العقل محقون داخل الـ APK
                  if os.path.exists("brain_core.bin"):
                      size = os.path.getsize("brain_core.bin") / (1024*1024)
                      msg = f"✅ العقل نشط: {size:.1f} MB"
                  else:
                      msg = "❌ خطأ: العقل غير مدمج!"
                  return Label(text=f"Phoenix Wiki-Hex Engine\n{msg}", font_size='20sp')

          if __name__ == '__main__':
              PhoenixEngine().run()
          EOF

      - name: ⚙️ 5. ضبط المواصفات لمنع ضغط الملفات (Buildozer Spec)
        run: |
          cat <<EOF > game_project/buildozer.spec
          [app]
          title = PhoenixFull
          package.name = phoenix.ultra.full
          package.domain = org.phoenix
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,bin,hex,dat,so
          # إجبار النظام على تضمين الملفات الضخمة وعدم تجاهلها
          source.include_patterns = *.bin, *.dat, assets/*
          version = 1.0
          requirements = python3,kivy==2.2.1,wikipedia,requests,urllib3,chardet,idna
          android.archs = arm64-v8a
          android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, MANAGE_EXTERNAL_STORAGE
          # منع ضغط ملف العقل لضمان سرعة القراءة
          android.no_compress_extensions = bin, hex, dat
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          EOF

      - name: 🚀 6. البناء النهائي (High Capacity Build)
        run: |
          cd game_project
          export JAVA_HOME=$JAVA_HOME_17_X64
          # تشغيل البناء مع قبول التراخيص داخل البيئة
          buildozer -v android debug

      - name: 📤 7. رفع الـ APK الحقيقي
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Full_150MB_APK
          path: game_project/bin/*.apk