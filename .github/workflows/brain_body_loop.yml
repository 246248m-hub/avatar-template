name: 📸 PHOENIX_VISUAL_CHECK

on:
  workflow_dispatch:

jobs:
  screenshot_test:
    runs-on: macos-latest # ضروري لتشغيل المحاكي بسرعة
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📥 3. Download Integrated APK
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146013013 # تأكد من رقم الرنة التي تحتوي على APK الحقن
          name: Phoenix_Final_Integrated
          path: .

      - name: 🚀 4. Run Emulator & Take Screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swept -no-audio -no-boot-anim
          script: |
            # البحث عن اسم ملف الـ APK وتحديده
            APK_FILE=$(find . -name "*.apk" | head -n 1)
            echo "Installing $APK_FILE..."
            
            # تثبيت التطبيق على المحاكي
            adb install "$APK_FILE"
            
            # تشغيل التطبيق (تأكد من أن اسم الحزمة com.phoenix.atomcompiler صحيح)
            # إذا غيرت اسم الحزمة، يجب تعديله هنا
            adb shell monkey -p org.test.phoenix -c android.intent.category.LAUNCHER 1
            
            # الانتظار 20 ثانية حتى تكتمل واجهة التطبيق من التحميل
            echo "Waiting for app to load..."
            sleep 20
            
            # أخذ لقطة الشاشة وحفظها في المحاكي
            adb shell screencap -p /sdcard/phoenix_evidence.png
            
            # سحب الصورة من المحاكي إلى جهاز الجيتهاب
            adb pull /sdcard/phoenix_evidence.png .
            echo "✅ Screenshot captured successfully."

      - name: 📤 5. Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Live_Screenshot
          path: phoenix_evidence.png