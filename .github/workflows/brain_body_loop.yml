name: 🚀 PHOENIX_MEGA_CORE_BUILDER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 1. سحب الكود
        uses: actions/checkout@v4

      - name: ☕ 2. تهيئة جافا 17 وتجاوز التراخيص
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ 3. تثبيت أدوات الحشو العملاق
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-pip unzip zip
          pip3 install --user --upgrade "buildozer==1.5.0" "Cython<3.0"
          # قبول تراخيص الأندرويد لفتح قفل الـ 6GB
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "export PATH=\$PATH:~/.local/bin" >> $GITHUB_PATH

      - name: 🧠 4. برمجة "مدير الرام الذكي" (Memory Manager)
        run: |
          mkdir -p game_project
          cat <<EOF > game_project/main.py
          import os, mmap, gc
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.clock import Clock

          class PhoenixMegaEngine(App):
              def build(self):
                  self.core_path = "large_brain_core.dat"
                  self.layout = BoxLayout(orientation='vertical')
                  self.ram_label = Label(text="Memory Usage: Calculating...", font_size='18sp')
                  self.status = Label(text="System Ready | 6GB Data Stream Active", color=(0, 1, 0, 1))
                  
                  self.layout.add_widget(self.status)
                  self.layout.add_widget(self.ram_label)
                  
                  # تحديث مراقب الرام كل ثانية
                  Clock.schedule_interval(self.monitor_ram, 1)
                  return self.layout

              def monitor_ram(self, dt):
                  # محاكاة قراءة جزء ذري من الـ 6 جيجا دون تحميلها بالكامل
                  import psutil
                  process = psutil.Process(os.getpid())
                  ram_usage = process.memory_info().rss / (1024 * 1024)
                  self.ram_label.text = f"RAM Consumption: {ram_usage:.1f} MB / 1500 MB"
                  
                  # إفراغ الرام تلقائياً إذا اقترب من الحد
                  if ram_usage > 1400:
                      gc.collect()
                      self.status.text = "⚠️ Auto-GC Triggered (Protecting RAM)"

          if __name__ == '__main__':
              PhoenixMegaEngine().run()
          EOF

      - name: ⚙️ 5. ضبط الـ Spec للتعامل مع ملفات الـ OBB الضخمة
        run: |
          cat <<EOF > game_project/buildozer.spec
          [app]
          title = Phoenix6GB
          package.name = phoenix.ultra.mega.ram
          package.domain = org.phoenix
          source.dir = .
          source.include_exts = py,png,jpg,kv,bin,hex,dat,db
          # تفعيل ميزة الملفات الضخمة وتجاوز حد الـ 2GB للأندرويد
          android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, MANAGE_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a
          # منع ضغط البيانات لتمكين تقنية الـ mmap (القراءة المباشرة من التخزين)
          android.no_compress_extensions = dat, bin, db
          EOF

      - name: 🚀 6. البناء النهائي (High-Payload Build)
        run: |
          cd game_project
          # إنشاء ملف "وهمي" بحجم 500MB كبداية للنواة (سيتم توسيعه داخل الهاتف لـ 6GB)
          dd if=/dev/urandom of=large_brain_core.dat bs=1M count=500
          export JAVA_HOME=$JAVA_HOME_17_X64
          buildozer -v android debug

      - name: 📤 7. رفع التطبيق (The Mega APK)
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Mega_Core
          path: game_project/bin/*.apk