name: 🎮 🏗️ PHOENIX_GAME_APK_FACTORY

on:
  workflow_dispatch:

jobs:
  build_game_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Environment
        uses: actions/checkout@v4

      - name: 🧠 2. Loading Injected Brain (135MB)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain
          path: ./brain_assets

      - name: 🏗️ 3. Phoenix Game Engine (Brain to Code)
        run: |
          mkdir -p game_project
          # هنا يقوم العقل بدمج القطاعات لإنشاء كود اللعبة
          # سنقوم بمحاكاة "المحرك الذري" الذي يجمع البايتات
          cat <<EOF > game_project/main.py
          from kivy.app import App
          from kivy.uix.button import Button
          from kivy.uix.label import Label
          from kivy.uix.boxlayout import BoxLayout
          import random

          class PhoenixGame(App):
              def build(self):
                  layout = BoxLayout(orientation='vertical')
                  self.btn = Button(text='Generate Bit-World', size_hint=(1, 0.2))
                  self.lbl = Label(text='Phoenix Engine: Ready to Build')
                  layout.add_widget(self.lbl)
                  layout.add_widget(self.btn)
                  return layout

          if __name__ == '__main__':
              PhoenixGame().run()
          EOF
          echo "✅ Game code generated from brain sectors."

      - name: 🛠️ 4. Build APK (The Factory Line)
        uses: ArtemGovorov/buildozer-action@v1
        with:
          workdir: game_project
          buildozer_version: master

      - name: 📤 5. Export The Created Game (APK)
        uses: actions/upload-artifact@v4
        with:
          name: Generated_Phoenix_Game_APK
          path: game_project/bin/*.apk