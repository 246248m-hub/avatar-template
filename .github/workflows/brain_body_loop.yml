      - name: 🧪 8. Logic & UI Smoke Test (Virtual Run)
        run: |
          # تثبيت مكتبة Kivy على السيرفر لتجربة الكود
          pip install kivy
          
          # إنشاء ملف اختبار سريع يتأكد من أن التطبيق يقرأ العقل
          python3 - <<EOF
          import os
          # محاكاة وجود الملفات المحقونة
          os.makedirs('assets/AI_ULTRA', exist_ok=True)
          with open('assets/AI_ULTRA/part1.py', 'w') as f:
              f.write("def brain_logic(): return 'CORTEX_ACTIVE'")
          
          print("--- البدء في فحص منطق التطبيق الذاتي ---")
          try:
              # محاكاة عملية القراءة التي سيقوم بها التطبيق
              with open('assets/AI_ULTRA/part1.py', 'r') as f:
                  content = f.read()
                  if 'CORTEX_ACTIVE' in content:
                      print("✅ نجاح: التطبيق استطاع الوصول إلى العقل المحقون!")
                  else:
                      print("❌ فشل: البيانات مشوهة")
          except Exception as e:
              print(f"❌ خطأ برمجية: {e}")
          EOF