name: 💉 PHOENIX_IMPLANTATION_SURGERY_v2

on:
  workflow_dispatch:

jobs:
  implant_brain:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 🛠️ 2. Install Tools (Zip & Signer)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip default-jre
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          echo "✅ Tools Installed."

      - name: 🧠 3. Download The "Brain" (135MB)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain
          path: ./brain_files

      - name: 📥 4. Download The "Body" (APK)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146013013
          name: Phoenix-Hex-Compiler-v146
          path: ./temp_body

      - name: 🧬 5. Surgical Injection (Using Zip)
        run: |
          # العثور على الـ APK الأصلي
          find ./temp_body -name "*.apk" -exec mv {} ./original_body.apk \;
          
          # إنشاء هيكل المجلدات المطلوب داخل الـ APK
          mkdir -p assets/AI_ULTRA
          
          # نقل ملفات العقل إلى المجلد المؤقت
          cp -r ./brain_files/* assets/AI_ULTRA/
          
          # حقن المجلد مباشرة داخل ملف الـ APK دون فك تشفيره
          # الخيار -u يقوم بتحديث الأرشيف، و -r للتعامل مع المجلدات
          zip -ur original_body.apk assets/
          
          echo "✅ Injection completed via Zip-Stream."

      - name: 🖋️ 6. Sign the Injected APK
        run: |
          # التوقيع ضروري جداً لأننا عدلنا في محتوى الأرشيف
          java -jar signer.jar --apks original_body.apk
          
          # البحث عن الملف الموقع النهائي
          find . -name "*aligned-debugSigned.apk" -exec mv {} Phoenix_Final_Form.apk \;
          echo "✅ Final APK signed."

      - name: 📤 7. Export Final Product
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Final_Integrated
          path: Phoenix_Final_Form.apk