name: 🔗 Atomic_Linker_AI_v81

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'ماذا تريد أن يصنع لك المحرك؟'
        required: true
        default: 'Flashlight App'

jobs:
  build_app:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Fix Project Structure (Ultra-Link)
        run: |
          mkdir -p app/src/main/java/com/atomic/linker
          
          # إعداد ملف الإعدادات ليعرف أين يجد أدوات جوجل
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          # ملف البناء الرئيسي مع تعريف الإصدارات
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          EOF

          # ملف بناء التطبيق
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace "com.atomic.linker"
              compileSdk 33
              defaultConfig {
                  applicationId "com.atomic.linker"
                  minSdk 24
                  targetSdk 33
                  versionCode 81
                  versionName "81.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: 📝 4. Inject Dynamic Code (Based on Prompt)
        run: |
          # تحديد إذا كان المستخدم يريد فلاش أم لا
          if [[ "${{ github.event.inputs.prompt }}" == *"Flash"* ]] || [[ "${{ github.event.inputs.prompt }}" == *"فلاش"* ]]; then
            PERM="<uses-permission android:name='android.permission.CAMERA' />"
            LOGIC="try { val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager; cm.setTorchMode(cm.cameraIdList[0], true) } catch(e:Exception) {}"
            IMPORT="import android.hardware.camera2.CameraManager\nimport android.content.Context"
          else
            PERM=""
            LOGIC="Toast.makeText(this, 'تم تشغيل التطبيق بنجاح!', Toast.LENGTH_LONG).show()"
            IMPORT="import android.widget.Toast"
          fi

          cat << EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              $PERM
              <application android:label="Atomic AI v81" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.atomic.linker.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << EOF > app/src/main/java/com/atomic/linker/MainActivity.kt
          package com.atomic.linker
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          $IMPORT

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(android.widget.TextView(this).apply { 
                      text = "البرومبت المنفذ:\n${{ github.event.inputs.prompt }}"
                      gravity = android.view.Gravity.CENTER
                      textSize = 20f
                  })
                  $LOGIC
              }
          }
          EOF

      - name: 🛠️ 5. Final Execution
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 6. Export Result
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-AI-Result
          path: app/build/outputs/apk/debug/*.apk