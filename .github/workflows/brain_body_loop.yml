name: 🎮 🏗️ PHOENIX_MANUAL_FACTORY

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # سنعود للإصدار 22 لأنه الأكثر استقراراً مع بناء الأندرويد
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ 2. Install Surgical Tools (Fixing Libtool Error)
        run: |
          sudo apt update
          # تثبيت الأدوات المفقودة التي تسببت في الخطأ (libtool, autoconf, automake)
          sudo apt install -y build-essential git python3-dev python3-pip \
          libtool autoconf automake pkg-config zlib1g-dev libssl-dev \
          libffi-dev libgmp-dev libltdl-dev \
          openjdk-17-jdk unzip zip curl
          
          # تثبيت إصدارات محددة من Cython و Buildozer لضمان التوافق
          pip3 install --user --upgrade "Cython<3.0" "buildozer==1.5.0"
          echo "export PATH=\$PATH:~/.local/bin" >> $GITHUB_PATH

      - name: 🧠 3. Loading Brain (135MB)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain
          path: ./game_project/brain_assets

      - name: 🏗️ 4. Prepare Clean Project
        run: |
          mkdir -p game_project
          # كود اللعبة
          cat <<EOF > game_project/main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixGame(App):
              def build(self):
                  return Label(text='Phoenix Engine Active\nBit-Level Integrity: Verified')
          if __name__ == '__main__':
              PhoenixGame().run()
          EOF

          # ملف المواصفات (تم تعديله ليتجاوز أخطاء التحميل)
          cat <<EOF > game_project/buildozer.spec
          [app]
          title = PhoenixGame
          package.name = phoenix.game
          package.domain = org.phoenix
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.2.1
          orientation = portrait
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.api = 31
          android.minapi = 21
          android.ndk = 25b
          p4a.branch = master
          EOF

      - name: 🚀 5. The Grand Build (Clean Start)
        run: |
          cd game_project
          # مسح أي مخلفات قديمة بدأت بشكل خاطئ
          ~/.local/bin/buildozer android clean
          # بدء البناء مع إظهار التفاصيل
          ~/.local/bin/buildozer -v android debug
        continue-on-error: false

      - name: 📤 6. Export The Phoenix APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Ultimate_Game
          path: game_project/bin/*.apk