name: 🔗 Atomic_Linker_AI_v80

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'ماذا تريد أن يصنع لك المحرك؟ (مثلاً: Flashlight App أو 3D Game)'
        required: true
        default: 'Flashlight App'

jobs:
  sculpt_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 🧠 2. AI Brain Processing (Prompt Analysis)
        run: |
          echo "تحليل البرومبت: ${{ github.event.inputs.prompt }}"
          # هنا المحرك يقرأ البرومبت ويحدد "جينات" التطبيق
          if [[ "${{ github.event.inputs.prompt }}" == *"Flash"* ]] || [[ "${{ github.event.inputs.prompt }}" == *"فلاش"* ]]; then
            echo "MODE=FLASH" >> $GITHUB_ENV
          else
            echo "MODE=GENERIC" >> $GITHUB_ENV
          fi

      - name: ☕ 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 4. Structure Linked Project
        run: |
          mkdir -p app/src/main/java/com/atomic/linker
          mkdir -p app/src/main/res/values
          
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace "com.atomic.linker"
              compileSdk 33
              defaultConfig { applicationId "com.atomic.linker"; minSdk 24; targetSdk 33; versionCode 80; versionName "80.0" }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

      - name: 📝 5. Dynamic Code Injection (The Sculpting)
        run: |
          # حقن المانيفست بناءً على الوضع المختار
          if [ "$MODE" = "FLASH" ]; then
            PERM="<uses-permission android:name='android.permission.CAMERA' />"
            LABEL="Atomic Flash AI"
          else
            PERM=""
            LABEL="Atomic Generic AI"
          fi

          cat << EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              $PERM
              <application android:label="$LABEL" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.atomic.linker.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # حقن كود الـ Activity ديناميكياً
          cat << 'EOF' > app/src/main/java/com/atomic/linker/MainActivity.kt
          package com.atomic.linker
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import android.graphics.Color

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.DKGRAY)
                      gravity = android.view.Gravity.CENTER
                  }
                  val tv = TextView(this).apply { 
                      text = "تم نحت هذا التطبيق من البرومبت:\n${{ github.event.inputs.prompt }}"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setPadding(20,20,20,20)
                  }
                  layout.addView(tv)
                  setContentView(layout)
              }
          }
          EOF

      - name: 🛠️ 6. Final Build Execution
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 7. Export Linked APK
        uses: actions/upload-artifact@v4
        with:
          name: Linked-AI-App
          path: app/build/outputs/apk/debug/*.apk