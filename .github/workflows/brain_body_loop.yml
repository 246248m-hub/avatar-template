          # Simplified MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/creator/MainActivity.kt
package com.example.creator

import android.content.Context
import android.hardware.camera2.CameraManager
import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.layout.*
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.platform.LocalContext
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            MaterialTheme {
                Surface(
                    modifier = Modifier.fillMaxSize(),
                    color = MaterialTheme.colorScheme.background
                ) {
                    FlashlightApp()
                }
            }
        }
    }
}

@Composable
fun FlashlightApp() {
    var isFlashlightOn by remember { mutableStateOf(false) }
    val context = LocalContext.current
    
    Column(
        modifier = Modifier
            .fillMaxSize()
            .background(if (isFlashlightOn) Color.Yellow else Color.Black),
        horizontalAlignment = Alignment.CenterHorizontally,
        verticalArrangement = Arrangement.Center
    ) {
        Text(
            text = if (isFlashlightOn) "🔦 ON" else "🔦 OFF",
            color = if (isFlashlightOn) Color.Black else Color.White,
            fontSize = 40.sp,
            fontWeight = FontWeight.Bold,
            modifier = Modifier.padding(bottom = 40.dp)
        )
        
        Button(
            onClick = {
                try {
                    val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                    val cameraId = cameraManager.cameraIdList.firstOrNull()
                    if (cameraId != null) {
                        isFlashlightOn = !isFlashlightOn
                        cameraManager.setTorchMode(cameraId, isFlashlightOn)
                    }
                } catch (e: Exception) {
                    // Handle error silently in production
                    isFlashlightOn = false
                }
            },
            modifier = Modifier
                .size(width = 200.dp, height = 80.dp),
            colors = ButtonDefaults.buttonColors(
                containerColor = if (isFlashlightOn) Color.Red else Color.Green,
                contentColor = Color.White
            )
        ) {
            Text(
                text = if (isFlashlightOn) "TURN OFF" else "TURN ON",
                fontSize = 20.sp,
                fontWeight = FontWeight.Bold
            )
        }
    }
}
EOF

          echo "✅ All project files created!"

      - name: 🏗️ 4. Generate Gradle Wrapper
        run: |
          chmod +x gradlew || true
          if [ ! -f "gradlew" ]; then
            echo "Creating gradlew wrapper..."
            gradle wrapper --gradle-version 8.6 --distribution-type bin
          fi
          
          # Make sure wrapper is executable
          chmod +x gradlew

      - name: 🧪 5. Build APK
        run: |
          echo "=== System Information ==="
          echo "Java:"
          java -version
          echo ""
          echo "Android SDK:"
          sdkmanager --list | head -20
          echo ""
          echo "Building APK..."
          
          # Clean and build
          ./gradlew clean
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: 📤 6. Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flashlight-app
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: 📋 7. Build Report
        if: always()
        run: |
          echo "=== BUILD REPORT ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Status: ${{ job.status }}"
          echo "Time: $(date)"
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_SIZE=$(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')
            echo "✅ APK built successfully!"
            echo "📦 APK Size: $APK_SIZE"
            echo "📍 Location: app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "❌ APK not found!"
            echo "Listing build directory:"
            ls -la app/build/outputs/apk/ || true
          fi
          
          echo "=== Memory Usage ==="
          free -h