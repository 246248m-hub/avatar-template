name: 🚀 Final_Fix_Atomic_Engine_v61

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Structure & Fix Startup Crash
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat << 'EOF' > settings.gradle
          rootProject.name = "AtomicEngine"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # ملف الألوان لتجنب انهيار الثيم
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="purple_500">#FF6200EE</color>
          </resources>
          EOF

          # واجهة رسومية حقيقية (XML) لضمان عدم الإغلاق
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212">
              <TextView
                  android:id="@+id/status"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="⚛️ Atomic Engine v61: Active\nWaiting for Brain Chunks..."
                  android:textColor="#00FF00"
                  android:textSize="20sp"
                  android:layout_centerInParent="true"
                  android:gravity="center"/>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
              namespace "com.atomic.engine"
              compileSdk 33
              defaultConfig {
                  applicationId "com.atomic.engine"
                  minSdk 24
                  targetSdk 33
                  versionCode 61
                  versionName "61.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: 🛠️ 4. Generate Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper

      - name: 📝 5. Manifest & Logic Fix
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application 
                  android:label="Atomic v61" 
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name="com.atomic.engine.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

      - name: 🔨 6. Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 7. Export
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Engine-v61-FIXED
          path: app/build/outputs/apk/debug/*.apk