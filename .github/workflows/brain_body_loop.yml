name: 🚀 Atomic_Installer_Final_v72

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Structure Android Project
        run: |
          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          # 🚨 إصلاح الخطأ: تفعيل AndroidX و Jetifier
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace "com.atomic.engine"
              compileSdk 33
              defaultConfig {
                  applicationId "com.atomic.engine"
                  minSdk 24
                  targetSdk 33
                  versionCode 72
                  versionName "72.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: 📝 4. Inject Manifest & Installer Logic
        run: |
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="."/>
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <application android:label="Atomic Maker v72" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.atomic.engine.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.atomic.engine.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PATHS" android:resource="@xml/file_paths.xml" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.content.Intent
          import android.os.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import java.io.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF121212.toInt())
                      setPadding(50, 50, 50, 50)
                  }
                  val tv = TextView(this).apply { text = "⚛️ Atomic Installer v72\nReady for AAA Synthesis\n"; setTextColor(0xFF00FF00.toInt()) }
                  val input = EditText(this).apply { hint = "Explain Game..."; setTextColor(0xFFFFFFFF.toInt()) }
                  val btn = Button(this).apply { text = "SCULPT & INSTALL" }
                  layout.addView(tv); layout.addView(input); layout.addView(btn)
                  setContentView(layout)

                  btn.setOnClickListener {
                      try {
                          val brain = File(Environment.getExternalStorageDirectory(), "AI_Project/brain.bin")
                          val outputApk = File(Environment.getExternalStorageDirectory(), "AI_Project/generated_game.apk")
                          
                          if(brain.exists()){
                              val raf = RandomAccessFile(brain, "r")
                              val out = FileOutputStream(outputApk)
                              val buffer = ByteArray(1024 * 1024 * 30) // سحب 30 ميجا هيكس
                              raf.seek(0); raf.read(buffer); out.write(buffer)
                              out.close(); raf.close()

                              val apkUri = FileProvider.getUriForFile(this, "com.atomic.engine.fileprovider", outputApk)
                              val intent = Intent(Intent.ACTION_INSTALL_PACKAGE).apply {
                                  data = apkUri
                                  flags = Intent.FLAG_GRANT_READ_URI_PERMISSION
                              }
                              startActivity(intent)
                          } else { tv.append("\n❌ brain.bin not found!") }
                      } catch(e: Exception) { tv.append("\n⚠️ Error: ${e.message}") }
                  }
              }
          }
          EOF

      - name: 🛠️ 5. Final Compilation
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 6. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Installer-v72
          path: app/build/outputs/apk/debug/*.apk