name: 🛡️ Absolute_Truth_Test_v98

on:
  workflow_dispatch:

jobs:
  real_deal_simulation:
    runs-on: macos-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 💎 2. Create 10GB Data
        run: |
          python3 -c "
          import os
          file_path = 'brain.bin'
          with open(file_path, 'wb') as f:
              f.write(b'GENE_START_001')
              f.seek(5 * 1024 * 1024 * 1024)
              f.write(b'GENE_MIDDLE_555')
          "
          echo "✅ 10GB Brain Created."

      - name: 🏗️ 3. Absolute Minimal Project Structure
        run: |
          mkdir -p app/src/main/java/com/atomic/seeker
          mkdir -p app/src/main/res/layout
          
          # إعداد الخصائص لتعطيل أي ميزات ذكية قد تعيق البناء
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties

          # ملف الإعدادات: حذف كل شيء باستثناء اسم المشروع
          cat << 'EOF' > settings.gradle
          rootProject.name = "AtomicSeeker"
          include ':app'
          EOF

          # ملف البناء الرئيسي: الطريقة التقليدية (Legacy Mode)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # ملف بناء التطبيق: العودة للسينتكس القديم المستقر 100%
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 33
              namespace "com.atomic.seeker"
              defaultConfig {
                  applicationId "com.atomic.seeker"
                  minSdkVersion 24
                  targetSdkVersion 33
                  versionCode 98
                  versionName "98.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # كود البحث في الـ 10 جيجا
          cat << 'EOF' > app/src/main/java/com/atomic/seeker/MainActivity.kt
          package com.atomic.seeker
          import android.os.*
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import java.io.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this).apply { 
                      textSize = 25f; setPadding(60,60,60,60); setTextColor(android.graphics.Color.BLUE) 
                  }
                  setContentView(tv)
                  try {
                      val brain = File("/sdcard/brain.bin")
                      if (brain.exists()) {
                          val raf = RandomAccessFile(brain, "r")
                          raf.seek(5 * 1024 * 1024 * 1024.toLong())
                          val buffer = ByteArray(15)
                          raf.read(buffer)
                          tv.text = "🔍 SCAN RESULT:\n\nDATA: ${String(buffer)}\n\nINTELLIGENCE: 100%"
                      } else { tv.text = "❌ Brain File Missing" }
                  } catch (e: Exception) { tv.text = "Error: ${e.message}" }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Atomic Seeker" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.atomic.seeker.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: ☕ 4. Setup Java 11 (More Stable for Legacy Build)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: 🛠️ 5. Force Build (No Wrapper Needed)
        run: |
          # استخدام نسخة Gradle مثبتة مسبقاً في السيرفر لتجنب مشاكل الـ Wrapper
          gradle clean assembleDebug --no-daemon

      - name: 📱 6. Emulator Truth Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb push brain.bin /sdcard/brain.bin
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.atomic.seeker/com.atomic.seeker.MainActivity
            sleep 35
            adb shell screencap -p /sdcard/truth_result.png
            adb pull /sdcard/truth_result.png .

      - name: 📤 7. Final Proof
        uses: actions/upload-artifact@v4
        with:
          name: Absolute-Truth-v98
          path: |
            app/build/outputs/apk/debug/*.apk
            truth_result.png