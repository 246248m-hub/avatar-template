name: 🚀 Final_Atomic_Engine_Stable_v57

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Create Project & Fix Gradle Compatibility
        run: |
          # 1. إنشاء ملف الإعدادات (تعريف المستودعات)
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include(":app")
          EOF

          # 2. ملف بناء الجذر (تعريف الإضافات)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.0" apply false
              id("org.jetbrains.kotlin.android") version "1.8.10" apply false
          }
          EOF

          # 3. إنشاء مجلدات التطبيق
          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/values

          # 4. ملف بناء التطبيق (App Build) - نسخة مبسطة لتفادي أخطاء Gradle 9
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.atomic.engine"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.atomic.engine"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 57
                  versionName = "57.0"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.9.0")
          }
          EOF

      - name: 🛠️ 4. Force Gradle 8.1 (The Fix)
        run: |
          # بدلاً من gradle wrapper العادي، سنستخدم نسخة مثبتة يدوياً
          wget https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -d gradle_stable gradle-8.1-bin.zip
          export PATH=$PATH:$(pwd)/gradle_stable/gradle-8.1/bin
          gradle wrapper --gradle-version 8.1

      - name: 📝 5. Inject Manifest & Core Logic
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.engine">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic Engine Stable" android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "Atomic Engine Stable v57 Online"
                  setContentView(tv)
              }
          }
          EOF

      - name: 🔨 6. Final Build (Using Stable Wrapper)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 7. Artifact Release
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Engine-v57
          path: app/build/outputs/apk/debug/*.apk
