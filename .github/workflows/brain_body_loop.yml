name: 🎮 🏗️ PHOENIX_MANUAL_FACTORY

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ 2. Install Dependencies (المواد الخام)
        run: |
          sudo apt update
          # تصحيح اسم الحزم وإضافة حزم الـ GL والـ JDK الضرورية
          sudo apt install -y build-essential git python3-dev python3-pip \
          ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
          libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
          libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libffi-dev \
          libncurses5-dev libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev \
          liblzma-dev openjdk-17-jdk-headless unzip zip
          
          # تثبيت Cython و Buildozer
          pip3 install --user --upgrade Cython==0.29.33 buildozer
          echo "export PATH=\$PATH:~/.local/bin" >> $GITHUB_PATH

      - name: 🧠 3. Loading Brain (135MB)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain
          path: ./game_project/brain_assets

      - name: 🏗️ 4. Create Game Project
        run: |
          mkdir -p game_project
          # كود اللعبة المولد من العقل
          cat <<EOF > game_project/main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixGame(App):
              def build(self):
                  return Label(text='Phoenix Bit Engine\nStatus: APK Generated from Brain')
          if __name__ == '__main__':
              PhoenixGame().run()
          EOF

          # إنشاء ملف buildozer.spec مُحسّن
          cat <<EOF > game_project/buildozer.spec
          [app]
          title = PhoenixGame
          package.name = phoenix.game
          package.domain = org.phoenix
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.2.1
          orientation = portrait
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.api = 33
          android.minapi = 21
          android.sdk = 33
          p4a.branch = master
          EOF

      - name: 🚀 5. Start Construction (Build APK)
        run: |
          cd game_project
          # تشغيل البناء في وضع debug لمعرفة أي خطأ فوراً
          ~/.local/bin/buildozer -v android debug
        continue-on-error: false

      - name: 📤 6. Export Final Game
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Handmade_Game
          path: game_project/bin/*.apk