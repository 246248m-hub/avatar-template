name: 🚀 Final_Atomic_Engine_Stable_v60

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Fix Project Structure (Java 17 Sync)
        run: |
          # 1. ضبط الخصائص وتفعيل AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

          # 2. ملف الإعدادات
          cat << 'EOF' > settings.gradle
          rootProject.name = "AtomicEngine"
          include ':app'
          EOF

          # 3. ملف بناء الجذر (Groovy)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 4. بناء ملف التطبيق (تم توحيد Java 17 هنا)
          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/values

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace "com.atomic.engine"
              compileSdk 33
              defaultConfig {
                  applicationId "com.atomic.engine"
                  minSdk 24
                  targetSdk 33
                  versionCode 60
                  versionName "60.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: 🛠️ 4. Generate Stable Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper

      - name: 📝 5. Inject Manifest (Removed Duplicate Package)
        run: |
          # تم إزالة package="..." لتفادي تحذير النظام
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic v60" android:requestLegacyExternalStorage="true">
                  <activity android:name="com.atomic.engine.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "⚛️ Engine v60: Full Java 17 Sync"
                  setContentView(tv)
              }
          }
          EOF

      - name: 🔨 6. Final Execution
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 7. Artifact Release
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Engine-v60
          path: app/build/outputs/apk/debug/*.apk