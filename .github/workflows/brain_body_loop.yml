name: 🚀 PHOENIX_FIX_FINAL_v126

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ 3. Install Android SDK Tools Manually
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip cmdline.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          # إعداد المسارات (Crucial Step)
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # الموافقة على كل التراخيص بضغطة واحدة
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME
          
          # تثبيت الأدوات المفقودة يدوياً
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: 🐍 4. Install Buildozer
        run: pip install --user buildozer Cython==0.29.33

      - name: 📝 5. Create main.py
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixApp(App):
              def build(self):
                  return Label(text="🔥 PHOENIX SYSTEM ONLINE\n10GB Brain Linked", font_size='20sp')
          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Build Real APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          buildozer init
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 34/' buildozer.spec
          # تجاوز الفحص اليدوي واستخدام المسار الذي جهزناه
          buildozer -v android debug
          
      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Phoenix-A32
          path: bin/*.apk