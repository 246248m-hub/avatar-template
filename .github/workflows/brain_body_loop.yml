name: 🏗️ PHOENIX_FINAL_PATH_FIX_v134

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ 3. Install SDK Tools & Accept Licenses
        run: |
          # إنشاء هيكل المجلدات الذي يتوقعه Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # تحميل أدوات سطر أوامر أندرويد الرسمية
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          
          # نقل الملفات للمسار الصحيح ليتعرف عليها Buildozer فوراً
          mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          
          # الموافقة على التراخيص قبل البدء
          export PATH=$PATH:~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          yes | sdkmanager --licenses --sdk_root=~/.buildozer/android/platform/android-sdk

      - name: 🐍 4. Install Dependencies
        run: |
          pip install --user --upgrade Cython==0.29.33 buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt-get install -y build-essential libffi-dev libssl-dev pkg-config autoconf automake libtool

      - name: 📝 5. Create main.py
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixApp(App):
              def build(self):
                  return Label(text="🔥 PHOENIX SYSTEM\nPath Fixed & Ready", font_size='20sp')
          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Build APK
        run: |
          buildozer init
          # إعدادات الاستقرار
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 34/' buildozer.spec
          sed -i 's/#android.build_tools_version = 31.0.0/android.build_tools_version = 34.0.0/' buildozer.spec
          
          # تشغيل البناء مع عرض التفاصيل
          buildozer -v android debug

      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Phoenix-A32
          path: bin/*.apk