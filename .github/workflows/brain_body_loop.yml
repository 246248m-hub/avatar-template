name: 🤖 Digital Creation From Scratch - Full Cycle

on:
  workflow_dispatch: # يسمح بالتشغيل اليدوي

jobs:
  create_build_and_install:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------
      # المرحلة 1: إعداد الجسد (البيئة)
      # -----------------------------------------------------------------
      - name: 🛠️ 1. Prepare Body - Install Tools & Create Structure
        run: |
          echo "Installing necessary tools..."
          sudo apt-get update && sudo apt-get install -y jq tree
          echo "Creating project directory structure..."
          mkdir -p app/src/main/java/com/example/creator
          tree # عرض هيكل المجلدات الذي تم إنشاؤه

      # -----------------------------------------------------------------
      # المرحلة 2: العقل يكتب كل ملفات المشروع
      # -----------------------------------------------------------------
      - name: 🧠 2a. Brain writes settings.gradle.kts
        run: |
          AI_RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a minimal `settings.gradle.kts` file for an Android project that includes the `:app` module. Provide only the raw code."}]}]}')
          echo $AI_RESPONSE | jq -r '.candidates[0].content.parts[0].text' | sed 's/```.*//g' > settings.gradle.kts
          echo "✅ settings.gradle.kts created."

      - name: 🧠 2b. Brain writes project build.gradle.kts
        run: |
          AI_RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a minimal top-level `build.gradle.kts` file for an Android project using plugins syntax. Provide only the raw code."}]}]}')
          echo $AI_RESPONSE | jq -r '.candidates.content.parts.text' | sed 's/```.*//g' > build.gradle.kts
          echo "✅ build.gradle.kts created."

      - name: 🧠 2c. Brain writes app build.gradle.kts
        run: |
          AI_RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a complete `build.gradle.kts` for an Android app module. Use `com.example.creator` as namespace. Target SDK 34. Use Jetpack Compose. Provide only the raw kotlin code."}]}]}')
          echo $AI_RESPONSE | jq -r '.candidates[0].content.parts[0].text' | sed 's/```.*//g' > app/build.gradle.kts
          echo "✅ app/build.gradle.kts created."

      - name: 🧠 2d. Brain writes AndroidManifest.xml
        run: |
          AI_RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a complete `AndroidManifest.xml` for a simple Jetpack Compose app. Use `com.example.creator` as package name. The main activity is `.MainActivity`. Provide only the raw XML code."}]}]}')
          echo $AI_RESPONSE | jq -r '.candidates.content.parts.text' | sed 's/```.*//g' > app/src/main/AndroidManifest.xml
          echo "✅ AndroidManifest.xml created."

      - name: 🧠 2e. Brain writes MainActivity.kt
        run: |
          AI_RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GOOGLE_API_KEY }}" -X POST -d '{"contents": [{"parts": [{"text": "Write a complete `MainActivity.kt` file for a Jetpack Compose app. The package is `com.example.creator`. It should display the text `Hello from the Digital Mind!` on the screen. Provide only the raw kotlin code."}]}]}')
          echo $AI_RESPONSE | jq -r '.candidates[0].content.parts[0].text' | sed 's/```.*//g' > app/src/main/java/com/example/creator/MainActivity.kt
          echo "✅ MainActivity.kt created."

      # -----------------------------------------------------------------
      # المرحلة 3: الجسد يبني الـ APK
      # -----------------------------------------------------------------
      - name: 🏗️ 3. Body Builds - Setup JDK and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 🏗️ 3b. Body Builds - Download Gradle Wrapper
        run: |
          # بما أننا لم ننشئ المشروع، نحتاج لتنزيل أداة Gradle يدوياً
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip gradle-8.4-bin.zip
          
      - name: 🏗️ 3c. Body Builds - Assemble the APK
        run: |
          echo "Attempting to build the APK from AI-generated files..."
          # نستخدم أداة Gradle التي نزلناها لبناء المشروع
          ./gradle-8.4/bin/gradle assembleDebug

      # -----------------------------------------------------------------
      # المرحلة 4: الجسد يثبت ويشغل
      # -----------------------------------------------------------------
      - name: 📱 4. Body Installs - Run Emulator and Install APK
        if: success() # لا تعمل هذه الخطوة إلا إذا نجح البناء
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          script: |
            echo "Emulator is ready. Installing the APK created by the Digital Mind..."
            # المسار قد يختلف قليلاً، هذا هو المسار الافتراضي
            adb install app/build/outputs/apk/debug/app-debug.apk
            echo "✅ The Digital Mind has successfully created and installed its own application."
