name: ⚛️ PHOENIX_ATOMIC_COMPILER_v143

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17 (تقليد للوصفة الناجحة)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ 3. Pre-Setup Android SDK (تقليد للوصفة الناجحة)
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          mkdir -p $ANDROID_HOME/tools/bin
          ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME

      - name: 🐍 4. Install Dependencies (تقليد للوصفة الناجحة)
        run: |
          pip install --user Cython==0.29.33 buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🧠 5. Create Python Logic & The Atomic Compiler
        run: |
          # --- أولاً: إنشاء "لقم الدماغ" بلغة بايثون ---
          mkdir -p brain_logic
          cat << 'EOF' > brain_logic/part1_physics.py
          # Physics Module
          GRAVITY = -9.8
          def update_position(obj, time):
              obj['y'] += obj['vy'] * time
              obj['vy'] += GRAVITY * time
              return obj
          EOF
          
          cat << 'EOF' > brain_logic/part2_rendering.py
          # Rendering Module
          def draw_object(obj):
              # في المستقبل، هذا سيتحول إلى تعليمات رسم حقيقية
              return f"DRAW CIRCLE AT ({obj['x']}, {obj['y']}) WITH COLOR {obj['color']}"
          EOF

          # --- ثانياً: إنشاء "المترجم الذري" الذي يقرأ البايثون ---
          # هذا هو الكود الرئيسي للتطبيق
          cat << 'EOF' > main.py
          # --- The Atomic Compiler & Game Engine ---
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.clock import Clock
          import importlib.util

          # --- استيراد "لقم الدماغ" ديناميكياً ---
          def load_module_from_file(module_name, file_path):
              spec = importlib.util.spec_from_file_location(module_name, file_path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          try:
              physics_module = load_module_from_file("physics", "brain_logic/part1_physics.py")
              rendering_module = load_module_from_file("rendering", "brain_logic/part2_rendering.py")
              BRAIN_LOADED = True
          except Exception as e:
              BRAIN_LOADED = False
              ERROR_MSG = str(e)

          class PhoenixApp(App):
              def build(self):
                  self.game_object = {'x': 100, 'y': 500, 'vy': 0, 'color': 'RED'}
                  self.label = Label(text="Initializing...", font_size='20sp')
                  
                  if not BRAIN_LOADED:
                      self.label.text = f"❌ Brain Load Failed:\n{ERROR_MSG}"
                      return self.label

                  # بدء محرك اللعبة
                  Clock.schedule_interval(self.update, 1.0 / 60.0)
                  return self.label

              def update(self, dt):
                  # --- هنا يقوم "المترجم" بتشغيل المنطق ---
                  # 1. تطبيق الفيزياء من اللقمة الأولى
                  self.game_object = physics_module.update_position(self.game_object, dt)
                  
                  # 2. عرض النتيجة من اللقمة الثانية
                  render_command = rendering_module.draw_object(self.game_object)
                  
                  # 3. تحديث الواجهة (في المستقبل ستكون شاشة رسم حقيقية)
                  self.label.text = f"🔥 PHOENIX ENGINE\n{render_command}\nY: {self.game_object['y']:.2f}"

          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Optimized Build (تقليد للوصفة الناجحة)
        run: |
          buildozer init
          # تعديل الإعدادات
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 33/' buildozer.spec
          sed -i 's/#android.build_tools_version = 31.0.0/android.build_tools_version = 33.0.1/' buildozer.spec
          # إضافة مجلد "العقل" إلى الـ APK
          sed -i 's/#source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas\nsource.include_patterns = brain_logic/*' buildozer.spec
          
          # تشغيل البناء
          buildozer -v android debug

      - name: 📤 7. Export APK (تقليد للوصفة الناجحة)
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Atomic-Compiler-A32
          path: bin/*.apk