name: 🚀 Atomic_AI_Final_Success_v65

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Structure & Repository Fix
        run: |
          # 1. إعدادات الخصائص
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # 2. ملف الإعدادات المركزي
          cat << 'EOF' > settings.gradle
          rootProject.name = "AtomicAI"
          include ':app'
          EOF

          # 3. ملف بناء الجذر مع تعريف المستودعات (الحل)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 4. ملف بناء التطبيق
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace "com.atomic.engine"
              compileSdk 33
              defaultConfig {
                  applicationId "com.atomic.engine"
                  minSdk 24
                  targetSdk 33
                  versionCode 65
                  versionName "65.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: 📝 4. Inject Manifest & Code
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic AI" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name="com.atomic.engine.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF121212.toInt())
                      setPadding(32, 32, 32, 32)
                  }
                  val tv = TextView(this).apply {
                      text = "⚛️ Atomic AI v65\nجاهز لاستلام وصف التطبيق..."
                      setTextColor(0xFF00FF00.toInt())
                      textSize = 18f
                  }
                  val input = EditText(this).apply {
                      hint = "اشرح اللعبة أو التطبيق..."
                      setHintTextColor(0x88FFFFFF.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                  }
                  val btn = Button(this).apply { text = "توليد" }
                  
                  layout.addView(tv); layout.addView(input); layout.addView(btn)
                  setContentView(layout)

                  btn.setOnClickListener {
                      tv.append("\n👤: ${input.text}\n⚛️: جاري استدعاء البيانات من الدماغ...")
                      input.text.clear()
                  }
              }
          }
          EOF

      - name: 🛠️ 5. Clean Build & Export
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 6. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-AI-Final-v65
          path: app/build/outputs/apk/debug/*.apk