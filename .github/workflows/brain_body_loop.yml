name: 🚀 GEMINI_AUTO_APPROVE_BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 3. Gemini Auto-Approve (الموافقة الذكية)
        run: |
          # تثبيت أدوات أندرويد الأساسية
          sudo apt-get update
          sudo apt-get install -y sdkmanager
          
          # إجبار النظام على قبول كافة التراخيص عبر ضخ حرف y بشكل مستمر
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      - name: 🐍 4. Install Buildozer
        run: pip install --user buildozer Cython==0.29.33

      - name: 📝 5. Create main.py (تطبيق العنقاء)
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixApp(App):
              def build(self):
                  return Label(text="🔥 PHOENIX SYSTEM ONLINE\nGemini Approved & Linked", font_size='20sp')
          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Start Building (No More License Blocks)
        run: |
          buildozer init
          # تعديل الإعدادات لتثبيت النسخة المستقرة فقط
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 34/' buildozer.spec
          sed -i 's/#android.build_tools_version = 31.0.0/android.build_tools_version = 34.0.0/' buildozer.spec
          
          # أمر البناء مع تجاهل الأخطاء القانونية
          yes | buildozer -v android debug

      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Phoenix-A32
          path: bin/*.apk