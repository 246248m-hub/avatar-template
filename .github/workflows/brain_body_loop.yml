name: 🚀 PHOENIX_2026_ULTIMATE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # أحدث نسخة من نظام التشغيل
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ 3. Install Latest SDK & Accept All (الحل القاطع)
        run: |
          # تثبيت الأدوات الرسمية لأندرويد
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $HOME/cmdline-tools
          
          # إعداد المسارات لتكون مرئية للنظام
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$HOME/cmdline-tools/cmdline-tools/bin
          
          # الموافقة على كل التراخيص (بما فيها النسخة 36.1 التي تظهر لك)
          yes | $HOME/cmdline-tools/cmdline-tools/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME

      - name: 🐍 4. Install Modern Buildozer
        run: |
          pip install --user --upgrade buildozer Cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 📝 5. Create Phoenix App
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          class PhoenixApp(App):
              def build(self):
                  return Label(text="🔥 PHOENIX 2026\nRunning on Latest Engine", font_size='20sp')
          if __name__ == '__main__':
              PhoenixApp().run()
          EOF

      - name: 🔨 6. Build with 2026 Standards
        run: |
          buildozer init
          # ضبط الإعدادات لأحدث إصدار مستقر (API 35) لتجنب فخ 36.1
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 35/' buildozer.spec
          sed -i 's/#android.build_tools_version = 31.0.0/android.build_tools_version = 35.0.0/' buildozer.spec
          
          # إخبار Buildozer أين يجد الـ SDK الذي وافقنا على رخصته
          export ANDROID_HOME=$HOME/android-sdk
          buildozer -v android debug

      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-2026-APK
          path: bin/*.apk