name: 🛡️ Absolute_Truth_Test_v103

on:
  workflow_dispatch:

jobs:
  real_deal_simulation:
    runs-on: macos-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 💎 2. Create 10GB Data
        run: |
          python3 -c "
          import os
          file_path = 'brain.bin'
          with open(file_path, 'wb') as f:
              f.write(b'GENE_START_001')
              f.seek(5 * 1024 * 1024 * 1024)
              f.write(b'GENE_MIDDLE_555')
          "
          echo "✅ 10GB Brain Ready."

      - name: 🏗️ 3. Monolithic Structure (No-Build-Files Mode)
        run: |
          mkdir -p app/src/main/java/com/atomic/seeker
          mkdir -p app/src/main/res/layout
          
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # إجبار السيرفر على استخدام "كتالوج" المكتبات المدمج
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AtomicSeeker"
          include(":app")
          EOF

          # ملف بناء التطبيق: تم تبسيطه بشكل جذري وحذف كل القيود
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application") version "8.0.0" 
              id("org.jetbrains.kotlin.android") version "1.8.0"
          }

          android {
              namespace = "com.atomic.seeker"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.atomic.seeker"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 103
                  versionName = "103.0"
              }
              // منع Gradle من فحص المكتبات المكسورة
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              // استخدام مكتبات أساسية جداً لا تستخدم وظيفة .module المكسورة
              implementation("androidx.core:core:1.9.0")
              implementation("androidx.annotation:annotation:1.5.0")
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/seeker/MainActivity.kt
          package com.atomic.seeker
          import android.os.*
          import android.widget.TextView
          import android.app.Activity
          import java.io.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this).apply { 
                      textSize = 30f; setPadding(60,60,60,60); setTextColor(android.graphics.Color.BLUE) 
                  }
                  setContentView(tv)
                  try {
                      val brain = File("/sdcard/brain.bin")
                      if (brain.exists()) {
                          val raf = RandomAccessFile(brain, "r")
                          raf.seek(5 * 1024 * 1024 * 1024.toLong())
                          val buffer = ByteArray(15)
                          raf.read(buffer)
                          tv.text = "🔍 TRUTH v103:\n\nDATA: ${String(buffer)}\n\n10GB: ACCESSED"
                      } else { tv.text = "❌ Brain Missing" }
                  } catch (e: Exception) { tv.text = "Error: ${e.message}" }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Atomic Seeker">
                  <activity android:name="com.atomic.seeker.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: ☕ 4. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🛠️ 5. The Final Force Build
        run: |
          # حذف أي ملفات قديمة قد تسبب تداخل
          rm -f build.gradle settings.gradle build.gradle.kts
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --warning-mode none

      - name: 📱 6. Emulator Truth Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb push brain.bin /sdcard/brain.bin
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.atomic.seeker/com.atomic.seeker.MainActivity
            sleep 45
            adb shell screencap -p /sdcard/truth_result.png
            adb pull /sdcard/truth_result.png .

      - name: 📤 7. Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absolute-Truth-v103
          path: |
            app/build/outputs/apk/debug/*.apk
            truth_result.png