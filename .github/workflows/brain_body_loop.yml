name: 🚀 Atomic_AI_Chat_Interface_v63

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Structure & Theme Sync
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat << 'EOF' > settings.gradle
          rootProject.name = "AtomicAI"
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          # واجهة المحادثة: صندوق رسائل + أزرار وسائط
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#121212"
              android:padding="8.dp">

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:id="@+id/chatScroll">
                  <TextView
                      android:id="@+id/chatDisplay"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="⚛️ Atomic AI: جاهز لاستلام التعليمات...\n"
                      android:textColor="#00FF00"
                      android:textSize="16sp" />
              </ScrollView>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  
                  <ImageButton
                      android:id="@+id/btnMedia"
                      android:layout_width="50dp"
                      android:layout_height="50dp"
                      android:src="@android:drawable/ic_menu_camera"
                      android:background="#333333" />

                  <EditText
                      android:id="@+id/inputField"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:hint="اشرح فكرتك هنا..."
                      android:textColor="#FFFFFF"
                      android:textColorHint="#888888"
                      android:background="#222222"
                      android:padding="12dp"
                      android:layout_marginHorizontal="4dp"/>

                  <Button
                      android:id="@+id/btnSend"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="إرسال" />
              </LinearLayout>
          </LinearLayout>
          EOF

      - name: 📝 4. Logic Injection (Brain Link)
        run: |
          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val display = findViewById<TextView>(R.id.chatDisplay)
                  val input = findViewById<EditText>(R.id.inputField)
                  val send = findViewById<Button>(R.id.btnSend)
                  val media = findViewById<ImageButton>(R.id.btnMedia)

                  send.setOnClickListener {
                      val text = input.text.toString()
                      if(text.isNotEmpty()){
                          display.append("\n👤 أنت: $text")
                          // هنا يتم استدعاء المحرك لقراءة الـ 10 جيجا وتحليل الطلب
                          display.append("\n⚛️ المحرك: جاري تحليل الفكرة بناءً على الدماغ الثري...")
                          input.text.clear()
                      }
                  }

                  media.setOnClickListener {
                      Toast.makeText(this, "ميزة تحليل الصور والفيديو تتطلب ربط مكتبات الـ Vision من الدماغ", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

      - name: 🔨 5. Final Build
        run: |
          # (نفس أوامر البناء المستقرة السابقة)
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 6. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-AI-Chat-v63
          path: app/build/outputs/apk/debug/*.apk