name: 🚀 Brain_Body_Loop_Final

on:
  workflow_dispatch:

jobs:
  build_core:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Initialize Engine (Fixing Line 13 & Structure)
        run: |
          # إنشاء الملفات الأساسية بترتيب يمنع انهيار الـ YAML
          echo "include(\":app\")" > settings.gradle.kts
          
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.0" apply false
              id("org.jetbrains.kotlin.android") version "1.8.10" apply false
          }
          EOF

          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/values

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.atomic.engine"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.atomic.engine"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 55
                  versionName = "55.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.4.3" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.activity:activity-compose:1.7.2")
              implementation("androidx.compose.ui:ui:1.4.3")
              implementation("androidx.compose.material3:material3:1.1.0")
          }
          EOF

      - name: 🛠️ 4. Setup Wrapper
        run: gradle wrapper --gradle-version 8.1

      - name: 📝 5. Write App Code
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.engine">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic Loop" android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Text("Brain-Body Engine v55: Online") }
              }
          }
          EOF

      - name: 🔨 6. Final Compilation
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 7. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Body-v55
          path: app/build/outputs/apk/debug/*.apk