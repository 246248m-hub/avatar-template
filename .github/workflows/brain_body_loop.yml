name: 🚀 Build_Atomic_Engine_Fixed

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Setup Environment
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Initialize Project & Fix Hierarchy
        run: |
          # 1. إنشاء ملفات الإعدادات أولاً (هذا ما كان يطلبه الخطأ)
          echo "include(':app')" > settings.gradle.kts
          
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.0" apply false
              id("org.jetbrains.kotlin.android") version "1.8.10" apply false
          }
          EOF

          # 2. إنشاء مجلدات التطبيق
          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/values

          # 3. إنشاء ملف بناء التطبيق
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.atomic.engine"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.atomic.engine"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 52
                  versionName = "52.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.4.3" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.activity:activity-compose:1.7.2")
              implementation("androidx.compose.ui:ui:1.4.3")
              implementation("androidx.compose.material3:material3:1.1.0")
          }
          EOF

          # 4. توليد الـ Wrapper الآن (بعد وجود الإعدادات)
          gradle wrapper

          # 5. كود المشغل (Kotlin) والمانيفست
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.engine">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic Engine" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import android.os.Environment
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import java.io.File

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      var prompt by remember { mutableStateOf("") }
                      Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                          Text("⚛️ مشغل الهيكس v52", style = MaterialTheme.typography.headlineMedium)
                          TextField(value = prompt, onValueChange = { prompt = it }, label = { Text("أدخل البرومبت") }, modifier = Modifier.fillMaxWidth())
                          Button(onClick = { /* التنفيذ */ }, modifier = Modifier.fillMaxWidth().padding(top = 10.dp)) { Text("توليد") }
                      }
                  }
              }
          }
          EOF

      - name: 🔨 Final Build
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-Engine-v52
          path: app/build/outputs/apk/release/*.apk