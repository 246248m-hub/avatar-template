name: 🤖 AI Creates, Builds, and Uploads App (v16 - Auto Wrapper)

on:
  workflow_dispatch:

jobs:
  create_build_and_install:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ 1. Prepare Environment & Structure
        run: |
          sudo apt-get update && sudo apt-get install -y jq tree
          mkdir -p app/src/main/java/com/example/creator
          mkdir -p gradle
          tree

      - name: 🧠 2. Brain writes all project files
        run: |
          MODEL_NAME="gemini-1.5-flash-latest"
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.2.0"
          kotlin = "1.9.22"
          coreKtx = "1.12.0"
          activityCompose = "1.8.2"
          composeBom = "2024.02.01"
          junit = "4.13.2"
          androidxTestExtJunit = "1.1.5"
          espressoCore = "3.5.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
          androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

          [plugins]
          androidApplication = { id = "com.android.application", version.ref = "agp" }
          kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          EOF

          echo "Writing settings.gradle.kts..."
          cat << 'EOF' > settings.gradle.kts
          rootProject.name = "avatar-template"
          include(":app")
          EOF

          echo "✅ All project files created."

      - name: 🏗️ 3. Generate Gradle Wrapper
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          gradle wrapper --gradle-version 8.4

      - name: 🏗️ 4. Body Builds - Setup & Assemble
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          echo "Attempting to build the Flashlight APK (v16)..."
          ./gradlew assembleDebug

      - name: 📱 5. Body Installs (Optional) - Run Emulator and Install APK
        if: ${{ success() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk

      - name: 📤 6. Upload APK Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: flashlight-app
          path: app/build/outputs/apk/debug/app-debug.apk