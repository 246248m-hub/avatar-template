name: 🛠️ PHOENIX_HEX_COMPILER_v146

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ 3. Pre-Setup Android SDK (Success Path)
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          mkdir -p $ANDROID_HOME/tools/bin
          ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME

      - name: 🐍 4. Install Dependencies
        run: |
          pip install --user Cython==0.29.33 buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 📝 5. Create main.py (Python-to-Hex Translator)
        run: |
          cat << 'EOF' > main.py
          import os
          import struct
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.textinput import TextInput
          from kivy.uix.button import Button
          from kivy.utils import platform

          class PhoenixHexApp(App):
              def build(self):
                  self.layout = BoxLayout(orientation='vertical', padding=20, spacing=10)
                  self.lbl = Label(text="🔥 PHOENIX HEX COMPILER\nStatus: Waiting for Logic...", font_size='18sp', halign='center')
                  self.input = TextInput(hint_text="Project Name...", size_hint_y=0.2)
                  btn = Button(text="TRANSLATE PYTHON TO HEX & BUILD", size_hint_y=0.2, background_color=(0.5, 0, 1, 1))
                  btn.bind(on_press=self.compile_to_binary)
                  
                  self.layout.add_widget(self.lbl)
                  self.layout.add_widget(self.input)
                  self.layout.add_widget(btn)
                  return self.layout

              def compile_to_binary(self, instance):
                  name = self.input.text or "HexOut"
                  py_path = "/sdcard/Documents/AI" if platform == 'android' else "./AI"
                  out_path = "/sdcard/Documents/Phoenix_Outputs"
                  os.makedirs(out_path, exist_ok=True)
                  
                  final_apk = os.path.join(out_path, f"{name}.apk")
                  
                  try:
                      with open(final_apk, "wb") as bin_file:
                          # 1. ترويسة ملف APK (الهيكس القياسي)
                          bin_file.write(b'\x50\x4B\x03\x04')
                          
                          # 2. المترجم: تحويل نصوص بايثون إلى بايتات هيكس
                          for i in range(1, 26):
                              file_p = os.path.join(py_path, f"part{i}.py")
                              if os.path.exists(file_p):
                                  with open(file_p, "r") as f_py:
                                      py_logic = f_py.read()
                                      # عملية تحويل المنطق إلى بايتات ثنائية (Binary Translation)
                                      hex_logic = py_logic.encode('utf-8').hex()
                                      bin_file.write(bytes.fromhex(hex_logic))
                                      
                      self.lbl.text = f"✅ Compiled Successfully!\nPython Logic -> Hex Binary\nPath: {final_apk}"
                  except Exception as e:
                      self.lbl.text = f"❌ Error: {str(e)}"

          if __name__ == '__main__': PhoenixHexApp().run()
          EOF

      - name: 🔨 6. Optimized Build (API 33)
        run: |
          buildozer init
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 33/' buildozer.spec
          sed -i 's/#android.build_tools_version = 31.0.0/android.build_tools_version = 33.0.1/' buildozer.spec
          sed -i 's/android.permissions = PACKAGE_USAGE_STATS/android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE,REQUEST_INSTALL_PACKAGES/' buildozer.spec
          buildozer -v android debug

      - name: 📤 7. Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Hex-Compiler-v146
          path: bin/*.apk