name: 💉 🔍 PHOENIX_SURGERY_AND_INSPECTION

on:
  workflow_dispatch:

jobs:
  surgery_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 🛠️ 2. Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip wget default-jre
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: 🧠 3. Download Brain (135MB)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146976650
          name: Phoenix_Ultra_Brain
          path: ./brain_files

      - name: 📥 4. Download Body
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: 246248m-hub/avatar-template
          run_id: 21146013013
          name: Phoenix-Hex-Compiler-v146
          path: ./temp_body

      - name: 🧬 5. Surgical Injection
        run: |
          # تجهيز الملف الأصلي
          find ./temp_body -name "*.apk" -exec mv {} ./original_body.apk \;
          
          # إنشاء مجلد الأصول الداخلي
          mkdir -p assets/AI_ULTRA
          
          # نقل خلايا العقل للمجلد
          cp -r ./brain_files/* assets/AI_ULTRA/
          
          # حقن المجلد في الـ APK
          zip -ur original_body.apk assets/
          
          # توقيع التطبيق ليكون قابلاً للتثبيت
          java -jar signer.jar --apks original_body.apk
          find . -name "*aligned-debugSigned.apk" -exec mv {} Phoenix_Ready.apk \;
          echo "✅ Surgery Complete."

      - name: 🔍 6. Forensic Inspection (تقرير التشريح)
        run: |
          echo "==========================================" > report.txt
          echo "📊 PHOENIX SURGERY INSPECTION REPORT" >> report.txt
          echo "==========================================" >> report.txt
          echo "DATE: $(date)" >> report.txt
          echo "" >> report.txt
          echo "📦 FINAL APK SIZE:" >> report.txt
          du -sh Phoenix_Ready.apk >> report.txt
          echo "" >> report.txt
          echo "🧠 BRAIN SECTORS FOUND INSIDE ASSETS:" >> report.txt
          unzip -l Phoenix_Ready.apk | grep "assets/AI_ULTRA/" | awk '{print "File: " $4 " | Size: " $1 " bytes"}' >> report.txt
          echo "" >> report.txt
          echo "✅ VERIFICATION: ALL SYSTEMS GO." >> report.txt
          cat report.txt

      - name: 📤 7. Export Final Product & Report
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Integrated_Final_Package
          path: |
            Phoenix_Ready.apk
            report.txt