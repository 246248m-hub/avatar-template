name: 🤖 AI Creates, Builds, Signs, and Uploads App (Final v31)

on:
  workflow_dispatch:

jobs:
  create_build_sign_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 1. Checkout Repository
        uses: actions/checkout@v4

      # انقل خطوة إنشاء الملفات إلى هنا (قبل الجافا)
      - name: 🛠 2. Prepare & Create Project Files
        run: |
          mkdir -p app/src/main/java/com/example/creator
          mkdir -p app/src/main/res/values
          mkdir -p gradle
          
          # إنشاء libs.versions.toml أولاً لكي يراها الأكشن في الخطوة التالية
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.2.0"
          kotlin = "1.9.22"
          coreKtx = "1.12.0"
          activityCompose = "1.8.2"
          composeBom = "2024.02.01"
          junit = "4.13.2"
          androidxTestExtJunit = "1.1.5"
          espressoCore = "3.5.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
          androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

          [plugins]
          androidApplication = { id = "com.android.application", version.ref = "agp" }
          kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          EOF

          # بقية الملفات (AndroidManifest, MainActivity, build.gradle...)
          # تأكد من إضافة كل ملفات الـ cat << 'EOF' هنا كما في النسخ السابقة

      - name: ☕ 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # الآن سيجد الملفات ولن يظهر الخطأ

      - name: 📱 4. Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools-version: '34.0.0'

      - name: 🏗️ 5. Build Signed APK
        run: |
          # توليد الـ Keystore لو لم يكن موجوداً
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias flashlight -storepass android -keypass android \
            -dname "CN=Example, OU=ID, O=Org, L=City, S=State, C=US"
          
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 📤 6. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashlight-signed-app
          path: app/build/outputs/apk/release/app-release.apk