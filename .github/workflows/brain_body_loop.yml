name: 🤖 AI Creates, Builds, Signs, and Uploads App (Final v32)

on:
  workflow_dispatch:

jobs:
  create_build_sign_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 1. Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ 3. Initialize Project & Build
        run: |
          # أ- إنشاء هيكل المجلدات
          mkdir -p gradle
          mkdir -p app/src/main/java/com/example/creator
          mkdir -p app/src/main/res/values

          # ب- إنشاء ملف libs.versions.toml (تأكد من الإزاحة بـ 10 مسافات)
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.2.0"
          kotlin = "1.9.22"
          coreKtx = "1.12.0"
          activityCompose = "1.8.2"
          composeBom = "2024.02.01"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

          [plugins]
          androidApplication = { id = "com.android.application", version.ref = "agp" }
          kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          EOF

          # ج- إنشاء ملف settings.gradle.kts في المجلد الرئيسي
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { gradlePluginPortal(); google(); mavenCentral() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "flashlight-app"
          include(":app")
          EOF

          # د- إنشاء ملف build.gradle.kts للتطبيق
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.androidApplication)
              alias(libs.plugins.kotlinAndroid)
          }
          android {
              namespace = "com.example.creator"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.creator"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("keystore.jks")
                      storePassword = "password"
                      keyAlias = "myalias"
                      keyPassword = "password"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.graphics)
              implementation(libs.androidx.compose.material3)
          }
          EOF

          # هـ- إنشاء الكود البرمجي (MainActivity)
          cat << 'EOF' > app/src/main/java/com/example/creator/MainActivity.kt
          package com.example.creator
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Text("Flashlight App Ready") }
              }
          }
          EOF

          # و- إنشاء ملف Manifest بسيط
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Flashlight">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ز- توليد الـ Keystore
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias myalias -storepass password -keypass password \
            -dname "CN=Example, OU=ID, O=Org, L=City, S=State, C=US"

          # ح- فحص وجود الملفات قبل البناء (للإصلاح)
          echo "Checking directory structure:"
          ls -R

          # ط- تنفيذ البناء
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 📤 4. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashlight-signed-app
          path: app/build/outputs/apk/release/app-release.apk