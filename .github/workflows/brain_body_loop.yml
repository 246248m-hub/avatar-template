name: 🤖 AI Creates, Builds, and Uploads App (Final v20)

on:
  workflow_dispatch:

jobs:
  create_build_and_install:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ 1. Prepare Environment & Structure
        run: |
          sudo apt-get update && sudo apt-get install -y jq tree
          mkdir -p app/src/main/java/com/example/creator
          mkdir -p app/src/main/res/values
          mkdir -p gradle
          tree

      - name: 🧠 2. Brain writes all project files
        run: |
          # libs.versions.toml
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.2.0"
          kotlin = "1.9.22"
          coreKtx = "1.12.0"
          activityCompose = "1.8.2"
          composeBom = "2024.02.01"
          junit = "4.13.2"
          androidxTestExtJunit = "1.1.5"
          espressoCore = "3.5.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
          androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

          [plugins]
          androidApplication = { id = "com.android.application", version.ref = "agp" }
          kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "avatar-template"
          include(":app")
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          # build.gradle.kts for app module
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.androidApplication)
              alias(libs.plugins.kotlinAndroid)
          }

          android {
              namespace = "com.example.creator"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.creator"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.3"
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.graphics)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.compose.material3)
              testImplementation(libs.junit)
              androidTestImplementation(libs.androidx.test.ext.junit)
              androidTestImplementation(libs.androidx.test.espresso.core)
          }
          EOF

          # AndroidManifest.xml (بدون package + مع android:exported + ثيم مخصص)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Flashlight App"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Flashlight">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # themes.xml (ثيم مخصص بدون ActionBar)
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.Flashlight" parent="Theme.Material3.DayNight">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/creator/MainActivity.kt
          package com.example.creator

          import android.os.Bundle
          import android.content.Context
          import android.hardware.camera2.CameraManager
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.tooling.preview.Preview

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      FlashlightApp()
                  }
              }
          }

          @Composable
          fun FlashlightApp() {
              var isOn by remember { mutableStateOf(false) }
              val context = LocalContext.current
              val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
              val cameraId = cameraManager.cameraIdList[0]

              Button(onClick = {
                  isOn = !isOn
                  cameraManager.setTorchMode(cameraId, isOn)
              }) {
                  Text(if (isOn) "Turn Off" else "Turn On")
              }
          }

          @Preview
          @Composable
          fun PreviewFlashlightApp() {
              FlashlightApp()
          }
          EOF

          echo "✅ All project files created."

      - name: 🏗️ 3. Generate Gradle Wrapper
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          gradle wrapper --gradle-version 8.4

      - name: 🏗️ 4. Body Builds - Setup & Assemble
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          echo "Attempting to build the Flashlight APK (Final)..."
          ./gradlew :app:assembleDebug

      - name: 📱 5. Body Installs (Optional) - Run Emulator and Install APK
        if: ${{ success() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.example.creator/.MainActivity

      - name: 📤 6. Upload APK Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: flashlight-app
          path: app/build/outputs/apk/debug/app-debug.apk