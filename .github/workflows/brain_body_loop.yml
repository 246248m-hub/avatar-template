      - name: 🚀 6. Run Emulator & Capture Screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27 # إصدار أخف وأسرع
          target: default # نسخة بدون خدمات جوجل لتقليل الحمل
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 1200 # زيادة الوقت لضمان الإقلاع
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            # الانتظار حتى يستقر النظام تماماً
            adb wait-for-device
            
            # تثبيت التطبيق
            echo "Installing Phoenix..."
            adb install Phoenix_Ready.apk
            
            # تشغيل التطبيق
            echo "Launching App..."
            adb shell monkey -p org.test.phoenix -c android.intent.category.LAUNCHER 1
            
            # انتظار كافٍ لتحميل الـ 135 ميجابايت
            sleep 45
            
            # التقاط الصورة وحفظها
            echo "Capturing Screenshot..."
            adb shell screencap -p /sdcard/result.png
            adb pull /sdcard/result.png .