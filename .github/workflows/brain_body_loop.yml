name: 🚀 Build_AI_Atomic_Reader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/atomic/reader
          mkdir -p app/src/main/res/values

          # ملف المانيفست (لإعطاء صلاحيات الذاكرة للهاتف A32)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.atomic.reader">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic Reader" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ملف الكود البرمجي (المشغل والقارئ للهيكس)
          cat << 'EOF' > app/src/main/java/com/atomic/reader/MainActivity.kt
          package com.atomic.reader

          import android.os.Bundle
          import android.os.Environment
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import java.io.File
          import java.io.RandomAccessFile

          class MainActivity : ComponentActivity() {
              // مسار ملف الدماغ الـ 10 جيجا على هاتفك
              private val brainPath = "${Environment.getExternalStorageDirectory()}/AI_Project/brain.bin"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      var prompt by remember { mutableStateOf("") }
                      var status by remember { mutableStateOf("جاهز للقراءة...") }

                      Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                          Text("🧠 المشغل الذري v1.0", style = MaterialTheme.typography.headlineMedium)
                          Spacer(modifier = Modifier.height(16.dp))
                          
                          TextField(
                              value = prompt,
                              onValueChange = { prompt = it },
                              label = { Text("أدخل البرومبت (بالعربية)") },
                              modifier = Modifier.fillMaxWidth()
                          )
                          
                          Button(
                              onClick = { 
                                  status = runFromBrain(prompt)
                              },
                              modifier = Modifier.padding(top = 8.dp)
                          ) {
                              Text("استخراج وتنفيذ من ملف الذكاء")
                          }
                          
                          Text("الحالة: $status", modifier = Modifier.padding(top = 16.dp))
                      }
                  }
              }

              // المحرك الذي يقرأ من الـ 10 جيجا
              private fun runFromBrain(input: String): String {
                  val file = File(brainPath)
                  if (!file.exists()) return "خطأ: ملف brain.bin غير موجود في AI_Project"
                  
                  return try {
                      val raf = RandomAccessFile(file, "r")
                      // هنا المنطق: الذكاء الاصطناعي يحول "النص" إلى "عنوان هيكس"
                      // ثم يذهب القارئ لهذا العنوان ويقرأ التعليمات
                      raf.seek(0) // مثال: نبدأ من أول بايت
                      val firstByte = raf.readByte()
                      raf.close()
                      "تمت قراءة البايت ($firstByte) بنجاح من الدماغ"
                  } catch (e: Exception) {
                      "خطأ في القراءة: ${e.message}"
                  }
              }
          }
          EOF

      - name: 🛠️ Setup Build Configuration
        run: |
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
              compileSdkVersion 33
              namespace "com.atomic.reader"
              defaultConfig {
                  applicationId "com.atomic.reader"
                  minSdkVersion 24
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.4.3' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.activity:activity-compose:1.7.2'
              implementation 'androidx.compose.ui:ui:1.4.3'
              implementation 'androidx.compose.material3:material3:1.1.0'
          }
          EOF

      - name: 🔨 Build APK
        run: |
          # إنشاء ملف gradle.properties ضروري
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          # تجميع الـ APK
          chmod +x gradlew
          ./gradlew assembleRelease