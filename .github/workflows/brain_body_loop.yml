name: 🚀 Atomic_AI_Final_Fix_v64

on:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🏗️ 3. Structure Project Modules
        run: |
          # ملفات الجذر (Root)
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat << 'EOF' > settings.gradle
          rootProject.name = "AtomicAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          EOF

          # إنشاء مجلد التطبيق (Module: app)
          mkdir -p app/src/main/java/com/atomic/engine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # --- هام: وضع ملف بناء التطبيق داخل مجلد app ---
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace "com.atomic.engine"
              compileSdk 33
              defaultConfig {
                  applicationId "com.atomic.engine"
                  minSdk 24
                  targetSdk 33
                  versionCode 64
                  versionName "64.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: 📝 4. Inject Manifest & Layout
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#121212"
              android:padding="16dp">
              <ScrollView android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <TextView android:id="@+id/chatDisplay" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:text="⚛️ Atomic AI v64\nجاهز لاستلام وصف اللعبة أو التطبيق..." android:textColor="#00FF00" android:textSize="16sp" />
              </ScrollView>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <EditText android:id="@+id/inputField" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:hint="اشرح فكرتك..." android:textColor="#FFFFFF" android:background="#222222" android:padding="12dp"/>
                  <Button android:id="@+id/btnSend" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="إرسال" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="Atomic AI" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name="com.atomic.engine.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/atomic/engine/MainActivity.kt
          package com.atomic.engine
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val display = findViewById<TextView>(R.id.chatDisplay)
                  val input = findViewById<EditText>(R.id.inputField)
                  val send = findViewById<Button>(R.id.btnSend)

                  send.setOnClickListener {
                      val text = input.text.toString()
                      if(text.isNotEmpty()){
                          display.append("\n👤 أنت: $text")
                          display.append("\n⚛️ المحرك: جاري معالجة الشرح لتوليد الأكواد من الدماغ...")
                          input.text.clear()
                      }
                  }
              }
          }
          EOF

      - name: 🛠️ 5. Generate Wrapper & Build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          ./gradle-8.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 6. Export
        uses: actions/upload-artifact@v4
        with:
          name: Atomic-AI-v64-FIXED
          path: app/build/outputs/apk/debug/*.apk