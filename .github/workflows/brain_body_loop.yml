name: 🤖 AI Creates, Builds, and Uploads App (Final v25)

on:
  workflow_dispatch:

jobs:
  create_build_and_install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools-version: '34.0.0'

      - name: 🛠 Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tree unzip
          mkdir -p app/src/main/java/com/example/creator
          mkdir -p app/src/main/res/values
          mkdir -p gradle

      - name: 🧠 Create Project Files
        run: |
          # libs.versions.toml
          mkdir -p gradle
          echo "[versions]" > gradle/libs.versions.toml
          echo "agp = \"8.2.0\"" >> gradle/libs.versions.toml
          echo "kotlin = \"1.9.22\"" >> gradle/libs.versions.toml
          echo "coreKtx = \"1.12.0\"" >> gradle/libs.versions.toml
          echo "activityCompose = \"1.8.2\"" >> gradle/libs.versions.toml
          echo "composeBom = \"2024.02.01\"" >> gradle/libs.versions.toml
          echo "junit = \"4.13.2\"" >> gradle/libs.versions.toml
          echo "androidxTestExtJunit = \"1.1.5\"" >> gradle/libs.versions.toml
          echo "espressoCore = \"3.5.1\"" >> gradle/libs.versions.toml
          echo "" >> gradle/libs.versions.toml
          echo "[libraries]" >> gradle/libs.versions.toml
          echo "androidx-core-ktx = { group = \"androidx.core\", name = \"core-ktx\", version.ref = \"coreKtx\" }" >> gradle/libs.versions.toml
          echo "androidx-activity-compose = { group = \"androidx.activity\", name = \"activity-compose\", version.ref = \"activityCompose\" }" >> gradle/libs.versions.toml
          echo "androidx-compose-bom = { group = \"androidx.compose\", name = \"compose-bom\", version.ref = \"composeBom\" }" >> gradle/libs.versions.toml
          echo "androidx-compose-ui = { group = \"androidx.compose.ui\", name = \"ui\" }" >> gradle/libs.versions.toml
          echo "androidx-compose-ui-graphics = { group = \"androidx.compose.ui\", name = \"ui-graphics\" }" >> gradle/libs.versions.toml
          echo "androidx-compose-ui-tooling-preview = { group = \"androidx.compose.ui\", name = \"ui-tooling-preview\" }" >> gradle/libs.versions.toml
          echo "androidx-compose-material3 = { group = \"androidx.compose.material3\", name = \"material3\" }" >> gradle/libs.versions.toml
          echo "junit = { group = \"junit\", name = \"junit\", version.ref = \"junit\" }" >> gradle/libs.versions.toml
          echo "androidx-test-ext-junit = { group = \"androidx.test.ext\", name = \"junit\", version.ref = \"androidxTestExtJunit\" }" >> gradle/libs.versions.toml
          echo "androidx-test-espresso-core = { group = \"androidx.test.espresso\", name = \"espresso-core\", version.ref = \"espressoCore\" }" >> gradle/libs.versions.toml
          echo "" >> gradle/libs.versions.toml
          echo "[plugins]" >> gradle/libs.versions.toml
          echo "androidApplication = { id = \"com.android.application\", version.ref = \"agp\" }" >> gradle/libs.versions.toml
          echo "kotlinAndroid = { id = \"org.jetbrains.kotlin.android\", version.ref = \"kotlin\" }" >> gradle/libs.versions.toml

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
pluginManagement {
  repositories { gradlePluginPortal(); google(); mavenCentral() }
}
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories { google(); mavenCentral() }
}
rootProject.name = "flashlight-app"
include(":app")
EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.CAMERA" />
    <application android:label="Flashlight" android:theme="@android:style/Theme.Material.Light.NoActionBar">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          # themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
<resources>
    <style name="Theme.Flashlight" parent="@android:style/Theme.Material.Light.NoActionBar" />
</resources>
EOF

          # build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
plugins {
  alias(libs.plugins.androidApplication)
  alias(libs.plugins.kotlinAndroid)
}

android {
  namespace = "com.example.creator"
  compileSdk = 34

  defaultConfig {
    applicationId = "com.example.creator"
    minSdk = 24
    targetSdk = 34
    versionCode = 1
    versionName = "1.0"
  }

  buildFeatures { compose = true }

  composeOptions {
    kotlinCompilerExtensionVersion = "1.5.3"
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  kotlinOptions { jvmTarget = "17" }
}

dependencies {
  implementation(libs.androidx.core.ktx)
  implementation(libs.androidx.activity.compose)
  implementation(platform(libs.androidx.compose.bom))
  implementation(libs.androidx.compose.ui)
  implementation(libs.androidx.compose.ui.graphics)
  implementation(libs.androidx.compose.ui.tooling.preview)
  implementation(libs.androidx.compose.material3)
}
EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/creator/MainActivity.kt
package com.example.creator

import android.content.Context
import android.hardware.camera2.CameraManager
import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.background
import androidx.compose.foundation.layout.*
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.platform.LocalContext
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            MaterialTheme {
                Surface(modifier = Modifier.fillMaxSize()) {
                    FlashlightApp()
                }
            }
        }
    }
}

@Composable
fun FlashlightApp() {
    var isFlashlightOn by remember { mutableStateOf(false) }
    val context = LocalContext.current

    Column(
        modifier = Modifier
            .fillMaxSize()
            .background(if (isFlashlightOn) Color.Yellow else Color.Black),
        horizontalAlignment = Alignment.CenterHorizontally,
        verticalArrangement = Arrangement.Center
    ) {
        Text(
            text = if (isFlashlightOn) "🔦 ON" else "🔦 OFF",
            color = if (isFlashlightOn) Color.Black else Color.White,
            fontSize = 40.sp,
            fontWeight = FontWeight.Bold,
            modifier = Modifier.padding(bottom = 40.dp)
        )

        Button(
            onClick = {
                try {
                    val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                    val cameraId = cameraManager.cameraIdList.firstOrNull()
                    if (cameraId != null) {
                        isFlashlightOn = !isFlashlightOn
                        cameraManager.setTorchMode(cameraId, isFlashlightOn)
                    }
                } catch (e: Exception) {
                    isFlashlightOn = false