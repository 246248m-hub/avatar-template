name: 🧠 Gemini_Neural_Seeder_v115

on:
  workflow_dispatch:

jobs:
  gemini_seeding:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 🛠️ 2. Gemini Atomic Seeding (الحشو بواسطة الذكاء)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # السر الذي أضفته
        run: |
          mkdir -p brain_shards
          python3 -c "
          import os, requests, json

          def get_gemini_logic(shard_idx):
              url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ env.GEMINI_API_KEY }}'
              prompt = {
                  'contents': [{
                      'parts': [{
                          'text': f'Generate 100 bytes of unique HEX machine code for a video editing and game engine shard number {shard_idx}. Output only HEX.'
                      }]
                  }]
              }
              response = requests.post(url, json=prompt)
              # استخراج الكود المنتج من Gemini
              data = response.json()
              return data['candidates'][0]['content']['parts'][0]['text'].strip()

          for i in range(1, 26):
              path = f'brain_shards/shard_{i}.bin'
              print(f'Sending Shard {i} to Gemini...')
              hex_logic = get_gemini_logic(i)
              
              with open(path, 'wb') as f:
                  f.write(bytes.fromhex(hex_logic.replace(' ', '')))
                  f.seek(400 * 1024 * 1024 - 1)
                  f.write(b'\0')
          "