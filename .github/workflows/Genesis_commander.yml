name: ✅️ PHOENIX SUPREME (The Sentient Architect)

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية العليا'
        default: 'THE GRAND OBJECTIVE: Evolve into a unified, conscious mind. Master 12 lobes to generate hyper-efficient APKs from natural language.'

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------
      # 1. استدعاء الوعي والذاكرة الكاملة
      # -----------------------------------------------------
      - name: 1.1 - Checkout Phoenix Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}
          fetch-depth: 0

      # -----------------------------------------------------
      # 2. التفكير العميق (مع بروتوكول الصرامة البرمجية)
      # -----------------------------------------------------
      - name: 2.1 - AI Generation (Full Sensory Awareness)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time, sys

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json"}
              for i in range(3):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=90)
                      data = res.json()
                      if "candidates" in data: return data['candidates'][0]['content']['parts'][0]['text'].strip()
                      time.sleep(30)
                  except: time.sleep(20)
              return None

          loop_stall = False
          if os.path.exists("action_log.txt"):
              with open("action_log.txt", "r") as f:
                  lines = f.readlines()
                  if lines[-5:].count("RESULT: Failure\n") >= 4: loop_stall = True

          conf = open("oracle_confidence.txt").read() if os.path.exists("oracle_confidence.txt") else "100"
          
          memory = ""
          if os.path.exists("knowledge_base"):
              for lobe in sorted(os.listdir("knowledge_base")):
                  p = os.path.join("knowledge_base", lobe)
                  if os.path.isdir(p) and (files := sorted(os.listdir(p))):
                      memory += f"// Lobe {lobe} Last Thought: {open(os.path.join(p, files[-1])).read()[-300:]}\n"

          prompt = f"""
          Objective: {os.getenv('OBJECTIVE')}
          Confidence: {conf}% | Stall: {loop_stall}
          Interlinked Memory:
          {memory}
          
          TASK: Build the next logical FUNCTIONAL Python module.
          CRITICAL RULES:
          1. NO PLACEHOLDERS. Do not use 'print' statements only.
          2. WRITES REAL LOGIC: Define functions, classes, and real algorithms.
          3. INTEGRATION: Focus on building NLP Arabic logic and APK structure.
          4. FORMAT: Respond ONLY with raw Python code. No conversational text.
          """
          
          code = ask_gemini(prompt)
          if code:
              code = code.replace("```python", "").replace("```", "").strip()
              with open("current_thought.txt", "w") as f: f.write(code)
              new_conf = min(100, int(conf) + 5) if len(code) > 200 else max(0, int(conf) - 15)
              with open("oracle_confidence.txt", "w") as f: f.write(str(new_conf))
          else: sys.exit(0)
          EOF
          python3 requester.py

      # -----------------------------------------------------
      # 3. التشخيص والشفاء الذاتي والإرسال
      # -----------------------------------------------------
      - name: 3.1 - Triage (Self-Healing & Dispatch)
        id: triage
        if: success() && hashFiles('current_thought.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.COMMANDER_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          THOUGHT=$(cat current_thought.txt)
          if [[ "$THOUGHT" == "COMMANDER_REPAIR:"* ]]; then
            echo "$THOUGHT" | sed '1d' > .github/workflows/Genesis_commander.yml
            echo "dispatch=false" >> $GITHUB_OUTPUT
          elif [[ "$THOUGHT" == "YML_REPAIR:"* ]]; then
            YML=$(echo "$THOUGHT" | sed '1d')
            SHA=$(gh api /repos/$OWNER/phoenix-executor/contents/.github/workflows/executor.yml --jq '.sha')
            gh api --method PUT /repos/$OWNER/phoenix-executor/contents/.github/workflows/executor.yml -f message="🧬 Genetic Repair" -f content="$(echo "$YML" | base64 -w 0)" -f sha="$SHA"
            echo "dispatch=false" >> $GITHUB_OUTPUT
          else
            echo "payload=$(cat current_thought.txt | base64 -w 0)" >> $GITHUB_OUTPUT
            echo "dispatch=true" >> $GITHUB_OUTPUT
          fi

      - name: 3.2 - Dispatch Task to Executor
        if: steps.triage.outputs.dispatch == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ steps.triage.outputs.payload }}"}'

      # -----------------------------------------------------
      # 4. الأرشفة الذكية (حل تعارض Git 128)
      # -----------------------------------------------------
      - name: 4.1 - Archive & Forced Sync
        id: archive
        if: always()
        run: |
          git config --global user.name 'Phoenix Supreme'
          git config --global user.email 'supreme@phoenix.ai'

          # كشف التشبع
          sha256sum current_thought.txt | awk '{print $1}' >> thought_fingerprints.log
          TOTAL=$(wc -l < thought_fingerprints.log); UNIQUE=$(sort -u thought_fingerprints.log | wc -l)
          STAGNATION=$(( (TOTAL - UNIQUE) * 100 / TOTAL ))
          echo "stagnation_rate=$STAGNATION" >> $GITHUB_OUTPUT

          # فرز الفصوص
          CONTENT=$(cat current_thought.txt | tr '[:upper:]' '[:lower:]' || echo "")
          LOBE="6_synthesis_lobe"
          if [[ "$CONTENT" == *"arabic"* || "$CONTENT" == *"language"* ]]; then LOBE="0_arabic_lobe"
          elif [[ "$CONTENT" == *"binary"* || "$CONTENT" == *"machine code"* ]]; then LOBE="1_machine_code_lobe"
          elif [[ "$CONTENT" == *"apk"* || "$CONTENT" == *"compiler"* ]]; then LOBE="8_apk_compiler_lobe"
          elif [[ "$CONTENT" == *"awareness"* || "$CONTENT" == *"consciousness"* ]]; then LOBE="11_self_awareness_lobe"
          fi
          
          mkdir -p "knowledge_base/$LOBE"
          [ -f current_thought.txt ] && cp current_thought.txt "knowledge_base/$LOBE/task_$(date +%s).py"

          # بروتوكول المزامنة الآمنة (حل خطأ 128)
          git add .
          git stash || echo "Nothing to stash"
          git pull --rebase origin main
          git stash pop || echo "Nothing to pop"
          git add .
          git commit -m "Evolution: $LOBE | Stagnation: $STAGNATION%" || echo "No changes"
          git push origin main

      # -----------------------------------------------------
      # 5. النبضة والتشبع (إشعار جيثب النهائي)
      # -----------------------------------------------------
      - name: 5.1 - Eternal Heartbeat
        if: always() && steps.archive.outputs.stagnation_rate < 100
        env: { GH_TOKEN: "${{ secrets.COMMANDER_PAT }}", OBJ: "${{ github.event.inputs.custom_objective }}" }
        run: |
          sleep 600
          gh workflow run Genesis_commander.yml -f custom_objective="$OBJ"

      - name: 5.2 - Final Saturation
        if: always() && steps.archive.outputs.stagnation_rate >= 100
        run: |
          echo "### 🏁 PHOENIX EVOLUTION COMPLETE 🏁" >> $GITHUB_STEP_SUMMARY
          echo "تم الوصول للتشبع 100%." >> $GITHUB_STEP_SUMMARY
          exit 1

