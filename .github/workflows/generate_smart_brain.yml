name: 🧠 PHOENIX_BRAIN_FILLER

on:
  workflow_dispatch:

jobs:
  fill_brain:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🤖 Gemini Python Logic Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q -U google-generativeai
          python - <<EOF
          import google.generativeai as genai
          import os

          genai.configure(api_key=os.environ.get('GEMINI_API_KEY'))
          model = genai.GenerativeModel('gemini-pro')
          
          os.makedirs('AI_PYTHON', exist_ok=True)
          
          # تعريف التخصصات لكل ملف
          tasks = {
              1: "Advanced Physics Engine: Gravity, Collision, and Velocity logic in Python.",
              2: "Chemical Interaction System: Fire, Water, and Acid reactions in Python.",
              3: "Cellular Bio-Engine: DNA and Species growth algorithms in Python.",
              4: "Material Hex-Generator: Texture and Hardness properties logic.",
              5: "World Architect: Procedural landscape generation math in Python."
          }

          for i in range(1, 26):
              desc = tasks.get(i, f"Advanced Sub-system Logic Part {i}")
              prompt = f"Write a professional Python module for: {desc}. The code must be high-level and ready for compilation into machine code."
              
              try:
                  response = model.generate_content(prompt)
                  content = response.text
              except:
                  content = "# Phoenix Offline Logic Placeholder"

              with open(f'AI_PYTHON/part{i}.py', 'w', encoding='utf-8') as f:
                  f.write(content)
          EOF

      - name: 📤 Export Python Brain
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Python_Brain
          path: AI_PYTHON/