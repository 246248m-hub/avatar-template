name: 🪐 PHOENIX_ULTRA_EXPANDER

on:
  workflow_dispatch:

jobs:
  expand_brain:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🌌 Heavy Data Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q -U google-generativeai
          python - <<EOF
          import google.generativeai as genai
          import os
          import secrets # لتوليد بيانات ثنائية حقيقية وعشوائية

          genai.configure(api_key=os.environ.get('GEMINI_API_KEY'))
          model = genai.GenerativeModel('gemini-pro')
          
          os.makedirs('AI_ULTRA', exist_ok=True)

          for i in range(1, 26):
              print(f"Generating Massive Logic for Part {i}...")
              
              # 1. نطلب من جيمني كتابة "المنطق البرمجي" (الذكاء)
              try:
                  prompt = f"Write a complex Python game engine module for sector {i}. Include physics, AI, and rendering logic."
                  response = model.generate_content(prompt)
                  logic = response.text
              except:
                  logic = "# Critical Logic Offline"

              # 2. الحشو الفيزيائي (توليد بيانات ثنائية ضخمة لزيادة الحجم)
              # سنقوم بتوليد 10 ميجابايت من البيانات الثنائية لكل ملف كمرحلة أولى
              binary_data_size = 10 * 1024 * 1024  # 10MB
              raw_data = secrets.token_hex(binary_data_size // 2)

              # 3. دمج الذكاء (بايثون) مع البيانات (هيكس)
              with open(f'AI_ULTRA/part{i}.py', 'w', encoding='utf-8') as f:
                  f.write(logic)
                  f.write("\n\n# --- MASSIVE ATOMIC DATA POOL ---\n")
                  f.write(f"RAW_HEX_DATA = '{raw_data}'")
              
              print(f"✅ Part {i} finished. Size: ~10MB")
          EOF

      - name: 📤 Export Ultra Brain
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_Ultra_Brain
          path: AI_ULTRA/