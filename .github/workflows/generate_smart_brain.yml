name: 🧠 PHOENIX_GEMINI_INJECTOR

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 1. Checkout
        uses: actions/checkout@v4

      - name: 🐍 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛠️ 3. Brain Filling (Gemini AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # ضع مفتاحك هنا
        run: |
          pip install -q -U google-generativeai
          python - <<EOF
          import google.generativeai as genai
          import os

          # إعداد جيمني
          genai.configure(api_key=os.environ.get('GEMINI_API_KEY'))
          model = genai.GenerativeModel('gemini-pro')
          
          os.makedirs('AI', exist_ok=True)
          
          categories = [
              "الفيزياء والجاذبية وكود الهيكس للحركة", "الكيمياء والتفاعلات الجزيئية بالبتات",
              "البيولوجيا وتخليق الكائنات", "المواد والصلابة والجرافيك", 
              "علم النفس والدوافع البشرية", "السرد القصصي والحبكة الذرية"
          ]

          for i in range(1, 26):
              cat = categories[i-1] if i <= len(categories) else "بيانات تخليقية متقدمة"
              prompt = f"Write hexadecimal logic and atomic rules for: {cat} in Arabic. Format: Hex only."
              
              # في حال عدم وجود API Key، سيقوم النظام بحشو بيانات تجريبية
              try:
                  response = model.generate_content(prompt)
                  content = response.text.encode('utf-8')
              except:
                  content = f"PHX-DATA-PART-{i}-OFFLINE-MODE".encode()

              with open(f'AI/part{i}.dat', 'wb') as f:
                  f.write(content)
          print("✅ Completed filling 25 AI parts")
          EOF

      - name: 📤 4. Export AI Brain
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix_AI_Brain
          path: AI/