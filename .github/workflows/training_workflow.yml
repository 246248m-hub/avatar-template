name: Phoenix Mind Training

on:
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: تنزيل الكود
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # الخطوة 2: تشغيل المحاكي باستخدام "الخبير"
      - name: Run Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: "-no-snapshot -no-window -no-audio -no-accel"
          wait-for-emulator: true
          script: echo "Emulator is ready for game installation."

      # الخطوة 3: (جديدة) تنزيل وتثبيت لعبة فري فاير (XAPK)
      - name: Download and Install Free Fire
        run: |
          # تنزيل ملف XAPK من الرابط
          echo "Downloading Free Fire XAPK..."
          wget -O freefire.xapk "https://d.apkpure.com/b/XAPK/com.dts.freefireth?version=latest"

          # فك ضغط ملف XAPK
          echo "Unzipping XAPK..."
          # XAPK هو مجرد ملف zip، لذا نغير امتداده ونفك ضغطه
          mv freefire.xapk freefire.zip
          unzip freefire.zip -d freefire_files

          # تثبيت ملف APK الرئيسي
          echo "Installing base APK..."
          # نجد ملف APK داخل المجلد ونقوم بتثبيته
          adb install freefire_files/*.apk

          # نقل بيانات OBB
          echo "Pushing OBB data..."
          # اسم الحزمة هو com.dts.freefireth
          # يجب أن ننشئ المجلد أولاً ثم ننسخ المحتويات
          adb shell mkdir -p /sdcard/Android/obb/com.dts.freefireth
          adb push freefire_files/Android/obb/com.dts.freefireth/* /sdcard/Android/obb/com.dts.freefireth/
          
          echo "Game installation complete."

      # الخطوة 4: (جديدة) تشغيل اللعبة والتقاط صورة
      - name: Launch Game and Take Screenshot
        run: |
          # تشغيل اللعبة باستخدام اسم الحزمة الخاص بها
          echo "Launching Free Fire..."
          adb shell monkey -p com.dts.freefireth -c android.intent.category.LAUNCHER 1
          
          # الانتظار لمدة 30 ثانية للسماح للعبة بالتحميل
          echo "Waiting for game to load..."
          sleep 30
          
          # التقاط لقطة شاشة
          echo "Taking screenshot..."
          adb shell screencap -p /sdcard/screenshot.png
          
          # سحب لقطة الشاشة من المحاكي إلى الآلة الافتراضية
          adb pull /sdcard/screenshot.png .

      # الخطوة 5: (جديدة) حفظ لقطة الشاشة كـ "دليل"
      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-game-screenshot
          path: screenshot.png
