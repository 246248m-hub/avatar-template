name: Phoenix Mind Training

on:
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    # هنا نحدد مسار العمل الافتراضي لكل الخطوات في هذه المهمة
    # هذا هو الحل الأنظف
    defaults:
      run:
        working-directory: ./avatar-template

    steps:
      # الخطوة 1: تنزيل الكود في مجلد 'avatar-template'
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          path: 'avatar-template'

      # الخطوة 2: إعداد بايثون
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # الخطوة 3: تشغيل السكريبت
      # لم نعد بحاجة لتحديد working-directory هنا لأنه تم تحديده في defaults
      - name: Run Data Collector Script
        run: |
          echo "Current working directory is: $(pwd)"
          echo "Starting the data collection step..."
          python3 training_scripts/data_collector.py --num_images 50 --output_dir collected_images
          echo "Data collection script has finished."

      # الخطوة 4: التحقق من المخرجات
      - name: Verify Script Output
        run: |
          echo "Verifying output..."
          ls -R
