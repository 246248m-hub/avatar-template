name: Phoenix Mind Training (Analysis Protocol @ 6 FPS)

on:
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Run Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: "-no-snapshot -no-window -no-audio -no-accel"
          script: echo "Emulator is ready."

      - name: Set up Node.js for Puppeteer
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Frame Capture Script
        working-directory: ./viewer_scripts
        run: |
          echo "Installing Puppeteer and Archiver..."
          npm install puppeteer archiver
          echo "Running viewer script..."
          node viewer.js

      - name: Upload Captured Frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captured-frames-6fps
          path: viewer_scripts/captured_frames.zip
          continue-on-error: true
