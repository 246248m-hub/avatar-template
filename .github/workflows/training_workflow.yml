name: Phoenix Mind Training

on:
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Run Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: "-no-snapshot -no-window -no-audio -no-accel"
          script: echo "Emulator is ready."

      - name: Set up Node.js for Downloader
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # تعديل: تثبيت الإضافات الشبحية
      - name: Download Game via Puppeteer (Stealth Mode)
        working-directory: ./downloader_scripts
        run: |
          echo "Installing Puppeteer and Stealth Plugin..."
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
          echo "Running downloader script..."
          node downloader.js

      # إضافة خطوة جديدة لحفظ لقطات الشاشة التشخيصية
      - name: Upload Debug Screenshot
        # هذه الخطوة ستعمل دائمًا، حتى لو فشلت الخطوة السابقة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug_screenshot.png
            debug_screenshot_failure.png
          # تجاهل الخطأ إذا لم يتم العثور على الملفات
          continue-on-error: true

      - name: Install Free Fire
        run: |
          echo "Unzipping XAPK..."
          unzip freefire.xapk -d freefire_files
          # ... (بقية الكود كما هو)
          echo "Installing base APK..."
          adb install freefire_files/*.apk
          echo "Pushing OBB data..."
          adb shell mkdir -p /sdcard/Android/obb/com.dts.freefireth
          adb push freefire_files/Android/obb/com.dts.freefireth/* /sdcard/Android/obb/com.dts.freefireth/
          echo "Game installation complete."

      - name: Launch Game and Take Screenshot
        run: |
          echo "Launching Free Fire..."
          adb shell monkey -p com.dts.freefireth -c android.intent.category.LAUNCHER 1
          echo "Waiting 30 seconds for game to load..."
          sleep 30
          echo "Taking screenshot..."
          adb shell screencap -p /sdcard/screenshot.png
          adb pull /sdcard/screenshot.png .

      - name: Upload Final Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: final-game-screenshot
          path: screenshot.png
