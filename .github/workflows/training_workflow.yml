name: Phoenix Mind Training

on:
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: فقط قم بتنزيل الكود. لا تحدد أي مسار أو اسم.
      # سيتم تنزيله في المسار الافتراضي.
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # الخطوة 2: إعداد بايثون
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # الخطوة 3: تشغيل السكريبت
      # بما أننا لم نغير أي مسارات، فالسكريبت موجود مباشرة في المسار المتوقع
      - name: Run Data Collector Script
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing contents: $(ls -l)"
          echo "Starting the data collection step..."
          python3 training_scripts/data_collector.py --num_images 50 --output_dir collected_images
          echo "Data collection script has finished."

      # الخطوة 4: التحقق من المخرجات
      - name: Verify Script Output
        run: |
          echo "Verifying output..."
          ls -R
