name: Phoenix Mind Training

on:
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: تنزيل الكود
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # الخطوة 2: تشغيل المحاكي باستخدام "الخبير"
      - name: Run Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: "-no-snapshot -no-window -no-audio -no-accel"
          script: echo "Emulator is ready for game installation."

      # الخطوة 3: تنزيل وتثبيت لعبة فري فاير (مع التخفي)
      - name: Download and Install Free Fire
        run: |
          # <<<--- هذا هو السطر المهم الذي تم تعديله
          # تنزيل ملف XAPK مع التظاهر بأننا متصفح Chrome
          echo "Downloading Free Fire XAPK (Stealth Mode)..."
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" -O freefire.xapk "https://d.apkpure.com/b/XAPK/com.dts.freefireth?version=latest"

          # فك ضغط ملف XAPK
          echo "Unzipping XAPK..."
          unzip freefire.xapk -d freefire_files

          # تثبيت ملف APK الرئيسي
          echo "Installing base APK..."
          adb install freefire_files/*.apk

          # نقل بيانات OBB
          echo "Pushing OBB data..."
          adb shell mkdir -p /sdcard/Android/obb/com.dts.freefireth
          adb push freefire_files/Android/obb/com.dts.freefireth/* /sdcard/Android/obb/com.dts.freefireth/
          
          echo "Game installation complete."

      # الخطوة 4: تشغيل اللعبة والتقاط صورة
      - name: Launch Game and Take Screenshot
        run: |
          echo "Launching Free Fire..."
          adb shell monkey -p com.dts.freefireth -c android.intent.category.LAUNCHER 1
          
          echo "Waiting for game to load..."
          sleep 30
          
          echo "Taking screenshot..."
          adb shell screencap -p /sdcard/screenshot.png
          
          adb pull /sdcard/screenshot.png .

      # الخطوة 5: حفظ لقطة الشاشة كـ "دليل"
      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-game-screenshot
          path: screenshot.png
