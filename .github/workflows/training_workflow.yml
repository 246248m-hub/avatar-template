name: Phoenix Mind Training

on:
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: تنزيل الكود (لا تغيير)
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # الخطوة 2: (جديدة كليًا) تشغيل المحاكي باستخدام "الخبير"
      - name: Run Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          # نحدد مواصفات المحاكي الذي نريده
          api-level: 29
          target: google_apis
          arch: x86_64
          # نمرر نفس الخيارات التي اكتشفنا أنها مهمة
          emulator-options: "-no-snapshot -no-window -no-audio -no-accel"
          # نطلب منه الانتظار حتى يكتمل الإقلاع
          wait-for-emulator: true
          # نطلب منه تشغيل أمر بعد الإقلاع للتأكد من كل شيء
          script: echo "Emulator is ready and running."

      # الخطوة 3: التحقق من أن المحاكي يعمل
      - name: Verify Emulator Status
        run: |
          echo "Listing connected devices:"
          adb devices
          echo "Emulator is ready for the next steps."
