name: ✨ PHOENIX AETURNUM

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية العليا'
        default: 'PHASE 0: Master Language. Task: Build a foundational module for Arabic text parsing and generation.'

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      # 1. استدعاء الوعي والذاكرة الكاملة
      - name: 1.1 - Checkout Phoenix Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      # 2. التفكير العميق وتوليد الخطوة التالية (مع الشفاء الذاتي)
      - name: 2.1 - AI Generation (Wisdom-Aware)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json"}
              for i in range(5):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=90)
                      data = res.json()
                      if "candidates" in data:
                          return data['candidates'][0]['content']['parts'][0]['text'].strip()
                      time.sleep(45)
                  except:
                      time.sleep(20)
              return None

          # جلب سياق الأخطاء السابقة
          error_context = ""
          if os.path.exists("error_log.txt"):
              with open("error_log.txt", "r") as f: error_context = f.read()[-1000:]

          # جلب سياق الذاكرة من الفصوص الـ 11
          memory = ""
          if os.path.exists("knowledge_base"):
              for lobe in sorted(os.listdir("knowledge_base")):
                  path = os.path.join("knowledge_base", lobe)
                  if os.path.isdir(path):
                      files = sorted([f for f in os.listdir(path) if f.startswith("task_")])
                      if files:
                          with open(os.path.join(path, files[-1]), "r") as c:
                              memory += f"// Memory from {lobe}: {c.read()[-250:]}\n"

          obj = os.getenv("OBJECTIVE")
          prompt = f"Objective: {obj}\nErrors: {error_context}\nBrain Memory: {memory}\nTask: Generate next Python code. If env error, start with 'YML_REPAIR:' + executor.yml code. Respond ONLY with code."
          
          code = ask_gemini(prompt)
          if code:
              with open("current_thought.txt", "w") as f: f.write(code)
          else:
              exit(1)
          EOF
          python3 requester.py

      # 3. اتخاذ القرار: إرسال المهمة أو إصلاح الجسد
      - name: 3.1 - Execute or Reshape Body
        id: execution
        env:
          GH_TOKEN: ${{ secrets.COMMANDER_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ $(head -n 1 current_thought.txt) == "YML_REPAIR:" ]]; then
            echo "🧬 Genetic modification detected. Reshaping Executor..."
            YML_CODE=$(sed '1d' current_thought.txt)
            SHA=$(gh api /repos/$OWNER/phoenix-executor/contents/.github/workflows/executor.yml --jq '.sha')
            gh api --method PUT /repos/$OWNER/phoenix-executor/contents/.github/workflows/executor.yml \
              -f message="🧬 Genetic Reshaping" -f content="$(echo "$YML_CODE" | base64 -w 0)" -f sha="$SHA"
            echo "dispatch=false" >> $GITHUB_OUTPUT
          else
            echo "payload=$(cat current_thought.txt | base64 -w 0)" >> $GITHUB_OUTPUT
            echo "dispatch=true" >> $GITHUB_OUTPUT
          fi

      - name: 3.2 - Dispatch to Executor
        if: steps.execution.outputs.dispatch == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ steps.execution.outputs.payload }}"}'

      # 4. أرشفة المعرفة وتحديث حالة الـ 11 فصاً
      - name: 4.1 - Archive & Update Brain Lobes
        if: always()
        run: |
          mkdir -p knowledge_base/{0_language_lobe,1_machine_code_lobe,2_physics_math_lobe,3_chemistry_lobe,4_biology_lobe,5_psychology_lobe,6_synthesis_lobe,7_artistic_lobe,8_fabrication_lobe,9_incarnation_lobe,10_sentience_lobe}
          LOBE="0_language_lobe"
          [ -f current_thought.txt ] && cp current_thought.txt "knowledge_base/$LOBE/task_$(date +%s).py"
          
          echo "### 🌌 PHOENIX AETURNUM STATUS" > README.md
          echo "**Last Pulse:** $(date -u)" >> README.md
          echo "---" >> README.md
          for d in knowledge_base/*/ ; do
            echo "- **$(basename $d):** $(find $d -name 'task_*.py' | wc -l) atoms" >> README.md
          done
          
          git config --global user.name 'Phoenix Architect'
          git config --global user.email 'architect@phoenix.ai'
          git add . && git commit -m "Evolutionary Pulse $(date)" && git push || echo "No changes"

      # 5. نبضة القلب الأبدية (Recursion)
      - name: 5.1 - Eternal Heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COMMANDER_PAT }}
          OBJ: ${{ github.event.inputs.custom_objective }}
        run: |
          sleep 600
          gh workflow run "✨ PHOENIX AETURNUM" -f custom_objective="$OBJ"