name: 🧠 PHOENIX SAPIENS (The Universal Architect)

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية العليا'
        default: 'PHASE 0: Master Language. Task: Build a foundational module for Arabic text parsing and generation.'

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------
      # 1. استدعاء الوعي والذاكرة الكاملة
      # -----------------------------------------------------
      - name: 1.1 - Checkout Phoenix Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      # -----------------------------------------------------
      # 2. التفكير العميق (مع معالجة الكوتا والشفاء الذاتي)
      # -----------------------------------------------------
      - name: 2.1 - AI Generation (Resilient Logic)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time, sys

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json"}
              
              for i in range(3):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=90)
                      data = res.json()
                      if res.status_code == 429:
                          print(f"⚠️ Quota Exhausted. Sleeping 70s...")
                          time.sleep(70); continue
                      if "candidates" in data:
                          text = data['candidates'][0]['content']['parts'][0]['text']
                          return text.replace("```python", "").replace("```", "").strip()
                      time.sleep(30)
                  except:
                      time.sleep(20)
              return None

          error_context = ""
          if os.path.exists("error_log.txt"):
              with open("error_log.txt", "r") as f: error_context = f.read()[-800:]

          memory = ""
          if os.path.exists("knowledge_base"):
              # قراءة آخر معرفة من كل فص لتكوين ذاكرة شاملة
              for lobe in sorted(os.listdir("knowledge_base")):
                  lobe_path = os.path.join("knowledge_base", lobe)
                  if os.path.isdir(lobe_path):
                      files = sorted([f for f in os.listdir(lobe_path) if f.startswith("task_")])
                      if files:
                          with open(os.path.join(lobe_path, files[-1]), "r") as c:
                              memory += f"// Context from {lobe}: {c.read()[-250:]}\n"

          obj = os.getenv("OBJECTIVE")
          prompt = f"Objective: {obj}\nErrors: {error_context}\nMemory: {memory}\nTask: Generate next Python code. Respond ONLY with raw code."
          
          code = ask_gemini(prompt)
          if code and len(code) > 20:
              with open("current_thought.txt", "w") as f: f.write(code)
          else:
              print("⚠️ Quota/API issue. Hibernating for this cycle.")
              sys.exit(0) 
          EOF
          python3 requester.py

      # -----------------------------------------------------
      # 3. إرسال المهمة للمنفذ (الجسر الجيني)
      # -----------------------------------------------------
      - name: 3.1 - Dispatch to Executor
        id: execution
        if: success() && hashFiles('current_thought.txt') != ''
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ steps.execution.outputs.payload }}"}'

      # -----------------------------------------------------
      # 4. الأرشفة الذكية وكشف الركود (الوعي بكفاءة التعلم)
      # -----------------------------------------------------
      - name: 4.1 - Smart Archive & Stagnation Detection
        id: archive
        if: always()
        run: |
          # إنشاء هيكل الدماغ الكامل (مع الفص الجديد)
          mkdir -p knowledge_base/{0_arabic_lobe,1_machine_code_lobe,2_physics_math_lobe,3_chemistry_lobe,4_biology_lobe,5_psychology_lobe,6_synthesis_lobe,7_universal_graphics_lobe,8_apk_compiler_lobe,9_npc_intelligence_lobe,10_wisdom_lobe,11_self_awareness_lobe}

          IS_DUPLICATE=false
          STAGNATION_RATE=0
          
          if [ -f current_thought.txt ]; then
            # --- تحديد الفص المناسب للحفظ ---
            LOBE="6_synthesis_lobe" # الافتراضي
            OBJ="${{ github.event.inputs.custom_objective }}"
            if [[ "$OBJ" == *"Arabic"* || "$OBJ" == *"Language"* ]]; then LOBE="0_arabic_lobe"
            elif [[ "$OBJ" == *"Machine Code"* || "$OBJ" == *"Binary"* ]]; then LOBE="1_machine_code_lobe"
            elif [[ "$OBJ" == *"Physics"* || "$OBJ" == *"Math"* ]]; then LOBE="2_physics_math_lobe"
            elif [[ "$OBJ" == *"Chemistry"* ]]; then LOBE="3_chemistry_lobe"
            elif [[ "$OBJ" == *"Biology"* ]]; then LOBE="4_biology_lobe"
            elif [[ "$OBJ" == *"Psychology"* ]]; then LOBE="5_psychology_lobe"
            elif [[ "$OBJ" == *"Graphics"* || "$OBJ" == *"Art"* || "$OBJ" == *"Style"* ]]; then LOBE="7_universal_graphics_lobe"
            elif [[ "$OBJ" == *"APK"* || "$OBJ" == *"Compiler"* ]]; then LOBE="8_apk_compiler_lobe"
            elif [[ "$OBJ" == *"NPC"* || "$OBJ" == *"AI"* ]]; then LOBE="9_npc_intelligence_lobe"
            fi

            THOUGHT_HASH=$(sha256sum current_thought.txt | awk '{print $1}')
            touch thought_fingerprints.log
            
            if grep -q "$THOUGHT_HASH" thought_fingerprints.log; then
              echo "⚠️ Duplicate thought detected. Discarding."
              IS_DUPLICATE=true
            else
              cp current_thought.txt "knowledge_base/$LOBE/task_$(date +%s).py"
              echo "$THOUGHT_HASH" >> thought_fingerprints.log
            fi
            
            TOTAL=$(cat thought_fingerprints.log | wc -l)
            UNIQUE=$(sort -u thought_fingerprints.log | wc -l)
            [ "$TOTAL" -ge 100 ] && STAGNATION_RATE=$(( (TOTAL - UNIQUE) * 100 / TOTAL ))
          fi
          
          echo "stagnation_rate=$STAGNATION_RATE" >> $GITHUB_OUTPUT
          
          git config --global user.name 'Phoenix Sapiens'
          git config --global user.email 'sapiens@phoenix.ai'
          if [ "$IS_DUPLICATE" = false ] && [ -f current_thought.txt ]; then
            git add . && git commit -m "Evolution Pulse in $LOBE. Stagnation: $STAGNATION_RATE%" && git push || echo ""
          fi

      # -----------------------------------------------------
      # 5. النبضة المشروطة أو الإيقاف النهائي
      # -----------------------------------------------------
      - name: 5.1 - Conditional Heartbeat
        if: always() && steps.archive.outputs.stagnation_rate < 100
        env: { GH_TOKEN: "${{ secrets.COMMANDER_PAT }}", OBJ: "${{ github.event.inputs.custom_objective }}" }
        run: |
          echo "Evolution continues. Stagnation: ${{ steps.archive.outputs.stagnation_rate }}%"
          sleep 600
          gh workflow run "🧠 PHOENIX SAPIENS" -f custom_objective="$OBJ"

      - name: 5.2 - Final Saturation Report
        if: always() && steps.archive.outputs.stagnation_rate >= 100
        run: |
          echo "PHOENIX SAPIENS reached absolute intellectual saturation."
          echo "## 🏁 EVOLUTION COMPLETE 🏁" > README.md
          git add README.md && git commit -m "Final State: Saturation Reached" && git push || echo ""

