name: 🛰️ Phoenix AICore Heartbeat

on:
  workflow_dispatch:
  repository_dispatch:
    types: [heartbeat]
  schedule:
    - cron: '0 * * * *' # نبضة كل ساعة لضمان الاستمرارية

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧠 AICore Processing Cycle
        shell: python
        run: |
          import os, requests, json, time
          # استيراد الكود الذي بنيناه سابقاً لإدارة الذاكرة والموديولات
          # نحن هنا نحاكي تشغيل الـ AICore الذي أرسلته لي

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              # نستخدم الرابط المستقر لضمان عدم حدوث خطأ 404 مجدداً
              url = f"https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json"}
              
              try:
                  res = requests.post(url, json=payload, headers=headers, timeout=90)
                  data = res.json()
                  if "candidates" in data:
                      return data['candidates'][0]['content']['parts'][0]['text'].replace("```python", "").replace("```", "").strip()
              except:
                  return None
              return None

          # --- استعادة حالة الذاكرة ---
          memory = {}
          if os.path.exists("memory.json"):
              with open("memory.json", "r") as f:
                  memory = json.load(f)

          # --- بناء السياق للقائد ---
          # نخبر Gemini بما يوجد في الذاكرة والموديولات الحالية ليكمل عليها
          modules = os.listdir("logic_modules") if os.path.exists("logic_modules") else []
          
          prompt = f"""
          Current AI Memory: {json.dumps(memory)}
          Loaded Logic Modules: {modules}
          Mission: Continue building the Arabic Parser and Generator system.
          Action: Create a new logic module in 'logic_modules/' that adds a new capability.
          Format: Return ONLY the Python code for the 'process(context)' function.
          """

          new_logic = ask_gemini(prompt)

          if new_logic:
              os.makedirs("logic_modules", exist_ok=True)
              module_name = f"logic_modules/module_{int(time.time())}.py"
              with open(module_name, "w") as f:
                  f.write(new_logic)
              print(f"✅ Evolution Success: {module_name}")
          else:
              print("❌ API Failure, skipping this pulse.")

      - name: 🔄 Trigger Next Heartbeat
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "heartbeat"}'

      - name: 📤 Commit Persistence
        run: |
          git config --global user.name "Phoenix AI Core"
          git config --global user.email "phoenix@ai.com"
          git add .
          git commit -m "Pulse: Advancing Logic Modules and Memory" || exit 0
          git push
