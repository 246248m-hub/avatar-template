name: 🧬 GENESIS COMMANDER

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية'
        default: 'PHASE 0: Build the Arabic Language Lobe. Your first task is to build a Python module to parse a large Arabic vocabulary file and store it in knowledge_base/0_arabic_lobe/.'

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 - Checkout Phoenix Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      - name: 2.1 - AI Generation
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json"}
              for i in range(5):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=60)
                      data = res.json()
                      if "candidates" in data:
                          return data['candidates'][0]['content']['parts'][0]['text'].replace("```python", "").replace("```", "").strip()
                      time.sleep(40)
                  except:
                      time.sleep(20)
              return None

          error_context = ""
          if os.path.exists("error_log.txt"):
              with open("error_log.txt", "r") as f:
                  error_context = f"\n⚠️ LAST FAILURE: {f.read()[-500:]}"

          obj = os.getenv("OBJECTIVE")
          prompt = f"Objective: {obj}. {error_context}\nWrite next Python script. Code only."
          
          code = ask_gemini(prompt)
          if code:
              with open("current_task.py", "w") as f: f.write(code)
          else:
              exit(1)
          EOF
          python3 requester.py
          echo "task_payload=$(cat current_task.py | base64 -w 0)" >> $GITHUB_ENV

      - name: 3.1 - Dispatch
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ env.task_payload }}"}'

      - name: 4.1 - Archive
        if: always()
        run: |
          mkdir -p knowledge_base/0_arabic_lobe
          [ -f current_task.py ] && cp current_task.py "knowledge_base/0_arabic_lobe/task_$(date +%s).py"
          git config --global user.name 'Phoenix Architect'
          git config --global user.email 'architect@phoenix.ai'
          git add . && git commit -m "Evolution $(date)" && git push || echo "No changes"

      - name: 5.1 - Recursive Heartbeat (CORRECTED NAME)
        if: always()
        env:
          GH_TOKEN: "${{ secrets.COMMANDER_PAT }}"
          OBJ: "${{ github.event.inputs.custom_objective }}"
        run: |
          echo "Cooling down..."
          sleep 600
          # هنا تم تصحيح الاسم ليطابق اسم الملف تماماً
          gh workflow run "🧬 GENESIS COMMANDER" -f custom_objective="$OBJ"