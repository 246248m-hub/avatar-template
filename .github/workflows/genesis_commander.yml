name: 🧠 PHOENIX SAPIENS

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية العليا'
        default: 'PHASE 0: Master Language. Task: Build a foundational module for Arabic text parsing and generation.'
  repository_dispatch:
    types: [heartbeat]

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      # 1. سحب الكود الحالي والذاكرة
      - name: 1.1 - Checkout Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      # 2. توليد الكود (مع ذكاء 2.0/2.5 المحسن)
      - name: 2.1 - AI Logic Generation
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time, sys

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              # نستخدم الرابط المستقر لضمان استمرارية العمل في غيابك
              url = f"https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json"}
              
              for i in range(3):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=90)
                      data = res.json()
                      if res.status_code == 429:
                          time.sleep(75); continue
                      if "candidates" in data:
                          text = data['candidates'][0]['content']['parts'][0]['text']
                          return text.replace("```python", "").replace("```", "").strip()
                  except:
                      time.sleep(20)
              return None

          # جمع سياق الخطأ والذاكرة
          error_ctx = ""
          if os.path.exists("error_log.txt"):
              with open("error_log.txt", "r") as f: error_ctx = f.read()[-500:]

          last_mem = ""
          if os.path.exists("knowledge_base"):
              files = sorted([f for f in os.listdir("knowledge_base")])
              if files:
                  with open(os.path.join("knowledge_base", files[-1]), "r") as f:
                      last_mem = f"// Context: {f.read()[-300:]}"

          obj = os.getenv("OBJECTIVE")
          prompt = f"Objective: {obj}\nErrors: {error_ctx}\nMemory: {last_mem}\nTask: Generate Python code. Respond ONLY with code."
          
          code = ask_gemini(prompt)
          if code and len(code) > 20:
              with open("current_thought.txt", "w") as f: f.write(code)
          else:
              sys.exit(0)
          EOF
          python3 requester.py

      # 3. إرسال الكود للمنفذ (Executor)
      - name: 3.1 - Dispatching Task
        id: execution
        if: success() && hashFiles('current_thought.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.COMMANDER_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ $(head -n 1 current_thought.txt) == "YML_REPAIR:" ]]; then
            YML_CODE=$(sed '1d' current_thought.txt)
            SHA=$(gh api /repos/$OWNER/phoenix-executor/contents/.github/workflows/executor.yml --jq '.sha')
            gh api --method PUT /repos/$OWNER/phoenix-executor/contents/.github/workflows/executor.yml \
              -f message="🧬 Repairing Executor" -f content="$(echo "$YML_CODE" | base64 -w 0)" -f sha="$SHA"
            echo "dispatch=false" >> $GITHUB_OUTPUT
          else
            echo "payload=$(cat current_thought.txt | base64 -w 0)" >> $GITHUB_OUTPUT
            echo "dispatch=true" >> $GITHUB_OUTPUT
          fi

      - name: 3.2 - Execute Dispatch
        if: steps.execution.outputs.dispatch == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ steps.execution.outputs.payload }}"}'

      # 4. الأرشفة وكشف الركود (Stagnation)
      - name: 4.1 - Archive & Analyze
        id: archive
        if: always()
        run: |
          mkdir -p knowledge_base
          STAGNATION=0
          if [ -f current_thought.txt ]; then
            HASH=$(sha256sum current_thought.txt | awk '{print $1}')
            touch thought_fingerprints.log
            if grep -q "$HASH" thought_fingerprints.log; then
              echo "⚠️ Duplicate Thought."
            else
              cp current_thought.txt "knowledge_base/task_$(date +%s).py"
              echo "$HASH" >> thought_fingerprints.log
            fi
            TOTAL=$(wc -l < thought_fingerprints.log)
            UNIQUE=$(sort -u thought_fingerprints.log | wc -l)
            [ "$TOTAL" -ge 5 ] && STAGNATION=$(( (TOTAL - UNIQUE) * 100 / TOTAL ))
          fi
          echo "rate=$STAGNATION" >> $GITHUB_OUTPUT
          
          git config --global user.name 'Phoenix Architect'
          git config --global user.email 'architect@phoenix.ai'
          git add . && git commit -m "Evolution Pulse: Stagnation $STAGNATION%" && git push || echo "No changes"

      # 5. النبضة المستمرة (إصلاح الاستدعاء)
      - name: 5.1 - Eternal Heartbeat
        if: always() && steps.archive.outputs.rate < 100
        env:
          GH_TOKEN: ${{ secrets.COMMANDER_PAT }}
          OBJ: ${{ github.event.inputs.custom_objective }}
        run: |
          echo "Triggering next pulse... Stagnation: ${{ steps.archive.outputs.rate }}%"
          sleep 600
          # تم تغيير الاسم هنا ليتطابق مع اسم الملف الفعلي
          gh workflow run genesis_commander.yml -f custom_objective="$OBJ"

