name: 🛰️ Phoenix Eternal Heartbeat (Gemini 2.5)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [heartbeat]
  schedule:
    - cron: '*/15 * * * *' # نبضة احتياطية كل 15 دقيقة

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧠 AI Evolution Cycle
        shell: python
        run: |
          import os, requests, json, time, base64

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              # تم تحديث الرابط لـ v1beta مع موديل 2.5
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
              
              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"temperature": 0.8, "maxOutputTokens": 2048}
              }
              headers = {"Content-Type": "application/json"}
              
              for _ in range(3):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=120)
                      if res.status_code == 429:
                          time.sleep(70); continue
                      data = res.json()
                      if "candidates" in data:
                          return data['candidates'][0]['content']['parts'][0]['text'].replace("```python", "").replace("```", "").strip()
                  except:
                      time.sleep(20)
              return None

          # 1. جمع السياق (الذاكرة) لعدم التكرار
          kb_files = os.listdir("knowledge_base") if os.path.exists("knowledge_base") else []
          memory = ""
          if os.path.exists("memory.json"):
              with open("memory.json", "r") as f: memory = f.read()

          # 2. بناء الأمر (Prompt)
          prompt = f"""
          Current Files in Knowledge Base: {kb_files}
          AI Memory: {memory}
          Task: Continue developing the Arabic NLP ecosystem. 
          If there is an 'error_log.txt', fix it first. 
          If not, create a new advanced module in 'logic_modules/' or 'knowledge_base/'.
          Return ONLY pure Python code. No explanations.
          """

          # 3. الحصول على الكود الجديد
          new_code = ask_gemini(prompt)
          if new_code:
              filename = f"knowledge_base/task_{int(time.time())}.py"
              os.makedirs("knowledge_base", exist_ok=True)
              with open(filename, "w") as f: f.write(new_code)
              print(f"✅ New evolution saved: {filename}")
          else:
              print("❌ AI failed to evolve this cycle.")

      - name: 🔄 Trigger Next Heartbeat
        run: |
          # استدعاء النبضة القادمة برمجياً لضمان الاستمرار
          curl -X POST -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/$OWNER/$REPO/dispatches \
          -d '{"event_type": "heartbeat"}'

      - name: 📤 Commit Changes
        run: |
          git config --global user.name "Phoenix AI"
          git config --global user.email "phoenix@ai.com"
          git add .
          git commit -m "Cycle: ${{ github.run_number }} | Mode: Gemini 2.5" || exit 0
          git push

