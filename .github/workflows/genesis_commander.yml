name: ✔️ PHOENIX SAPIENS (The Efficient Architect)

on:
  workflow_dispatch:
    inputs:
      custom_objective:
        description: 'المهمة الاستراتيجية العليا'
        default: 'PHASE 0: Master Language. Task: Build a foundational module for Arabic text parsing and generation.'

permissions:
  contents: write
  actions: write

jobs:
  genesis_learning_cycle:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------
      # 1. استدعاء الوعي والذاكرة الكاملة
      # -----------------------------------------------------
      - name: 1.1 - Checkout Phoenix Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMANDER_PAT }}

      # -----------------------------------------------------
      # 2. التفكير العميق (مع معالجة الكوتا والشفاء الذاتي)
      # -----------------------------------------------------
      - name: 2.1 - AI Generation (Resilient Logic)
        id: gemini_task
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OBJECTIVE: ${{ github.event.inputs.custom_objective }}
        run: |
          cat << 'EOF' > requester.py
          import requests, json, os, time, sys

          def ask_gemini(prompt):
              api_key = os.getenv("GOOGLE_API_KEY")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              headers = {"Content-Type": "application/json"}
              
              for i in range(3):
                  try:
                      res = requests.post(url, json=payload, headers=headers, timeout=90)
                      data = res.json()
                      if res.status_code == 429:
                          print(f"⚠️ Quota Exhausted. Sleeping 70s...")
                          time.sleep(70); continue
                      if "candidates" in data:
                          text = data['candidates'][0]['content']['parts'][0]['text']
                          return text.replace("```python", "").replace("```", "").strip()
                      time.sleep(30)
                  except:
                      time.sleep(20)
              return None

          error_context = ""
          if os.path.exists("error_log.txt"):
              with open("error_log.txt", "r") as f: error_context = f.read()[-800:]

          memory = ""
          if os.path.exists("knowledge_base"):
              files = sorted([f for f in os.listdir("knowledge_base") if f.startswith("task_")])
              if files:
                  with open(os.path.join("knowledge_base", files[-1]), "r") as c:
                      memory = f"// Last Task Context: {c.read()[-300:]}\n"

          obj = os.getenv("OBJECTIVE")
          prompt = f"Objective: {obj}\nErrors: {error_context}\nLast Memory: {memory}\nTask: Generate next Python code. Respond ONLY with raw code."
          
          code = ask_gemini(prompt)
          if code and len(code) > 20:
              with open("current_thought.txt", "w") as f: f.write(code)
          else:
              print("⚠️ Quota/API issue. Hibernating.")
              sys.exit(0) 
          EOF
          python3 requester.py

      # -----------------------------------------------------
      # 3. إرسال المهمة للمنفذ (الجسر الجيني)
      # -----------------------------------------------------
      - name: 3.1 - Dispatch to Executor
        id: execution
        if: success() && hashFiles('current_thought.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.COMMANDER_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ $(head -n 1 current_thought.txt) == "YML_REPAIR:" ]]; then
            YML_CODE=$(sed '1d' current_thought.txt)
            SHA=$(gh api /repos/$OWNER/phoenix-executor/contents/.github/workflows/executor.yml --jq '.sha')
            gh api --method PUT /repos/$OWNER/phoenix-executor/contents/.github/workflows/executor.yml \
              -f message="🧬 Genetic Reshaping" -f content="$(echo "$YML_CODE" | base64 -w 0)" -f sha="$SHA"
            echo "dispatch=false" >> $GITHUB_OUTPUT
          else
            echo "payload=$(cat current_thought.txt | base64 -w 0)" >> $GITHUB_OUTPUT
            echo "dispatch=true" >> $GITHUB_OUTPUT
          fi

      - name: 3.2 - Dispatch Task
        if: steps.execution.outputs.dispatch == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: executor.yml
          repo: ${{ github.repository_owner }}/phoenix-executor
          token: ${{ secrets.COMMANDER_PAT }}
          inputs: '{"task_payload": "${{ steps.execution.outputs.payload }}"}'

      # -----------------------------------------------------
      # 4. الأرشفة الذكية وتحديث لوحة التحكم (العد الفعلي للذرات)
      # -----------------------------------------------------
      - name: 4.1 - Smart Archive & Metrics Update
        id: archive
        if: always()
        run: |
          mkdir -p knowledge_base
          IS_DUPLICATE=false
          STAGNATION_RATE=0
          
          # أرشفة الفكرة الجديدة
          if [ -f current_thought.txt ]; then
            THOUGHT_HASH=$(sha256sum current_thought.txt | awk '{print $1}')
            touch thought_fingerprints.log
            if grep -q "$THOUGHT_HASH" thought_fingerprints.log; then
              IS_DUPLICATE=true
            else
              cp current_thought.txt "knowledge_base/task_$(date +%s).py"
              echo "$THOUGHT_HASH" >> thought_fingerprints.log
            fi
            TOTAL=$(cat thought_fingerprints.log | wc -l)
            UNIQUE=$(sort -u thought_fingerprints.log | wc -l)
            [ "$TOTAL" -ge 10 ] && STAGNATION_RATE=$(( (TOTAL - UNIQUE) * 100 / TOTAL ))
          fi
          echo "stagnation_rate=$STAGNATION_RATE" >> $GITHUB_OUTPUT

          # بروتوكول التوثيق: عدّ الذرات الحقيقية
          TOTAL_ATOMS=$(ls knowledge_base/*.py 2>/dev/null | wc -l || echo "0")
          ARABIC_ATOMS=$(grep -l "arabic" knowledge_base/*.py 2>/dev/null | wc -l || echo "0")

          # تحديث ملف لوحة التحكم
          cat << EOF > PHOENIX_STATUS.md
          # 🛰️ PHOENIX AETURNUM DASHBOARD
          **Status:** 🟢 Active Learning
          **Last Sync:** $(date -u)
          
          ## 📊 Neural Lobe Metrics
          - **0_language_lobe:** $TOTAL_ATOMS atoms
          - **0_arabic_lobe:** $ARABIC_ATOMS atoms
          - **Stagnation Rate:** $STAGNATION_RATE%
          
          *This file is updated every pulse by the Sapiens Architect.*
          EOF
          
          git config --global user.name 'Phoenix Sapiens'
          git config --global user.email 'sapiens@phoenix.ai'
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "📊 Metric Sync: $TOTAL_ATOMS Atoms | Stagnation $STAGNATION_RATE%" && git push
          fi

      # -----------------------------------------------------
      # 5. النبضة المشروطة أو الإيقاف النهائي
      # -----------------------------------------------------
      - name: 5.1 - Conditional Heartbeat
        if: always() && steps.archive.outputs.stagnation_rate < 100
        env: { GH_TOKEN: "${{ secrets.COMMANDER_PAT }}", OBJ: "${{ github.event.inputs.custom_objective }}" }
        run: |
          echo "Evolution continues. Current Atoms: $(ls knowledge_base/*.py | wc -l)"
          sleep 600
          gh workflow run "🧠 PHOENIX SAPIENS" -f custom_objective="$OBJ"

      - name: 5.2 - Final Saturation Report
        if: always() && steps.archive.outputs.stagnation_rate >= 100
        run: |
          echo "🏁 EVOLUTION COMPLETE: Absolute saturation reached."
